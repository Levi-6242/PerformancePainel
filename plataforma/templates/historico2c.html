<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico 2C — Grid Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --bd:#e3e7eb; --tx:#1f2933; --mut:#6b7280;
    --grn:#15803d; --blu:#0369a1; --amb:#d97706; --red:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Poppins',system-ui,Segoe UI,Arial,sans-serif;font-size:14px}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .back{font-size:13px;color:var(--mut);border:1px solid var(--bd);background:#fff;padding:6px 12px;border-radius:8px}
  .back:hover{background:#f0f2f5}
  h1{font-size:20px;font-weight:700;margin:0}
  .sub{color:var(--mut);font-size:12.5px;margin:2px 0 16px}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);
            border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .controls label{font-size:12px;color:var(--mut);font-weight:500;margin-right:6px}
  select{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);min-width:170px}
  .usinas{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .ub{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.1;color:var(--tx)}
  .ub small{display:block;color:var(--mut);font-size:10.5px;font-weight:400;margin-top:2px}
  .ub:hover{border-color:#c7ccd2}
  .ub.active{border-color:var(--grn);background:#f0fdf4;box-shadow:inset 0 0 0 1px var(--grn)}
  .ub.empty{opacity:.5;cursor:not-allowed}
  .sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .sec h2{font-size:14px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .sec .h-sub{color:var(--mut);font-size:11.5px;margin:0 0 10px}
  .tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#eef2f6;color:var(--mut)}
  .grid-inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
  .invcard{border:1px solid var(--bd);border-radius:10px;padding:8px 10px 4px}
  .invcard .t{font-size:12.5px;font-weight:600;margin:0 0 4px}
  .invcard .t span{color:var(--mut);font-weight:400;font-size:11px}
  .plot{width:100%;height:220px}
  .plot-tall{height:300px}
  .msg{color:var(--mut);font-size:13px;padding:18px 4px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--grn);border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/">← Início</a> <a class="back" href="/tempo-real" style="margin-left:8px">Monitoramento</a>
    <h1>Histórico 2C</h1>
  </header>
  <div class="sub">Banco de dados por dia (e-mails do 2C/Owen) — curvas de 5 em 5 minutos. ARA · IPX · STL · TUP.</div>

  <div class="controls">
    <div><label>Data</label><select id="selData"><option>carregando…</option></select></div>
    <div class="usinas" id="usinas"></div>
  </div>

  <div id="conteudo"><div class="msg"><span class="spin"></span>Carregando…</div></div>
</div>

<script>
const PAL=['#0369a1','#15803d','#d97706','#7c3aed','#db2777','#0891b2','#65a30d','#dc2626','#2563eb','#ca8a04','#0d9488','#9333ea'];
let DIAS=[], USINAS=[], curData=null, curUsina=null;

const $=s=>document.querySelector(s);
function fmtData(d){const[a,m,x]=d.split('-');return `${x}/${m}/${a}`;}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}

const baseLayout=(extra={})=>Object.assign({
  margin:{l:46,r:12,t:8,b:34},showlegend:false,hovermode:'closest',
  font:{family:'Poppins,system-ui,sans-serif',size:10.5,color:'#374151'},
  paper_bgcolor:'#fff',plot_bgcolor:'#fff',
  xaxis:{gridcolor:'#eef1f4',tickfont:{size:9.5}},
  yaxis:{gridcolor:'#eef1f4',zeroline:false}
},extra);
const cfg={displayModeBar:false,responsive:true};

async function init(){
  try{
    const d=await getJSON('/api/2c/dias');
    DIAS=d.dias||[]; USINAS=d.usinas||[];
    const sel=$('#selData');
    if(!DIAS.length){sel.innerHTML='<option>sem dados</option>';$('#conteudo').innerHTML='<div class="sec"><div class="msg">Nenhum dia arquivado ainda em 2C_historico.</div></div>';return;}
    sel.innerHTML=DIAS.map(x=>`<option value="${x}">${fmtData(x)}</option>`).join('');
    sel.value=DIAS[0];
    sel.onchange=()=>loadData(sel.value);
    loadData(DIAS[0]);
  }catch(e){$('#conteudo').innerHTML='<div class="sec"><div class="msg">Erro ao carregar dias: '+e+'</div></div>';}
}

async function loadData(date){
  curData=date; curUsina=null;
  $('#usinas').innerHTML='';
  $('#conteudo').innerHTML='<div class="msg"><span class="spin"></span>Lendo o dia '+fmtData(date)+'…</div>';
  let ov;
  try{ ov=await getJSON('/api/2c/'+date); }
  catch(e){ $('#conteudo').innerHTML='<div class="sec"><div class="msg">Erro: '+e+'</div></div>'; return; }
  const cards=ov.usinas||[];
  $('#usinas').innerHTML=cards.map(u=>{
    const cls=u.tem_dados?'ub':'ub empty';
    return `<button class="${cls}" data-u="${u.id}" ${u.tem_dados?'':'disabled'}>
      ${u.nome}<small>${u.inversores} inv · ${u.strings} str · ${u.trackers} trk</small></button>`;
  }).join('');
  document.querySelectorAll('#usinas .ub').forEach(b=>{
    if(!b.classList.contains('empty')) b.onclick=()=>selUsina(b.dataset.u);
  });
  const first=cards.find(u=>u.tem_dados);
  if(first) selUsina(first.id);
  else $('#conteudo').innerHTML='<div class="sec"><div class="msg">Nenhuma usina com dado nesse dia.</div></div>';
}

function selUsina(u){
  curUsina=u;
  document.querySelectorAll('#usinas .ub').forEach(b=>b.classList.toggle('active',b.dataset.u===u));
  loadUsina(curData,u);
}

async function loadUsina(date,usina){
  $('#conteudo').innerHTML=`
    <div class="sec" id="sec-etm"><h2>Irradiância (ETM) <span class="tag">GHI / POA</span></h2>
      <div class="h-sub" id="etm-sub"></div><div id="etm-plot" class="plot plot-tall"></div></div>
    <div class="sec" id="sec-trk"><h2>Trackers <span class="tag">ângulo alvo × atual</span></h2>
      <div class="h-sub" id="trk-sub"></div><div id="trk-plot" class="plot plot-tall"></div></div>
    <div class="sec" id="sec-str"><h2>Strings <span class="tag">corrente por string (A)</span></h2>
      <div class="h-sub" id="str-sub"><span class="spin"></span>carregando inversores…</div>
      <div class="grid-inv" id="str-grid"></div></div>`;
  loadETM(date,usina); loadTRK(date,usina); loadSTR(date,usina);
}

async function loadETM(date,usina){
  try{
    const d=await getJSON(`/api/2c/${date}/etm/${usina}`);
    if(!d.labels.length){$('#etm-sub').textContent='Sem dado de ETM nesse dia.';$('#etm-plot').innerHTML='';return;}
    $('#etm-sub').textContent=`${d.labels.length} leituras • ${d.usina}`;
    const tr=[];
    if(d.ghi.some(v=>v!=null)) tr.push({x:d.labels,y:d.ghi,name:'GHI',mode:'lines',line:{color:'#0ea5e9',width:2},connectgaps:false});
    if(d.poa.some(v=>v!=null)) tr.push({x:d.labels,y:d.poa,name:'POA',mode:'lines',line:{color:'#d97706',width:2},connectgaps:false});
    Plotly.newPlot('etm-plot',tr,baseLayout({showlegend:true,legend:{orientation:'h',y:1.12,x:0},yaxis:{title:{text:'W/m²',font:{size:10}},gridcolor:'#eef1f4'}}),cfg);
  }catch(e){$('#etm-sub').textContent='Erro ETM: '+e;}
}

async function loadTRK(date,usina){
  try{
    const d=await getJSON(`/api/2c/${date}/trackers/${usina}`);
    if(!d.trackers.length){$('#trk-sub').textContent='Sem dado de trackers nesse dia.';$('#trk-plot').innerHTML='';return;}
    $('#trk-sub').textContent=`${d.trackers.length} trackers • ${d.usina}`;
    const tr=d.trackers.map((t,i)=>({x:t.x,y:t.y,name:t.id,mode:'lines',line:{color:'#94a3b8',width:1},opacity:.65,hoverinfo:'name+y'}));
    if(d.alvo) tr.push({x:d.alvo.x,y:d.alvo.y,name:'Alvo',mode:'lines',line:{color:'#d97706',width:2.4,dash:'dash'}});
    Plotly.newPlot('trk-plot',tr,baseLayout({yaxis:{title:{text:'graus',font:{size:10}},gridcolor:'#eef1f4'}}),cfg);
  }catch(e){$('#trk-sub').textContent='Erro trackers: '+e;}
}

async function loadSTR(date,usina){
  try{
    const d=await getJSON(`/api/2c/${date}/strings/${usina}`);
    const invs=d.inversores||[];
    if(!invs.length){$('#str-sub').textContent='Sem dado de strings nesse dia.';return;}
    const totStr=invs.reduce((a,b)=>a+b.strings.length,0);
    $('#str-sub').textContent=`${invs.length} inversores • ${totStr} strings • ${d.usina}`;
    const grid=$('#str-grid'); grid.innerHTML='';
    invs.forEach((inv,k)=>{
      const id='str-'+k;
      const div=document.createElement('div');
      div.className='invcard';
      div.innerHTML=`<div class="t">Inversor ${inv.inv} <span>(${inv.strings.length} strings)</span></div><div id="${id}" class="plot"></div>`;
      grid.appendChild(div);
      const tr=inv.strings.map((s,i)=>({x:inv.labels,y:s.y,name:'ST'+s.id,mode:'lines',
        line:{color:PAL[i%PAL.length],width:1.3},connectgaps:false,hoverinfo:'name+y'}));
      Plotly.newPlot(id,tr,baseLayout({yaxis:{title:{text:'A',font:{size:9}},gridcolor:'#eef1f4'}}),cfg);
    });
  }catch(e){$('#str-sub').textContent='Erro strings: '+e;}
}

init();
</script>
</body>
</html>
