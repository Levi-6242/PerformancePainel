<!doctype html>
{% raw %}
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Análise das usinas</title>
<script>
// O tema do Nexus antes da 1ª pintura (o cookie nexus_tema ou o localStorage nexus.tema), como nas outras telas
(function(){
  var raiz = document.documentElement;
  function aplica(t){ if(t === 'claro' || t === 'escuro') raiz.setAttribute('data-tema', t); }
  try {
    var c = document.cookie.match(/(?:^|;\s*)nexus_tema=(claro|escuro)(?:;|$)/);
    aplica(c ? c[1] : localStorage.getItem('nexus.tema'));
  } catch(e) {}
  window.addEventListener('storage', function(ev){ if(ev.key === 'nexus.tema') aplica(ev.newValue); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Análise das usinas (25/11/2026): o desenho aprovado pelo Levi no mockup (docs/mockups/analise-da-usina, local) e as
     regras em docs/analise-das-usinas.md. O CSS veio do mockup na entrega 1; daqui em diante se edita aqui. Tema navy +
     verde Grid, um nível de superfície, a cor só no estado; o tema claro do Nexus logo abaixo. */  :root{--fundo:#090d18;--sup:#161d30;--sup2:#1b2338;--linha:#232d45;--linha2:#2e3a57;--tinta:#eef2f8;--mudo:#a9b5c7;--fraco:#7d8aa0;
        --verde:#a3d900;--ok:#4ade80;--alerta:#ffd83d;--severo:#ff8f3c;--critico:#ff5b6e;--info:#7cb7ff;--neutro:#8a96ab;
        --c-ger:#5aa9f5;--c-poa:#f59a4a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fundo);color:var(--tinta);font:400 13.5px/1.5 Poppins,"Segoe UI",system-ui,sans-serif}
  .pag{max-width:1360px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
  .num{font-variant-numeric:tabular-nums}
  button{font:inherit}
  a{color:var(--info);text-decoration:none}
  /* topo */
  .topo{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
  .olho{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--verde);font-weight:600;display:flex;gap:8px;align-items:center}
  .volta{all:unset;cursor:pointer;color:var(--verde);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .volta:hover{text-decoration:underline}
  h1{margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.01em}
  .ficha{color:var(--mudo);font-size:12.5px}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .filtros label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo);font-weight:500}
  .campo{background:var(--sup);border:1px solid var(--linha2);color:var(--tinta);border-radius:10px;height:36px;padding:0 12px;font:inherit;font-size:13px;min-width:0;text-transform:none;letter-spacing:0}
  .campo:focus{outline:none;border-color:var(--verde)}
  .toast{background:var(--sup2);border:1px solid var(--linha2);border-left:3px solid var(--info);border-radius:10px;padding:9px 14px;font-size:13px}
  /* blocos */
  .bloco{background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:16px 18px;min-width:0}
  .cab{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cab h2{margin:0;font-size:15px;font-weight:600}
  .cab .sub{color:var(--mudo);font-size:12px}
  /* troca (botões juntos): grande o bastante para clicar */
  .seg{display:inline-flex;background:var(--fundo);border:1px solid var(--linha2);border-radius:10px;padding:3px;gap:3px}
  .seg button{border:0;background:none;color:var(--mudo);font-size:12.5px;font-weight:500;height:30px;padding:0 14px;border-radius:7px;cursor:pointer}
  .seg button:hover{color:var(--tinta)}
  .seg button[aria-pressed="true"]{background:var(--verde);color:#0b1020;font-weight:600}
  .btn{border:1px solid var(--linha2);background:none;color:var(--tinta);height:32px;padding:0 14px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:500}
  .btn:hover{border-color:var(--verde)}
  .btn[aria-expanded="true"]{border-color:var(--verde);color:var(--verde)}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:0}
  .kpi{padding:14px 18px;border-left:1px solid var(--linha);min-width:0}
  .kpi:first-child{border-left:0}
  .kpi .r{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mudo);font-weight:500}
  .kpi .v{font-size:24px;font-weight:600;margin:2px 0 4px;line-height:1.2}
  .kpi .e{color:var(--mudo);font-size:12px}
  .kpi .e b{color:var(--tinta);font-weight:600}
  /* visão geral */
  .rola{overflow-x:auto}
  table.us{border-collapse:collapse;width:100%;min-width:880px;font-size:13px}
  .us th{color:var(--mudo);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:8px 10px;border-bottom:1px solid var(--linha2);white-space:nowrap;position:sticky;top:0;background:var(--sup);cursor:pointer;user-select:none}
  .us th:hover{color:var(--tinta)}
  .us th.esq,.us td.esq{text-align:left}
  .us td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
  .us tbody tr{cursor:pointer}
  .us tbody tr:hover td{background:var(--sup2)}
  .us .cli{color:var(--mudo);font-size:12px}
  .us .bar{display:inline-block;width:90px;height:6px;background:var(--linha2);border-radius:3px;position:relative;vertical-align:middle;margin-left:10px}
  .us .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
  .us .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);opacity:.55}
  .us .sem{color:var(--fraco)}
  .tabela-us{max-height:640px;overflow:auto}
  .grupos{display:flex;flex-wrap:wrap;gap:14px}
  .grupo{flex:1 1 100%;background:transparent;border:1px solid var(--linha2);border-radius:12px;padding:10px 12px 12px}
  .gcab{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;cursor:pointer;padding:4px 4px 6px;border-radius:8px}
  .gcab:hover{background:var(--sup)}
  .gcab:focus-visible{outline:2px solid var(--verde)}
  .gcab .l1{display:flex;gap:10px;align-items:center}
  .gcab .l2{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--mudo);padding-left:24px}
  .gcab .l2 b{font-weight:600}
  .gcab .seta{color:var(--mudo);font-size:13px;width:14px}
  .gcab .nome{font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .gcab .nome small{font-weight:400;letter-spacing:0;text-transform:none;color:var(--mudo);font-size:12px;margin-left:6px}
  .sinais{display:flex;gap:10px;font-size:12px;color:var(--mudo);margin-left:auto}
  .sinais span{display:inline-flex;gap:5px;align-items:center}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,204px);gap:10px;margin-top:8px}
  .tiles.solto{margin-top:0}
  .tile{box-sizing:border-box;position:relative;width:204px;background:var(--sup);border:1px solid var(--linha);border-top:3px solid var(--neutro);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;color:var(--tinta)}
  .tile:hover{background:var(--sup2);border-color:var(--linha2)}
  .tile:focus-visible{outline:2px solid var(--verde)}
  .tile .tn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
  .tile .tc{font-size:11.5px;color:var(--mudo);margin-top:-3px}
  .tile .tv{font-size:22px;font-weight:600;line-height:1.15}
  .tile .tv span{font-size:11.5px;font-weight:400;color:var(--mudo)}
  .tile .tb{height:5px;background:var(--linha2);border-radius:3px;position:relative;margin:3px 0 5px}
  .tile .tb i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
  .tile .tb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);opacity:.6}
  .tile .tl{display:flex;gap:6px;align-items:baseline;font-size:12.5px}
  .tile .tl>span:first-child{color:var(--mudo);min-width:38px}
  .tile .tl b{font-weight:600}
  .tile .tl .m{margin-left:auto;color:var(--mudo);font-size:11.5px}
  .tile .oc{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;border:1px solid var(--linha2);background:var(--fundo);color:var(--mudo);display:grid;place-items:center;cursor:pointer;opacity:0}
  .tile:hover .oc,.tile:focus-within .oc{opacity:1}
  .tile .oc:hover{color:var(--tinta);border-color:var(--critico)}
  .tile .oc svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  #menu{position:fixed;z-index:20;min-width:210px;background:var(--sup2);border:1px solid var(--linha2);border-radius:10px;padding:5px;box-shadow:0 12px 30px rgba(0,0,0,.45);display:flex;flex-direction:column}
  #menu[hidden]{display:none}
  #menu .mn-t{font-size:11.5px;color:var(--mudo);padding:5px 10px 6px;border-bottom:1px solid var(--linha2);margin-bottom:4px}
  #menu button{all:unset;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
  #menu button:hover{background:var(--linha)}
  /* a barra e o painel de filtros, no molde do Histórico de OS do OS Creator */
  .barra{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .busca{position:relative;flex:0 1 320px;min-width:220px}
  .busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--mudo);stroke-width:2;stroke-linecap:round}
  .busca input{width:100%;height:36px;box-sizing:border-box;padding:0 12px 0 34px;border-radius:10px;border:1px solid var(--linha2);background:var(--sup);color:var(--tinta);font:inherit;font-size:13px}
  .busca input:focus{outline:none;border-color:var(--verde)}
  .fl-bt{display:inline-flex;align-items:center;gap:7px;height:36px}
  .fl-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--verde);color:#0b1020;font-weight:700;font-size:11px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border-radius:999px;border:1px solid var(--linha2);background:var(--sup2);font-size:12px}
  .chip button,.pil button{border:0;background:none;color:var(--mudo);font-size:15px;line-height:1;cursor:pointer;padding:0 4px}
  .chip button:hover,.pil button:hover{color:var(--tinta)}
  .barra .dir{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
  .barra .btn{height:36px}
  .barra .btn b{color:var(--verde)}
  .lnk{border:0;background:none;color:var(--info);cursor:pointer;font:inherit;font-size:12.5px;padding:0}
  .lnk:hover{text-decoration:underline}
  .btn.prim{background:var(--verde);border-color:var(--verde);color:#0b1020;font-weight:600}
  .fl-painel{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:min(880px,100%);box-sizing:border-box;padding:14px 16px;border-radius:12px;border:1px solid var(--linha2);background:var(--sup);box-shadow:0 14px 34px rgba(0,0,0,.5)}
  .oc-painel{left:auto;right:0;width:min(440px,100%)}
  .fl-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .fl-cab h3{margin:0;font-size:13.5px;font-weight:600}
  .fl-x{border:0;background:none;color:var(--mudo);font-size:22px;line-height:1;cursor:pointer}
  .fl-x:hover{color:var(--tinta)}
  .fl-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 14px}
  .fl-c{display:flex;flex-direction:column;gap:5px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo);font-weight:500}
  .fl-c .campo,.fl-c .seg{text-transform:none;letter-spacing:0}
  .multi{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:36px;padding:3px 6px;border:1px solid var(--linha2);border-radius:10px;background:var(--fundo);text-transform:none;letter-spacing:0}
  .multi:focus-within{border-color:var(--verde)}
  .multi input{flex:1;min-width:90px;border:0;background:none;color:var(--tinta);font:inherit;font-size:13px;height:28px;outline:none}
  .pil{display:inline-flex;align-items:center;gap:2px;padding:1px 2px 1px 9px;border-radius:999px;background:var(--sup2);border:1px solid var(--linha2);font-size:12px;color:var(--tinta);font-weight:400}
  .opcoes{display:flex;flex-wrap:wrap;gap:6px;text-transform:none;letter-spacing:0}
  .opc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--linha2);background:none;color:var(--mudo);cursor:pointer;font-size:12.5px;font-weight:500}
  .opc[aria-pressed="true"]{border-color:var(--verde);color:var(--tinta);background:var(--sup2)}
  .par{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:12.5px}
  .par .campo{width:100%;min-width:0;background:var(--fundo)}
  .fl-pe{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linha)}
  .contagem{display:flex;gap:14px;align-items:center;color:var(--mudo);font-size:12.5px;margin:-4px 0 -2px}

  /* diagnóstico */
  .parecer{display:flex;gap:14px;align-items:center;border-left:3px solid var(--critico)}
  .parecer .selo{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 9px}
  .parecer p{margin:0;font-size:15px;line-height:1.55}
  .parecer strong{font-weight:600}
  .ponte-g{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:center}
  svg text{font-family:inherit}
  .resumo{display:flex;flex-direction:column;gap:12px}
  .resumo .it{border-left:3px solid var(--linha2);padding:2px 0 2px 12px}
  .resumo .r{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mudo);font-weight:500}
  .resumo .v{font-size:20px;font-weight:600}
  .resumo .e{font-size:12px;color:var(--mudo)}
  .legenda{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mudo);font-size:12px}
  .legenda i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .alerta-l{margin-top:10px;border:1px solid color-mix(in srgb,var(--critico) 45%,transparent);border-radius:8px;padding:8px 12px;font-size:13px}
  /* dia a dia */
  .dia-faixa{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:14px;padding-top:14px;border-top:1px solid var(--linha);align-items:start}
  .dia-faixa h3{margin:0 0 8px;font-size:15px;font-weight:600}
  .quatro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .quatro div{background:var(--fundo);border-radius:8px;padding:7px 10px}
  .quatro .r{font-size:10.5px;color:var(--mudo);text-transform:uppercase;letter-spacing:.06em}
  .quatro .v{font-size:17px;font-weight:600}
  .quatro .e{font-size:11.5px;color:var(--mudo)}
  .tit{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mudo);font-weight:500;margin:0 0 6px}
  .lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .lista li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--linha);font-size:13px}
  .lista li:first-child{border-top:0;padding-top:0}
  .lista .k{flex:none;color:var(--mudo);font-size:12px;min-width:66px;text-align:right}
  .ponto{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
  .tag{border:1px solid var(--linha2);border-radius:999px;padding:0 8px;font-size:11px;color:var(--mudo);white-space:nowrap}
  .tag.os{border-color:color-mix(in srgb,var(--info) 50%,transparent);color:var(--info)}
  .exp{position:relative;align-self:flex-end}
  .exp .btn{display:inline-flex;gap:7px;align-items:center;height:36px}
  .exp svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .exp-p{position:absolute;right:0;top:calc(100% + 6px);z-index:45;min-width:250px;background:var(--sup);border:1px solid var(--linha2);border-radius:12px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
  .exp-p button{all:unset;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
  .exp-p button:hover,.exp-p button:focus-visible{background:var(--linha)}
  .exp-p b{font-weight:600;font-size:13px}
  .exp-p small{color:var(--mudo);font-size:11.5px}
  .conta b{font-weight:600;color:var(--tinta)}
  .cob{font-size:12.5px;border-left:3px solid var(--linha2);padding:2px 0 2px 10px;line-height:1.4}
  .cob-ok{border-color:var(--ok)}.cob-alerta{border-color:var(--alerta)}.cob-critico{border-color:var(--critico)}
  .obs-l{margin-top:12px;padding-top:10px;border-top:1px solid var(--linha)}
  .obs-l .ob{font-size:13px;padding:4px 0;color:var(--tinta)}
  .obs-l .ob span{color:var(--mudo)}
  .cab-rec{all:unset;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;width:100%;cursor:pointer;border-radius:8px}
  .cab-rec:focus-visible{outline:2px solid var(--verde)}
  .cab-rec h2{margin:0;font-size:15px;font-weight:600}
  .cab-rec .seta{color:var(--mudo);font-size:13px;display:inline-block;width:14px}
  .cab-rec:hover .sub{color:var(--tinta)}
  #ach:has(.cab-rec[aria-expanded="true"]) .cab-rec{margin-bottom:12px}
  .obs{max-width:300px;white-space:normal!important;text-align:left!important;cursor:text;font-size:12.5px;color:var(--tinta)}
  .obs-add{color:var(--fraco)}
  tr.l:hover .obs-add{color:var(--info)}
  .obs-in{width:100%;min-width:220px;box-sizing:border-box;height:30px;padding:0 9px;border-radius:8px;border:1px solid var(--verde);background:var(--fundo);color:var(--tinta);font:inherit;font-size:12.5px;outline:none}
  .osd .met{color:var(--mudo);font-size:12px;cursor:help;text-decoration:underline dotted}
  .dd{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
  .dd-r{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mudo);font-weight:500}
  .dd-bt{display:flex;align-items:center;gap:8px;height:36px;min-width:150px;padding:0 10px 0 12px;border-radius:10px;border:1px solid var(--linha2);background:var(--sup);color:var(--tinta);font-size:13px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400}
  .dd-bt:hover,.dd-bt[aria-expanded="true"]{border-color:var(--verde)}
  .dd-v{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dd-v.vazio{color:var(--mudo)}
  .dd-n{font-size:11px;font-weight:700;color:#0b1020;background:var(--verde);border-radius:9px;padding:1px 6px}
  .dd-bt svg{width:16px;height:16px;fill:none;stroke:var(--mudo);stroke-width:2;flex:none}
  .dd-p{position:absolute;top:calc(100% + 6px);left:0;z-index:40;max-width:calc(100vw - 32px);box-sizing:border-box;padding:8px;border-radius:12px;border:1px solid var(--linha2);background:var(--sup);box-shadow:0 14px 34px rgba(0,0,0,.5);text-transform:none;letter-spacing:0;font-weight:400}

  if (!w) { AVISO = "O navegador bloqueou a janela do relatório: libere as janelas desta página e tente de novo."; tudo(); return; }
  w.document.open(); w.document.write(htmlPdf()); w.document.close();
}

/* ── ler, gravar e montar ──────────────────────────────────────────────────────────────────────────────────────────── */
async function ler() {
  LENDO = true; ERRO = ""; tudo();
  try {
    const r = await fetch("/api/analise/usinas?mes=" + encodeURIComponent(MES), {credentials: "same-origin"});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || ("HTTP " + r.status));
    V = j;
  } catch (e) { ERRO = String(e && e.message || e); }
  LENDO = false; tudo();
}
async function gravaOculta(usina, oc) {
  try {
    const r = await (EU.grava ? EU.grava("/api/analise/ocultas", {usina, oculta: oc}) : fetch("/api/analise/ocultas", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({usina, oculta: oc})}).then(x => x.json()));
    const mapa = (r && r.ocultas) || {};
    V.usinas.forEach(u => { const k = Object.keys(mapa).find(x => nrm(x) === nrm(u.u)); u.oculta = k ? mapa[k] : null; });
    AVISO = "";
  } catch (e) { AVISO = "Não deu para gravar: " + esc(String(e && e.message || e)); }
  tudo();
}
function abrirUsina(u) { lerUsina(u, MES); }        // o diagnóstico da usina, no mês da visão inicial
function voltarGeral() {
  VIEW = "geral"; AVISO = ""; history.pushState({}, "", location.pathname); scrollTo(0, 0);
  if (!V) ler(); else tudo();
}
function tudo() {
  const y = scrollY;
  if (VIEW === "usina") { $("#pag").innerHTML = diagnostico(); scrollTo(0, y); return; }
  $("#pag").innerHTML = !V ? (ERRO ? `<div class="toast" style="border-left-color:var(--critico)">A Análise das usinas não leu agora: ${esc(ERRO)}. <button class="lnk" data-reler="1">Tentar de novo</button></div>` : `<div class="toast">Lendo as usinas…</div>`)
    : geral() + (ERRO ? `<div class="toast" style="border-left-color:var(--critico)">A última leitura falhou (${esc(ERRO)}); mostrando a anterior.</div>` : "");
  scrollTo(0, y);
}

const tip = $("#tip"), menu = $("#menu");
// o botão direito no card: abrir ou ocultar a usina
document.addEventListener("contextmenu", e => {
  const t = e.target.closest(".tile[data-usina]");
  if (!t) return;
  e.preventDefault();
  const u = t.getAttribute("data-usina");
  menu.innerHTML = `<div class="mn-t">${esc(u)}</div><button data-menu="abrir" data-u="${esc(u)}">Abrir a usina</button>${PODE ? `<button data-menu="ocultar" data-u="${esc(u)}">Ocultar usina (para a equipe)</button>` : ""}`;
  menu.hidden = false;
  menu.style.left = Math.min(innerWidth - 250, e.clientX) + "px";
  menu.style.top = Math.min(innerHeight - 120, e.clientY) + "px";
});
const foca = (sel, p) => { const f = $(sel); if (!f) return; f.focus(); if (p != null) f.setSelectionRange(p, p); };
document.addEventListener("click", e => {
  const t = e.target, q = s => t.closest(s);
  let x;
  if (!menu.hidden && !q("#menu")) menu.hidden = true;
  let fechou = false;
  if (ABERTO_DD && !q(`.dd[data-dd="${ABERTO_DD}"]`)) { ABERTO_DD = null; fechou = true; }
  if ((x = q("[data-ddab]"))) { const id = x.getAttribute("data-ddab"); ABERTO_DD = ABERTO_DD === id ? null : id; tudo(); foca(`[data-ddq="${id}"]`); return; }
  if ((x = q("[data-ddi]"))) { aoEscolher(x.getAttribute("data-ddi"), x.getAttribute("data-v")); if (ABERTO_DD) foca(`[data-ddq="${ABERTO_DD}"]`); return; }
  if ((x = q("[data-ddlimpa]"))) { limparDd(x.getAttribute("data-ddlimpa")); return; }
  if ((x = q("[data-reler]"))) { ler(); return; }
  if ((x = q("[data-exp]"))) { exportarPdf(); return; }
  if ((x = q("[data-menu]"))) { const u = x.getAttribute("data-u"); menu.hidden = true;
    if (x.getAttribute("data-menu") === "ocultar") gravaOculta(u, true); else abrirUsina(u); return; }
  // os filtros: o painel trabalha num rascunho (FLD); Aplicar vale, × e Esc voltam ao que estava
  if ((x = q("[data-fl]"))) { const a = x.getAttribute("data-fl");
    if (a === "abrir") { FLD = FLD ? null : JSON.parse(JSON.stringify(FL)); VER_OC = false; }
    else if (a === "fechar") FLD = null;
    else if (a === "aplicar") { FL = FLD; FLD = null; }
    else if (a === "limpar") FLD = FL0();
    else if (a === "limpar-ja") FL = FL0();
    tudo(); return; }
  if ((x = q("[data-flx]"))) { const [k, v] = x.getAttribute("data-flx").split("|");
    if (k === "cli" || k === "sit") FL[k] = FL[k].filter(y => y !== v); else if (k === "sem") FL.sem = "todas"; else FL[k] = "";
    tudo(); return; }
  if ((x = q("[data-flsit]"))) { const s = x.getAttribute("data-flsit"); FLD.sit = FLD.sit.includes(s) ? FLD.sit.filter(y => y !== s) : [...FLD.sit, s]; tudo(); return; }
  if ((x = q("[data-flsem]"))) { FLD.sem = x.getAttribute("data-flsem"); tudo(); return; }
  if ((x = q("[data-oc]"))) { VER_OC = x.getAttribute("data-oc") === "abrir" ? !VER_OC : false; if (VER_OC) FLD = null; tudo(); return; }
  if ((x = q("[data-mostrar]"))) { const u = x.getAttribute("data-mostrar");
    if (u === "*") ocultas().reduce((p, o) => p.then(() => gravaOculta(o.u, false)), Promise.resolve()); else gravaOculta(u, false); return; }
  if ((x = q("[data-ocultar]"))) { gravaOculta(x.getAttribute("data-ocultar"), true); return; }
  if ((x = q("[data-agr]"))) { AGR = x.getAttribute("data-agr"); tudo(); return; }
  if ((x = q("[data-vista]"))) { VISTA = x.getAttribute("data-vista"); tudo(); return; }
  if ((x = q("[data-cli]"))) { const c = x.getAttribute("data-cli"); if (FECHADOS.has(c)) FECHADOS.delete(c); else FECHADOS.add(c); tudo(); return; }
  if ((x = q("[data-todos]"))) { if (FECHADOS.size) FECHADOS.clear(); else V.usinas.forEach(u => FECHADOS.add(u.c || "Sem cliente")); tudo(); return; }
  if ((x = q("[data-usina]"))) { abrirUsina(x.getAttribute("data-usina")); return; }
  if ((x = q("th[data-ord]"))) { const k = x.getAttribute("data-ord"); ORD = ORD.k === k ? {k, asc: !ORD.asc} : {k, asc: k !== "nos"}; tudo(); return; }
  if (fechou) tudo();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-ddq")) { const id = t.getAttribute("data-ddq"); DD_Q[id] = t.value; const p = t.selectionStart; tudo(); foca(`[data-ddq="${id}"]`, p); return; }
  if (t.id === "f-q") { Q = t.value; const p = t.selectionStart; tudo(); foca("#f-q", p); }
  if (t.hasAttribute && t.hasAttribute("data-fln") && FLD) FLD[t.getAttribute("data-fln")] = t.value.trim();
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches && e.target.matches(".tile[data-usina]")) { abrirUsina(e.target.getAttribute("data-usina")); return; }
  if (e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-ddq")) {
    const b = document.querySelector(`.dd[data-dd="${e.target.getAttribute("data-ddq")}"] .dd-i:not([disabled])`); if (b) b.click(); return; }
  if (e.key === "Enter" && FLD && e.target.hasAttribute && e.target.hasAttribute("data-fln")) { FL = FLD; FLD = null; tudo(); return; }
  if (e.key !== "Escape") return;
  if (ABERTO_DD) { ABERTO_DD = null; tudo(); return; }
  if (!menu.hidden) { menu.hidden = true; return; }
  if (FLD) { FLD = null; tudo(); return; }
  if (VER_OC) { VER_OC = false; tudo(); return; }
  if (VIEW === "usina" && !OBS_ED) voltarGeral();      // Esc no diagnóstico volta à visão inicial
});

/* ════════════════════════════════ DIAGNÓSTICO DA USINA (entregas 2 e 3, 26/11/2026) ════════════════════════════════
   O desenho aprovado no mockup (Santarém 2), para qualquer usina: lê /api/analise/usina (o diagnóstico, 10 min de
   cópia), /api/analise/usina/energia (a cascata, à parte: uns 24 s no mês corrente) e, só no clique, as curvas
   (/api/analise/curvas) e o gêmeo (/api/analise/gemeo). A observação do inversor grava em /api/analise/observacao. */
const SEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const MN = ["", "jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const CORES_INV = ["#5aa9f5", "#a3d900", "#f59a4a", "#e9eef6"];
const MET = {queda: ["pela POA", "Potência ÷ POA da hora antes e da hora depois, vezes a POA da janela; menos o que gerou"],
             inversor: ["pelos outros inversores", "A mediana da geração dos outros inversores no dia (BD); menos o que ele gerou"],
             dia_tipico: ["estimativa", "Sem curva do dia: a geração do dia vezes a fatia da janela num dia de sol típico"]};
const COMO = k => (MET[k] || [""])[0];
const brData = iso => iso ? String(iso).slice(0, 10).split("-").reverse().join("/") : "—";
const dataBR = iso => iso ? String(iso).slice(8, 10) + "/" + String(iso).slice(5, 7) : "";
const dd2 = d => String(d).padStart(2, "0");

let VIEW = "geral", U = null, UERR = "", ULENDO = false, UE = null, UEERR = "", UM = null, UMLENDO = false;
let DIA = null, MODO_DIA = "mes", PONTE = "mes", PR_MM = false, INV_ABERTO = null, ACH = null, ACH_REC = false, OBS_ED = null;
let CMP = [], CMP_D = [], CMP_G = "pot", CMP_GEO = null;
const SER = {ger: true, pr: true, poa: true};
const CURVAS = {}, GEMEO = {};            // {dia ISO: resposta} (ou {lendo: true}) das curvas e do gêmeo, lidos no clique

const ano = () => +String(U ? U.mes : MES).slice(0, 4), mesN = () => +String(U ? U.mes : MES).slice(5, 7);
const diaIso = d => `${U.mes}-${dd2(d)}`;
const nomeDia = d => `${dd2(d)}/${dd2(mesN())}, ${SEM[new Date(ano(), mesN() - 1, d).getDay()]}`;
const perdaTipo = (d, tipo) => U.ocorr.filter(o => o.d === d && (tipo === "queda" ? !/^inversor/i.test(o.escopo) : /^inversor/i.test(o.escopo))).reduce((a, o) => a + (o.perda || 0), 0) / 1000;
const perdaDia = d => U.ocorr.filter(o => o.d === d).reduce((a, o) => a + (o.perda || 0), 0) / 1000;
const perdaMes = () => U.ocorr.reduce((a, o) => a + (o.perda || 0), 0) / 1000;
const ehQueda = o => !/^inversor/i.test(o.escopo);
const geradoMes = () => U.dias.reduce((a, d) => a + (d.ger || 0), 0);
const metaPr = () => U.meta_pr || (U.ger.meta ? U.ger.meta / 100 : null);

/* ── ler ─────────────────────────────────────────────────────────────────────────────────────────────────────────── */
async function lerJson(url) {
  const r = await fetch(url, {credentials: "same-origin"});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || ("HTTP " + r.status));
  return j;
}
async function lerUsina(nome, mes, empurra = true) {
  VIEW = "usina"; U = null; UERR = ""; ULENDO = true; UE = null; UEERR = ""; UM = null; DIA = null; MODO_DIA = "mes"; PONTE = "mes"; PR_MM = false;
  INV_ABERTO = null; ACH = null; OBS_ED = null; CMP = []; CMP_D = []; AVISO = "";
  for (const k of Object.keys(CURVAS)) delete CURVAS[k];
  for (const k of Object.keys(GEMEO)) delete GEMEO[k];
  if (empurra) history.pushState({usina: nome, mes}, "", `?usina=${encodeURIComponent(nome)}&mes=${encodeURIComponent(mes)}`);
  scrollTo(0, 0); tudo();
  try {
    U = await lerJson(`/api/analise/usina?usina=${encodeURIComponent(nome)}&mes=${encodeURIComponent(mes)}`);
    const comDado = U.dias.filter(d => d.ger != null);
    DIA = U.sem_expl.length ? U.sem_expl[U.sem_expl.length - 1] : (comDado.length ? comDado[comDado.length - 1].d : null);
    const piores = U.invs.filter(v => v.pr != null).sort((a, b) => a.pr - b.pr);
    CMP = piores.slice(0, 2).map(v => v.n).concat(piores.length > 2 ? [piores[piores.length - 1].n] : []);
    CMP_D = DIA ? [DIA] : [];
  } catch (e) { UERR = String(e && e.message || e); }
  ULENDO = false; tudo();
  if (U) lerEnergia();
}
async function lerEnergia() {
  try { UE = await lerJson(`/api/analise/usina/energia?usina=${encodeURIComponent(U.usina)}&mes=${encodeURIComponent(U.mes)}`); }
  catch (e) { UEERR = String(e && e.message || e); }
  tudo();
}
async function lerMeses() {
  if (UM || UMLENDO) return;
  UMLENDO = true; tudo();
  try { UM = await lerJson(`/api/analise/usina/energia?usina=${encodeURIComponent(U.usina)}&mes=${encodeURIComponent(U.mes)}&meses=1`); }
  catch (e) { UM = {erro: String(e && e.message || e)}; }
  UMLENDO = false; tudo();
}
async function lerCurva(d) {
  const k = diaIso(d);
  if (CURVAS[k]) return;
  CURVAS[k] = {lendo: true}; tudo();
  try { CURVAS[k] = await lerJson(`/api/analise/curvas?usina=${encodeURIComponent(U.usina)}&dia=${k}`); }
  catch (e) { CURVAS[k] = {erro: String(e && e.message || e)}; }
  tudo();
}
async function lerGemeo(d) {
  const k = diaIso(d);
  if (GEMEO[k]) return;
  GEMEO[k] = {lendo: true}; tudo();
  try { GEMEO[k] = await lerJson(`/api/analise/gemeo?usina=${encodeURIComponent(U.usina)}&dia=${k}`); }
  catch (e) { GEMEO[k] = {erro: String(e && e.message || e)}; }
  tudo();
}
async function gravaObs(inv, texto) {
  try {
    const corpo = {usina: U.usina, inversor: inv, texto};
    const r = await (EU.grava ? EU.grava("/api/analise/observacao", corpo) : fetch("/api/analise/observacao", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)}).then(x => x.json()));
    const o = (r && r.obs) || {};
    U.invs.forEach(v => { v.obs = o[v.n] || null; });
    AVISO = "";
  } catch (e) { AVISO = "Não deu para gravar a observação: " + esc(String(e && e.message || e)); }
  tudo();
}

/* ── o topo, o parecer e os 5 números (a régua do topo é o Gerencial, decisão de 25/11/2026) ─────────────────────── */
function itensUsina() { return V ? V.usinas.map(u => ({v: u.u, t: u.u, sub: u.c})) : (U ? [{v: U.usina, t: U.usina, sub: U.cliente}] : []); }
function topoUsina() {
  const fic = [esc(U.cliente), U.local ? esc(U.local) : "", U.kwp ? n1(U.kwp, 0) + " kWp" : "", U.invs.length ? U.invs.length + " inversores" : "",
    U.n_trk_falhas ? (U.n_trk_falhas > 1 ? U.n_trk_falhas + " trackers pararam no mês" : "1 tracker parou no mês") : "", U.mob ? "mobilizada em " + brData(U.mob) : ""].filter(Boolean).join(" · ");
  return `<div class="topo"><div><div class="olho"><button class="volta" data-view="geral">← Análise das usinas</button></div><h1>${esc(U.usina)}</h1>
      <div class="ficha">${fic}</div></div>
    <div class="filtros">${menuSel("usina", "Usina", itensUsina(), [U.usina], {multi: false, larg: 330, largBt: 230, ph: "Digite a usina"})}${menuSel("mesu", "Mês", ITENS_MES, [U.mes], {multi: false, larg: 250, largBt: 200})}${botaoExportar()}</div></div>
    ${AVISO ? `<div class="toast">${AVISO}</div>` : ""}`;
}
function parecer() {
  const g = U.ger, at = g.at != null ? g.at / 100 : null, rpr = g.pr != null && g.meta ? g.pr / g.meta : null;
  const cor = [at == null ? "neutro" : sem3(at), rpr == null ? "neutro" : sem3(rpr), semDisp(U.disp.mes)].filter(x => x !== "neutro").sort((a, b) => ORDEM_SEM[a] - ORDEM_SEM[b])[0] || "neutro";
  const of = U.ofensores[0], pm = perdaMes();
  const txt = at == null ? `Sem a geração do mês no Gerencial${g.motivo ? ` (${esc(g.motivo)})` : ""}.`
    : `Gerou <strong>${n1(g.at, 0)}% do P50</strong> com PR de <strong>${n1(g.pr)}%</strong>${g.meta ? ` (meta ${n1(g.meta)}%)` : ""}.`
      + (pm > 0.05 ? ` As ocorrências do COS tiraram <strong>${n1(pm)} MWh</strong>.` : "")
      + (of ? ` Comece por <strong>${esc(of.t.toLowerCase())}</strong>: ${esc(of.s)}.` : " Nenhum ofensor no mês.");
  return `<section class="bloco parecer" style="border-left-color:${COR[cor]}"><span class="selo" style="color:${COR[cor]};border:1px solid ${COR[cor]}">${cor === "ok" ? "No esperado" : cor === "neutro" ? "Sem dado" : "Abaixo do esperado"}</span><p>${txt}</p></section>`;
}
function kpisUsina() {
  const g = U.ger, at = g.at != null ? g.at / 100 : null, pm = perdaMes(), oss = new Set(U.ocorr.map(o => o.os));
  const ab = new Set(U.ocorr.filter(o => o.aberta).map(o => o.os)), qd = new Set(U.ocorr.filter(ehQueda).map(o => o.os));
  const k = [
    ["Geração × P50", at == null ? "—" : n1(g.at) + "%", at == null ? "neutro" : sem3(at), at == null ? esc(g.motivo || "sem dado") : `<b>${n1(g.prod)}</b> de ${n1(g.p50)} MWh · ${g.dias || "—"} dias`],
    ["PR", g.pr == null ? "—" : n1(g.pr) + "%", g.pr != null && g.meta ? sem3(g.pr / g.meta) : "neutro", g.meta ? `meta <b>${n1(g.meta)}%</b>${g.pr != null ? " · " + pp(g.pr - g.meta) : ""}` : "sem meta"],
    ["Disponibilidade", U.disp.mes == null ? "—" : n1(U.disp.mes) + "%", semDisp(U.disp.mes), U.disp.mes == null ? "a régua do COS não cobre a usina" : `${n1(U.disp.h, 1)} h perdidas · ocorrências do COS`],
    ["Perda nas ocorrências", n1(pm) + " MWh", pm <= 0 ? "ok" : g.prod && pm / (g.prod + pm) > .05 ? "critico" : "alerta", g.prod ? `sem elas geraria <b>${n1(g.prod + pm)}</b> MWh${g.p50 ? " · " + n1((g.prod + pm) / g.p50 * 100, 0) + "% do P50" : ""}` : ""],
    ["Ocorrências do COS", String(oss.size), oss.size ? "alerta" : "ok", `${ab.size} aberta${ab.size === 1 ? "" : "s"} · ${qd.size} queda${qd.size === 1 ? "" : "s"} no mês`],
  ];
  return `<section class="bloco kpis">${k.map(x => `<div class="kpi"><div class="r">${x[0]}</div><div class="v num" style="color:${COR[x[2]]}">${x[1]}</div><div class="e">${x[3]}</div></div>`).join("")}</section>`;
}

/* ── ofensores e observações (Levi, 25/11/2026; a vegetação em 26/11) ─────────────────────────────────────────────── */
function achados() {
  const it = U.ofensores, ob = U.observacoes;
  if (!it.length && !ob.length) return "";
  return `<section class="bloco" id="ach"><button class="cab cab-rec" data-achrec="1" aria-expanded="${!ACH_REC}"><h2><span class="seta">${ACH_REC ? "▸" : "▾"}</span> Ofensores</h2><span class="sub">${ACH_REC ? `${it.length} ofensores e ${ob.length} observações · clique para abrir` : "o que tira energia da usina e o que já cobre cada um · clique para recolher"}</span></button>
    ${ACH_REC ? "" : `${it.length ? `<ol class="ach">${it.map((c, i) => `<li><button class="lin" data-ach="${i}" aria-expanded="${ACH === i}"><span class="n" style="background:${COR[c.sev]}">${i + 1}</span>
      <span class="t">${esc(c.t)}<small>${esc(c.s)}</small></span><span class="cob cob-${c.cob.tom}">${esc(c.cob.txt)}</span><span class="p"><b>Próximo passo</b>${esc(c.p)}</span><span class="mais">${ACH === i ? "−" : "+"}</span></button>
      ${ACH === i ? `<div class="corpo">${c.c.map(k => `<div><b>${esc(k[0])}</b>${esc(k[1])}</div>`).join("")}</div>` : ""}</li>`).join("")}</ol>` : `<div style="color:var(--mudo)">Nenhum ofensor no mês: sem ocorrência de inversor, tracker parado, string sem corrente nem vegetação alta.</div>`}
    ${ob.length ? `<div class="obs-l"><div class="tit">Observações</div>${ob.map(o => `<div class="ob"><b>${esc(o.t)}</b> · ${esc(o.s)}. <span>${esc(o.p)}</span></div>`).join("")}</div>` : ""}`}</section>`;
}

/* ── para onde foi a energia: a cascata do mês (à parte) ou o mês a mês ───────────────────────────────────────────── */
function ponte() {
  const cab = `<div class="cab"><h2>Para onde foi a energia</h2><span class="seg" role="group" aria-label="Período">${[["mes", `${MN[mesN()]}/${String(ano()).slice(2)}`], ["mm", "Mês a mês"]].map(b => `<button data-ponte="${b[0]}" aria-pressed="${PONTE === b[0]}">${b[1]}</button>`).join("")}</span></div>`;
  if (PONTE === "mm") return `<section class="bloco" id="ponte">${cab}${mesAMes()}</section>`;
  if (!UE) return `<section class="bloco" id="ponte">${cab}<div class="toast">${UEERR ? `A conta de energia não veio: ${esc(UEERR)}.` : "Calculando a conta de energia do mês (a cascata leva alguns segundos)…"}</div></section>`;
  const c = UE.cascata || {};

function mesAMes() {

  const g = U.ger, c = (UE && UE.cascata && UE.cascata.ok) ? UE.cascata : null, pm = perdaMes(), gm = geradoMes();
  const at = g.at, rpr = g.pr != null && g.meta ? g.pr / g.meta : null;
  const verd = at == null ? ["SEM DADO", "#eef0f3", "#5b6472"] : at >= 98 && (rpr == null || rpr >= .95) ? ["ÓTIMO", "#e6f4d9", "#4f7d0a"] : at >= 90 && (rpr == null || rpr >= .85) ? ["BOM", "#eaf3fb", "#2b6cb0"] : ["ABAIXO DO ESPERADO", "#fdeaec", "#d64550"];
  const ult = (U.frescor || {}).bd_ult, per = `01/${dd2(mesN())}/${ano()} a ${dd2(ult || 1)}/${dd2(mesN())}/${ano()}`;
  const pInv = U.ocorr.filter(o => !ehQueda(o)).reduce((a, o) => a + (o.perda || 0), 0) / 1000, pQ = U.ocorr.filter(ehQueda).reduce((a, o) => a + (o.perda || 0), 0) / 1000;
  const quedas = U.ocorr.filter(ehQueda);
  let h = `<div class="sec"><div class="sechead" style="color:#8a929e">Grid Co. · Performance UFV · Análise da usina</div>
    <div class="capa-n">${esc(U.usina)}</div><div class="capa-s">${U.kwp ? n1(U.kwp / 1000, 2) + " MWp · " : ""}${esc(U.cliente)}${U.local ? " · " + esc(U.local) : ""} · ${per}${U.mob ? " · mobilizada em " + brData(U.mob) : ""}</div>
    <div style="margin:16px 0"><span class="badge" style="background:${verd[1]};color:${verd[2]}">${verd[0]}</span></div>
    <div class="tiles">${tilePdf("Geração vs P50", g.prod == null ? "—" : n1(g.prod, 1) + " MWh", at == null ? "" : `${n1(at, 1)}% · meta ${n1(g.p50, 0)} MWh`)}
      ${tilePdf("Performance Ratio", g.pr == null ? "—" : n1(g.pr) + "%", g.meta ? "meta " + n1(g.meta) + "%" : "", g.pr != null && g.meta && g.pr < g.meta - .2 ? "#d64550" : "#4f7d0a")}
      ${tilePdf("Disponibilidade", U.disp.mes == null ? "—" : n1(U.disp.mes) + "%", "pelas ocorrências do COS")}
      ${tilePdf("Perda nas ocorrências", n1(pm, 1) + " MWh", g.prod != null ? `sem elas: ${n1(g.prod + pm, 1)} MWh` : "", "#c9870d")}</div>
    <div class="leitura">${g.prod == null ? "Sem a geração do mês no Gerencial." : `A usina gerou <b>${n1(g.prod, 1)} MWh</b> no período, <b>${n1(at, 1)}%</b> da meta P50 (${n1(g.p50, 1)} MWh). O PR foi <b>${n1(g.pr)}%</b>${g.meta ? ` contra a meta de <b>${n1(g.meta)}%</b> (${pp(g.pr - g.meta)})` : ""}.`}
      ${U.disp.mes != null ? ` A disponibilidade, pelas ocorrências do COS, foi <b>${n1(U.disp.mes)}%</b>: ${n1(U.disp.h, 1)} horas equivalentes perdidas.` : ""}${pm > 0 ? ` Sem essas ocorrências, a usina teria gerado mais <b>${n1(pm, 1)} MWh</b>: o inversor parado tirou ${n1(pInv, 1)} MWh e as quedas, ${n1(pQ, 1)} MWh.` : ""}
      ${U.sem_expl.length ? ` <b>${U.sem_expl.length} dia${U.sem_expl.length > 1 ? "s" : ""} sem explicação</b> (${U.sem_expl.map(dd2).join(", ")}): o PR ficou abaixo de 85% da meta mesmo devolvendo as ocorrências.` : ""}</div>
    ${U.ofensores.length ? `<div class="kicker">Ofensores</div>${U.ofensores.map((a, i) => `<div class="pt"><b>${i + 1}.</b> <b class="t">${esc(a.t)}</b> (${esc(a.s)}). <i>${esc(a.cob.txt)}.</i> Próximo passo: ${esc(a.p)}</div>`).join("")}` : ""}
    ${U.observacoes.length ? `<div class="kicker">Observações</div>${U.observacoes.map(o => `<div class="pt" style="background:#f3f6fa;border-color:#d9e1ec"><b class="t">${esc(o.t)}</b> (${esc(o.s)}). ${esc(o.p)}</div>`).join("")}` : ""}
    <div class="foot"><span>Equipe de Performance · Grid Co.</span><span>Emitido em ${new Date().toLocaleDateString("pt-BR")}</span></div></div>`;
  let n = 2;
  const sec = (t, s) => secPdfU(dd2(n++), t, s);
  if (c) h += sec("Recurso solar", "Quanto sol houve no período. O efeito do sol é separado do da operação: sol abaixo do previsto é expurgo, não falha da usina.")
    + `<div class="tiles">${c.poa != null ? tilePdf("POA no período", n1(c.poa, 1) + " kWh/m²", c.poa_prev ? pp((c.poa / c.poa_prev - 1) * 100).replace(" p.p.", "%") + " vs previsto" : "") : ""}${c.poa_prev ? tilePdf("POA previsto", n1(c.poa_prev, 1) + " kWh/m²", "referência") : ""}
      ${tilePdf("Possível com o sol", n1(c.possivel, 1) + " MWh", "o P50 ajustado ao sol medido")}${tilePdf("Efeito do sol", (c.possivel >= c.p50 ? "+" : "−") + n1(Math.abs(c.possivel - c.p50), 1) + " MWh", c.possivel >= c.p50 ? "mais energia que o P50" : "expurgo")}</div>
    <div class="leitura">${c.possivel >= c.p50 ? "O sol veio acima do previsto: a meta do mês deveria ser mais fácil de bater." : `O sol veio abaixo do previsto: parte da distância para o P50 é do tempo (${n1(c.p50 - c.possivel, 1)} MWh), não da usina.`}</div></div>`;
  h += sec("Qualidade da performance e equipamentos", "O PR tira o efeito do sol; aberto por inversor contra o alvo. A disponibilidade sai das ocorrências do COS.")
    + `<div class="tiles">${tilePdf("PR realizado", g.pr == null ? "—" : n1(g.pr) + "%", g.meta ? "meta " + n1(g.meta) + "%" : "")}${tilePdf("Disponibilidade", U.disp.mes == null ? "—" : n1(U.disp.mes) + "%", U.disp.h != null ? n1(U.disp.h, 1) + " h equivalentes perdidas" : "")}${tilePdf("Inversor parado", n1(pInv, 1) + " MWh", "o que deixou de gerar no mês")}</div>
      <div class="kicker">PR por inversor${U.alvo ? " · contra o alvo de " + pc(U.alvo) : ""}</div>${barrasInvPdf()}
      ${U.invs.some(v => v.obs && v.obs.txt) ? `<div class="kicker">Observações dos inversores</div>${U.invs.filter(v => v.obs && v.obs.txt).map(v => `<div class="pt" style="background:#f3f6fa;border-color:#d9e1ec"><b class="t">${esc(v.n)}</b>: ${esc(v.obs.txt)}</div>`).join("")}` : ""}</div>`;
  if (c) h += sec("Contabilidade de energia", "Do P50 ao gerado, degrau por degrau. Expurgo (sol abaixo e queda de rede) separado do que é da operação (equipamento e trackers).")
    + wfPdf([{l: ["P50"], v: c.p50, k: "a", c: "#8b93a8", sub: "meta"}, {l: [c.possivel >= c.p50 ? "Sol acima" : "Sol abaixo"], v: c.possivel - c.p50, c: c.possivel >= c.p50 ? "#9cc3ea" : "#f2c14e", sub: c.possivel >= c.p50 ? "mais energia" : "expurgo"},
      {l: ["Queda", "de rede"], v: -(c.perda_rede || 0), c: "#f0b27a", sub: "expurgo"}, {l: ["Equipa-", "mento"], v: -(c.perda_equip || 0), c: "#d64550", sub: "operação"}, {l: ["Trackers"], v: -(c.perda_trk || 0), c: "#c9870d", sub: "operação"},
      {l: ["Não", "explicado"], v: -(c.nao_explicado || 0), c: "#c2c7d0", sub: "o resto"}, {l: ["Gerado"], v: c.geracao, k: "a", c: "#4f7d0a", sub: "BD"}], 720, 290)
    + `<div class="leitura">Expurgos: <b>${n1((c.perda_rede || 0) + Math.max(0, c.p50 - c.possivel), 1)} MWh</b>. Operação: <b>${n1((c.perda_equip || 0) + (c.perda_trk || 0), 1)} MWh</b>. Não explicado: <b>${n1(c.nao_explicado, 1)} MWh</b>${c.nao_explicado < 0 ? ", negativo: a cascata pôs mais perda em equipamento do que a usina perdeu; corrigir antes de usar como nota" : ""}.
      Pelas ocorrências do COS, a conta fica: quedas ${n1(pQ, 1)} MWh (a cascata diz ${n1(c.perda_rede, 1)}) e o inversor parado ${n1(pInv, 1)} MWh (a cascata diz ${n1(c.perda_equip, 1)} de equipamento).</div></div>`;
  h += sec("Ocorrências do COS e o que elas tiraram", "Cada ocorrência do COS no período e quanto a usina geraria sem ela. A barra inteira do gráfico é a usina sem as ocorrências.")
    + graficoPdf()
    + (quedas.length ? `<div class="kicker">Quedas da usina</div><table><thead><tr><th>Dia</th><th>OS</th><th>Tipo</th><th>Janela</th><th>Proteção</th><th>Geraria (MWh)</th><th>Gerou (MWh)</th><th>Perda (MWh)</th><th class="e">Como</th></tr></thead><tbody>
      ${quedas.map(o => `<tr><td>${dd2(o.d)}/${dd2(mesN())}</td><td>${esc(o.os)}</td><td>${esc(o.tipo)}</td><td>${esc(o.trechos)}</td><td>${o.prot || "—"}</td><td>${n1((o.geraria || 0) / 1000, 2)}</td><td>${o.gerou == null ? "—" : n1(o.gerou / 1000, 2)}</td><td><b>${n1((o.perda || 0) / 1000, 2)}</b></td><td class="e">${esc(COMO(o.metodo))}${o.limitada ? " (limitada ao que faltou no dia)" : ""}</td></tr>`).join("")}
      <tr style="font-weight:700"><td>Total</td><td></td><td>${quedas.length} quedas</td><td></td><td></td><td></td><td></td><td>${n1(pQ, 2)}</td><td></td></tr></tbody></table>` : "")
    + (U.ocorr.some(o => !ehQueda(o)) ? `<div class="kicker">Equipamento parado</div><table><thead><tr><th>OS</th><th>Equipamento</th><th>Aberta desde</th><th>Dias no período</th><th>Geraria (MWh)</th><th>Perda (MWh)</th><th class="e">Como</th></tr></thead><tbody>
      ${[...new Set(U.ocorr.filter(o => !ehQueda(o)).map(o => o.os + "|" + o.escopo))].map(k => { const [f, e] = k.split("|"), l = U.ocorr.filter(o => o.os === f && o.escopo === e); return `<tr><td>${esc(f)}</td><td>${esc(e)}</td><td>${brData(l[0].ini)}</td><td>${l.length}</td><td>${n1(l.reduce((a, o) => a + (o.geraria || 0), 0) / 1000, 1)}</td><td><b>${n1(l.reduce((a, o) => a + (o.perda || 0), 0) / 1000, 1)}</b></td><td class="e">${esc(COMO(l[0].metodo))}</td></tr>`; }).join("")}</tbody></table>` : "")
    + (U.ocorr.length ? "" : `<div class="leitura">Nenhuma ocorrência do COS no período.</div>`) + `</div>`;
  h += sec("Comportamento diário", "Gerado, o que as ocorrências tiraram, PR, sol e disponibilidade de cada dia.")
    + `<table><thead><tr><th>Dia</th><th>Gerado</th><th>Perda nas ocorr.</th><th>Sem as ocorr.</th><th>PR</th><th>POA (kWh/m²)</th><th>Disp. (COS)</th></tr></thead><tbody>
      ${U.dias.map(d => `<tr><td>${dd2(d.d)}/${dd2(mesN())}${d.sem_expl ? " *" : ""}</td><td>${n1(d.ger, 2)}</td><td>${perdaDia(d.d) ? n1(perdaDia(d.d), 2) : "—"}</td><td>${n1((d.ger || 0) + perdaDia(d.d), 2)}</td><td style="color:${metaPr() && d.pr != null && d.pr < metaPr() * .85 ? "#d64550" : "inherit"}">${pc(d.pr)}</td><td>${n1(d.poa, 2)}</td><td>${d.disp == null ? "—" : n1(d.disp) + "%"}</td></tr>`).join("")}
      <tr style="font-weight:700"><td>Total</td><td>${n1(gm, 1)}</td><td>${n1(pm, 1)}</td><td>${n1(gm + pm, 1)}</td><td>${g.pr == null ? "—" : n1(g.pr) + "%"}</td><td>${n1(U.dias.reduce((a, d) => a + (d.poa || 0), 0), 1)}</td><td>${U.disp.mes == null ? "—" : n1(U.disp.mes) + "%"}</td></tr></tbody></table>
      ${U.sem_expl.length ? `<div class="leitura">* dia sem explicação: o PR do dia, devolvidas as perdas das ocorrências do COS, ficou abaixo de 85% da meta.</div>` : ""}</div>`;
  if (UM && UM.meses) { const Hs = UM.meses.filter(x => x.ok);
    h += sec(`Mês a mês em ${ano()}`, "A mesma contabilidade de cada mês: o que foi expurgo (sol e rede), o que foi da operação e o PR contra a meta.")
      + `<table><thead><tr><th>Mês</th><th>P50</th><th>Gerado</th><th>× P50</th><th>Sol abaixo</th><th>Rede</th><th>Equip.</th><th>Trackers</th><th>Não expl.</th><th>PR</th><th>Meta</th></tr></thead><tbody>
        ${Hs.map(x => `<tr${x.m === mesN() ? ' style="font-weight:700"' : ""}><td>${MESES[x.m]}</td><td>${n1(x.p50, 0)}</td><td>${n1(x.geracao, 0)}</td><td>${x.p50 ? pc(x.geracao / x.p50, 0) : "—"}</td><td>${n1(Math.max(0, x.p50 - x.possivel), 1)}</td><td>${n1(x.perda_rede, 1)}</td><td>${n1(x.perda_equip, 1)}</td><td>${n1(x.perda_trk, 1)}</td><td style="color:${x.nao_explicado < 0 ? "#d64550" : "inherit"}">${n1(x.nao_explicado, 1)}</td><td>${pc(x.pr_real)}</td><td>${pc(x.pr_meta)}</td></tr>`).join("")}</tbody></table></div>`; }
  h += sec("Metodologia e de onde vem cada número", "Como cada indicador é calculado e a fonte.")
    + `<div class="metod">
      <div><b>Geração, P50, PR e meta (capa)</b>: o Gerencial, dias fechados; a mesma régua da visão inicial.</div>
      <div><b>Dia a dia e inversores</b>: o BD (BD_Thopen para a Thopen, BD_Performance para as demais).</div>
      <div><b>Disponibilidade</b>: 1 − horas equivalentes perdidas ÷ horas de sol, pelas ocorrências do COS: cada ocorrência pesa a fração da potência que parou.</div>
      <div><b>Perda de uma queda</b>: a relação potência ÷ POA da hora antes e da hora depois, vezes a POA de cada 5 minutos da janela, menos o que a usina gerou nela.</div>
      <div><b>Perda de inversor parado</b>: a geração mediana dos outros inversores no dia, menos a dele.</div>
      <div><b>Sem curva no banco</b>: a geração do dia vezes a fatia que a janela tem do sol de um dia típico; marcada como estimativa.</div>
      <div><b>Teto do dia</b>: a perda das quedas de um dia nunca passa do que faltou na geração do dia (a POA × a potência × o PR típico da usina no mês, menos o gerado).</div>
      <div><b>Dia sem explicação</b>: o PR do dia, somadas as perdas das ocorrências, abaixo de 85% da meta.</div>
      <div><b>Ofensores</b>: inversor parado pela ocorrência do COS; tracker parado e string sem corrente pela Falhas do mês, cobertos pelo chamado de tracker e pela OS de string; vegetação pela última ronda (Zeladoria do Nexus).</div>
      <div><b>Contabilidade de energia</b>: a cascata do Gerencial (P50 → sol → rede → equipamento → trackers → não explicado → gerado).</div></div></div>`;
  return h;
}

/* ── os eventos do diagnóstico ───────────────────────────────────────────────────────────────────────────────────── */
document.addEventListener("mousemove", e => {
  if (VIEW !== "usina" || !U) return;
  if (e.target.closest && e.target.closest("#svg-cmp")) {
    const h = tipComparar(e);
    if (!h) { tip.hidden = true; return; }
    tip.innerHTML = h; tip.hidden = false;
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = (e.clientX + w + 24 > innerWidth ? e.clientX - w - 16 : e.clientX + 16) + "px";
    tip.style.top = Math.max(8, Math.min(innerHeight - hh - 8, e.clientY - hh / 2)) + "px";
    return;
  }
  const guia = $("#cmp-guia"); if (guia) guia.setAttribute("visibility", "hidden");
  const g = e.target.closest && e.target.closest("#svg-dia [data-dia]");
  if (!g) { tip.hidden = true; return; }
  const d = U.dias.find(x => x.d === +g.getAttribute("data-dia"));
  if (!d) { tip.hidden = true; return; }
  tip.innerHTML = tipDia(d); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 16) + "px";
  tip.style.top = (e.clientY + h + 20 > innerHeight ? e.clientY - h - 14 : e.clientY + 18) + "px";
});
document.addEventListener("click", e => {
  if (VIEW !== "usina") return;
  const t = e.target, q = s => t.closest(s);
  let x;
  if ((x = q("[data-view]"))) { voltarGeral(); return; }
  if (!U) return;
  if ((x = q("[data-modo]"))) { MODO_DIA = x.getAttribute("data-modo"); tudo(); return; }
  if ((x = q("[data-ser]"))) { const k = x.getAttribute("data-ser"); SER[k] = !SER[k]; tudo(); return; }
  if ((x = q("[data-cmpg]"))) { CMP_G = x.getAttribute("data-cmpg"); tudo(); return; }
  if ((x = q("[data-ponte]"))) { PONTE = x.getAttribute("data-ponte"); tudo(); return; }
  if ((x = q("[data-prmm]"))) { PR_MM = !PR_MM; tudo(); return; }
  if ((x = q("[data-achrec]"))) { ACH_REC = !ACH_REC; tudo(); return; }
  if ((x = q("[data-ach]"))) { const i = +x.getAttribute("data-ach"); ACH = ACH === i ? null : i; tudo(); return; }
  if ((x = q("#svg-dia [data-dia]"))) { DIA = +x.getAttribute("data-dia"); tudo(); return; }
  if ((x = q("[data-obsin]"))) return;
  if ((x = q("td[data-obs]"))) { if (!PODE) return; OBS_ED = x.getAttribute("data-obs"); tudo(); foca(`[data-obsin="${OBS_ED}"]`); const f = $(`[data-obsin="${OBS_ED}"]`); if (f) f.select(); return; }
  if ((x = q("tr.l[data-inv]"))) { const n = x.getAttribute("data-inv"); INV_ABERTO = INV_ABERTO === n ? null : n; tudo(); return; }
});
document.addEventListener("keydown", e => {
  if (!(e.target.hasAttribute && e.target.hasAttribute("data-obsin")) || !(e.key === "Enter" || e.key === "Escape")) return;
  const n = e.target.getAttribute("data-obsin"), v = e.target.value.trim();
  OBS_ED = null;
  if (e.key === "Enter") { const atual = ((U.invs.find(i => i.n === n) || {}).obs || {}).txt || ""; if (v !== atual) { gravaObs(n, v); return; } }
  tudo();
});
window.addEventListener("popstate", () => {
  const qs = new URLSearchParams(location.search);
  if (qs.get("usina")) lerUsina(qs.get("usina"), qs.get("mes") || hojeMes, false);
  else { VIEW = "geral"; tudo(); }
});
(() => {                                             // o link direto: ?usina=<nome>&mes=AAAA-MM abre o diagnóstico
  const qs = new URLSearchParams(location.search);
  if (qs.get("usina")) { if (qs.get("mes") && /^\d{4}-\d{2}$/.test(qs.get("mes"))) MES = qs.get("mes"); lerUsina(qs.get("usina"), MES, false); }
  ler();
})();
</script>
</body>
</html>
