<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>{{ titulo }} · Plataforma de Performance</title>
<!-- Porta única com o Nexus (09/10/2026): a página curta que aparece DENTRO da moldura do Nexus quando o passe é
     recusado, a pessoa está fora das listas, o perfil é só leitura ou a sessão venceu. Mesmo desenho do login (tokens do
     Monitoramento, navy + verde Grid), sem fonte de fora: a moldura não espera a internet para dizer o que houve. -->
<style>
:root{--bg:#090d18;--surface:#161d30;--surface-2:#1b2338;--text:#e9eef6;--n300:#c3cad7;--n400:#96a0b4;--n500:#767d92;
      --divider:rgba(255,255,255,.09);--accent:#a3d900;--amber:#f5b83d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);
     color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.card{width:min(480px,100%);padding:26px 24px 22px;border-radius:14px;background:linear-gradient(180deg,var(--surface-2),var(--surface));
      border:1px solid var(--divider);box-shadow:0 18px 44px rgba(0,0,0,.45)}
.kicker{font-size:10.5px;text-transform:uppercase;letter-spacing:.16em;font-weight:700;color:var(--n500);margin-bottom:10px}
h1{margin:0 0 12px;font-size:20px;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--n300);line-height:1.55}
.motivo{margin:14px 0 4px;padding:10px 12px;border-radius:9px;border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);
        background:color-mix(in srgb,var(--amber) 10%,transparent);color:var(--text);font-size:13px;line-height:1.5}
.motivo b{color:var(--amber);font-weight:700}
a{color:var(--accent)}
.pe{margin-top:16px;font-size:12px;color:var(--n500)}
</style>
</head>
<body>
<main class="card" role="main">
  <div class="kicker">Plataforma de Performance</div>
  <h1>{{ titulo }}</h1>
  <p>{{ texto }}</p>
  {% if motivo %}<div class="motivo"><b>Motivo:</b> {{ motivo }}</div>{% endif %}
  {% if senha_href %}<div class="pe">Reserva: <a href="{{ senha_href }}" target="_top">entrar com a senha da plataforma</a></div>{% endif %}
</main>
</body>
</html>
