<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokens · Plataforma de Performance</title>
<style>
  :root{
    --bg:#090d18; --card:#161d30; --linha:#26304a;
    --txt:#e8ecf5; --txt2:#a8b3ca; --txt3:#7c88a3;
    --verde:#3ecf8e; --verde-esc:#1f7a52;
    --ambar:#f0b45e; --vermelho:#ff7a6b; --azul:#5b9dd9;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .topo{border-bottom:1px solid var(--linha);padding:14px 22px;display:flex;
        align-items:center;gap:16px;flex-wrap:wrap}
  .topo h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  .topo a{color:var(--txt3);text-decoration:none;font-size:13px}
  .topo a:hover{color:var(--verde)}
  .wrap{max-width:820px;margin:0 auto;padding:22px}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
  .kpi{background:var(--card);border-radius:8px;padding:12px 14px}
  .kpi .r{font-size:12px;color:var(--txt3);margin-bottom:3px}
  .kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  h2{font-size:13px;font-weight:600;color:var(--txt3);letter-spacing:.08em;
     text-transform:uppercase;margin:26px 0 10px}
  .cartao{background:var(--card);border-radius:10px;padding:16px 18px;margin-bottom:12px;
          border-left:3px solid var(--linha)}
  .cartao.ok{border-left-color:var(--verde)}
  .cartao.atencao{border-left-color:var(--ambar)}
  .cartao.vencido{border-left-color:var(--vermelho)}
  .cab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .nome{font-size:15px;font-weight:600}
  .selo{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;
        letter-spacing:.04em;text-transform:uppercase}
  .ok .selo{color:var(--verde)} .atencao .selo{color:var(--ambar)}
  .vencido .selo{color:var(--vermelho)} .auto .selo{color:var(--azul)}
  .quando{font-size:13px;color:var(--txt2);font-variant-numeric:tabular-nums}
  .dica{font-size:12.5px;color:var(--txt3);margin:6px 0 0}
  .barra{height:5px;background:#0e1424;border-radius:99px;overflow:hidden;margin:10px 0 0}
  .barra i{display:block;height:100%;background:var(--verde)}
  .atencao .barra i{background:var(--ambar)} .vencido .barra i{background:var(--vermelho)}
  .colar{margin-top:14px;padding-top:14px;border-top:1px solid var(--linha)}
  textarea{width:100%;min-height:58px;resize:vertical;background:#0e1424;color:var(--txt);
           border:1px solid var(--linha);border-radius:7px;padding:9px 11px;
           font-family:var(--mono);font-size:11.5px}
  textarea:focus{outline:none;border-color:var(--verde-esc)}
  .acoes{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap}
  button{background:var(--verde-esc);color:#eafff5;border:0;border-radius:7px;
         padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{background:var(--verde);color:#07130d}
  button.sec{background:transparent;color:var(--txt2);border:1px solid var(--linha);font-weight:500}
  button.sec:hover{background:#0e1424;color:var(--txt)}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:12.5px}
  .msg.bom{color:var(--verde)} .msg.ruim{color:var(--vermelho)}
  .auto-lista{background:var(--card);border-radius:10px;overflow:hidden}
  .auto-item{display:flex;align-items:center;gap:12px;padding:11px 16px;
             border-bottom:1px solid var(--linha);font-size:13.5px}
  .auto-item:last-child{border-bottom:0}
  .auto-item .n{flex:1}
  .auto-item .q{color:var(--txt3);font-size:12.5px;font-variant-numeric:tabular-nums}
  .rodape{color:var(--txt3);font-size:12px;margin-top:26px;padding-top:14px;
          border-top:1px solid var(--linha)}
  code{font-family:var(--mono);font-size:11.5px;background:#0e1424;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="topo">
  <h1>Tokens</h1>
  <a href="/">← Monitoramento</a>
  <span style="flex:1"></span>
  <span id="atualizado" style="font-size:12px;color:var(--txt3)"></span>
  <button class="sec" onclick="carregar()">Atualizar</button>
</div>

<div class="wrap">
  <div class="resumo" id="resumo"></div>
  <div id="manuais"></div>
  <div id="autos"></div>
  <p class="rodape">
    O token entra em uso na hora, sem reiniciar o servidor. Quem tem validade maior vence:
    colar um mais novo sempre funciona, colar um mais velho não estraga nada.
    Tokens vencidos são recusados.
  </p>
</div>

<script>
const FONTES_COLAVEIS = {
  plat:  {onde: "plataforma.pvoperation.com", como: "F12 → aba Network → qualquer requisição → cabeçalho <code>x-auth-token-update</code>"},
  sunop: {onde: "gridco.sunop.net",           como: "F12 → Console → <code>localStorage.getItem('token')</code>"},
  axis:  {onde: "axis.sunop.net",             como: "F12 → Console → <code>localStorage.getItem('token')</code>"}
};

function classe(t){
  if (t.status === "vencido") return "vencido";
  if (t.status === "atencao") return "atencao";
  if (t.status === "auto")    return "auto";
  return "ok";
}
function rotulo(t){
  if (t.status === "vencido") return "vencido";
  if (t.status === "atencao") return "vence logo";
  if (t.status === "auto")    return "login automático";
  return t.tipo === "auto-renova" ? "renova sozinho" : "ok";
}
function quando(t){
  if (t.dias === null || t.dias === undefined) return t.exp ? ("vence " + t.exp) : "sem validade declarada";
  if (t.dias < 0) return "venceu em " + t.exp;
  if (t.dias < 1) return "vence em " + Math.round(t.dias * 24) + " h  ·  " + t.exp;
  return "vence em " + t.dias.toFixed(1) + " dias  ·  " + t.exp;
}

function render(d){
  const ts = d.tokens || [];
  const precisam = ts.filter(t => t.status === "vencido" || t.status === "atencao");
  const autos    = ts.filter(t => t.status === "auto" || (t.tipo === "auto-renova" && t.status === "ok"));
  const prox     = ts.filter(t => t.dias !== null && t.dias !== undefined && t.dias > 0)
                     .sort((a,b) => a.dias - b.dias)[0];

  document.getElementById("resumo").innerHTML = `
    <div class="kpi"><div class="r">Precisam de você</div>
      <div class="v" style="color:${precisam.length ? "var(--ambar)" : "var(--verde)"}">${precisam.length}</div></div>
    <div class="kpi"><div class="r">Se renovam sozinhos</div><div class="v">${autos.length}</div></div>
    <div class="kpi"><div class="r">Próximo vencimento</div>
      <div class="v" style="font-size:17px">${prox ? (prox.dias < 1 ? Math.round(prox.dias*24) + " h" : prox.dias.toFixed(1) + " dias") : "—"}</div></div>`;

  // manuais primeiro: são os que exigem ação
  const manuais = ts.filter(t => FONTES_COLAVEIS[t.fonte]);
  manuais.sort((a,b) => (a.dias ?? 999) - (b.dias ?? 999));
  document.getElementById("manuais").innerHTML =
    "<h2>Colar token</h2>" + manuais.map(t => {
      const f = FONTES_COLAVEIS[t.fonte];
      const pct = (t.dias === null || t.dias === undefined) ? 0
                : Math.max(0, Math.min(100, (t.dias / 7) * 100));
      return `<div class="cartao ${classe(t)}">
        <div class="cab"><span class="nome">${t.nome}</span>
          <span class="selo">${rotulo(t)}</span></div>
        <div class="quando">${quando(t)}</div>
        <div class="barra"><i style="width:${pct}%"></i></div>
        <p class="dica">Onde pegar: <b>${f.onde}</b> — ${f.como}</p>
        <div class="colar">
          <textarea id="txt-${t.fonte}" placeholder="cole o token aqui"></textarea>
          <div class="acoes">
            <button onclick="salvar('${t.fonte}')">Salvar token</button>
            <span class="msg" id="msg-${t.fonte}"></span>
          </div>
        </div></div>`;
    }).join("");

  const outros = ts.filter(t => !FONTES_COLAVEIS[t.fonte]);
  document.getElementById("autos").innerHTML = outros.length ? (
    "<h2>Entram com usuário e senha (nada a fazer)</h2><div class='auto-lista'>" +
    outros.map(t => `<div class="auto-item ${classe(t)}">
        <span class="n">${t.nome}</span>
        <span class="q">${t.exp ? t.exp : "sessão renovada sozinha"}</span>
        <span class="selo">${rotulo(t)}</span></div>`).join("") + "</div>") : "";

  document.getElementById("atualizado").textContent =
    "lido às " + new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
}

async function carregar(){
  try{
    const d = await fetch("/api/tokens", {cache:"no-store"}).then(r => r.json());
    render(d);
  }catch(e){
    document.getElementById("resumo").innerHTML =
      "<div class='kpi'><div class='r'>Erro</div><div class='v' style='font-size:15px'>não consegui ler o estado</div></div>";
  }
}

async function salvar(fonte){
  const ta  = document.getElementById("txt-" + fonte);
  const msg = document.getElementById("msg-" + fonte);
  const tok = (ta.value || "").trim();
  if(!tok){ msg.className = "msg ruim"; msg.textContent = "cole o token antes"; return; }
  msg.className = "msg"; msg.textContent = "salvando...";
  try{
    const r = await fetch("/api/tokens/" + fonte, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({token: tok})
    });
    const j = await r.json();
    if(j.ok){
      msg.className = "msg bom";
      // O token vale NA HORA, mas o dado da tela vem do cache que o worker publica: o que foi
      // montado com o token vencido segue no ar até o próximo ciclo. Sem dizer isso, o Levi
      // colou a chave, viu a tela vazia e concluiu que não tinha entrado (29/07).
      msg.innerHTML = "pronto — vence em " + j.dias + " dias (" + j.exp + ")" +
        '<br><span style="color:var(--txt3)">os dados desta fonte voltam no próximo ciclo do worker (~5–8 min)</span>';
      ta.value = "";
      setTimeout(carregar, 700);
    }else{
      msg.className = "msg ruim"; msg.textContent = j.error || "recusado";
    }
  }catch(e){
    msg.className = "msg ruim"; msg.textContent = "falhou: " + e;
  }
}

carregar();
setInterval(carregar, 60000);
</script>
</body>
</html>
