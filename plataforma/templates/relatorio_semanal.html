<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório Semanal Thopen — Grid Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens medidos no PDF do mockup (Mockup_Relatorio_Semanal_Thopen_R00.pdf, 29/09/2026): Chromium a 960 px de largura,
   pt × 4/3 = px. Não aproximar no olho — o Levi compara lado a lado. */
:root {
  --faixa: #181528; --verde: #a9db21; --texto: #191528; --mudo: #504c63; --claro: #cfcbdd;
  --borda: #ddd9e7; --painel: #f4f2f7; --fio: #edecf4; --pos: #2e7d32; --aten: #b7791f; --fundo: #ffffff;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #eceaf2; color: var(--texto); font-family: var(--sans); }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* barra de trabalho (só na tela) */
.barra { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--borda);
  display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; font-size: 13px; }
.barra label { color: var(--mudo); display: flex; gap: 6px; align-items: center; }
.barra input { font: inherit; padding: 5px 8px; border: 1px solid var(--borda); border-radius: 6px; color: var(--texto); }
.barra button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--borda);
  background: #fff; color: var(--texto); cursor: pointer; }
.barra button.prim { background: var(--faixa); color: #fff; border-color: var(--faixa); }
.barra button:disabled { opacity: .45; cursor: default; }
.barra .sep { flex: 1; }
.barra .st { color: var(--mudo); }
.barra .st.aten { color: var(--aten); font-weight: 600; }
.avisos { width: 960px; margin: 16px auto 0; background: #fff8ec; border: 1px solid #f0d9a8; border-radius: 8px;
  padding: 10px 16px; font-size: 12.5px; color: #6b4e12; }
.avisos b { color: #4a360c; }
.avisos ul { margin: 6px 0 0 18px; padding: 0; }

/* documento */
.doc { width: 960px; margin: 16px auto 40px; background: var(--fundo); box-shadow: 0 2px 16px rgba(24, 21, 40, .12); }
.cab { background: var(--faixa); color: #fff; height: 147px; padding: 0 56px; display: flex; align-items: center;
  justify-content: space-between; }
.cab .marca { font-size: 12px; letter-spacing: .32em; color: var(--verde); font-weight: 600; margin-bottom: 8px; }
.cab h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
.cab .sub { margin-top: 8px; font-size: 16px; color: var(--claro); }
.cab .meta { text-align: right; font-size: 12px; color: var(--claro); line-height: 1.95; }
.cab .meta b { color: #fff; font-weight: 600; }
.corpo { padding: 12px 56px 28px; }
.sec { margin-top: 34px; break-inside: avoid; }
.sec-t { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.sec-t .n { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--verde); }
.sec-t h2 { margin: 0; font-size: 18px; font-weight: 600; }
.sec-t .d { font-size: 12px; color: var(--mudo); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.kpi { border: 1px solid var(--borda); border-radius: 8px; padding: 16px 18px; min-height: 121px; }
.kpi .l { font-size: 12px; color: var(--mudo); }
.kpi .v { font-family: var(--mono); font-weight: 600; font-size: 30px; margin: 10px 0 8px; letter-spacing: -.01em; }
.kpi .v small { font-size: 16px; font-weight: 500; color: var(--mudo); margin-left: 6px; }
.kpi .f { font-size: 12px; color: var(--mudo); }
.pos { color: var(--pos); font-weight: 600; }
.neg { color: var(--aten); font-weight: 600; }
.leitura { margin-top: 13px; background: var(--painel); border-radius: 8px; padding: 14px 18px; font-size: 13px;
  line-height: 1.55; min-height: 67px; }
.leitura b { font-weight: 600; }

.graf { border: 1px solid var(--borda); border-radius: 8px; padding: 18px 20px 16px; }
.graf svg { display: block; width: 100%; height: 250px; }
.graf .tri { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; }
.graf .tri .l { font-size: 12px; color: var(--mudo); }
.graf .tri .v { font-family: var(--mono); font-weight: 600; font-size: 18px; margin-top: 6px; }

.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 34px; }
.duas .sec { margin-top: 0; }
.lista { border: 1px solid var(--borda); border-radius: 8px; padding: 4px 18px; }
.lista .li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0;
  border-bottom: 1px solid var(--fio); font-size: 13px; }
.lista .li:last-child { border-bottom: 0; }
.lista .li .v { font-family: var(--mono); font-weight: 600; white-space: nowrap; }
.lista .li .v span { color: var(--mudo); font-weight: 500; }
.lista .li .nomes { display: block; margin-top: 3px; font-size: 11px; color: var(--mudo); }

table.fora { width: 100%; border-collapse: collapse; font-size: 13px; }
table.fora th { background: var(--painel); color: var(--mudo); font-weight: 500; font-size: 12px; text-align: left;
  padding: 12px 12px; border-bottom: 1px solid var(--borda); vertical-align: bottom; }
table.fora td { padding: 12px; border-bottom: 1px solid var(--fio); vertical-align: middle; }
table.fora td.u { font-weight: 600; }
table.fora td.m { font-family: var(--mono); font-weight: 500; white-space: nowrap; }
table.fora tr { break-inside: avoid; }
.ofens { display: block; margin-top: 4px; font-size: 11px; color: var(--mudo); }
.vazio { color: var(--mudo); font-size: 13px; padding: 14px 0; }

.rod { border-top: 1px solid var(--borda); margin-top: 30px; padding: 18px 56px 26px; font-size: 12px; color: var(--mudo);
  line-height: 1.6; }
.rod b { color: var(--texto); font-weight: 600; }

/* campos do analista: editáveis na tela, texto no PDF */
[contenteditable] { outline: none; border-bottom: 1px dashed #b9b3cc; white-space: pre-line; }
[contenteditable]:empty::before { content: attr(data-vazio); color: #9a94ad; }
[contenteditable].falta { background: #fdf3e1; border-bottom: 2px solid var(--aten); }
.carregando { width: 960px; margin: 60px auto; text-align: center; color: var(--mudo); font-size: 14px; }
/* Ctrl+P sem "Emitir PDF" imprime, mas avisa no papel: versão sem registro não vai ao cliente */
.aviso-previa { display: none; border: 1.5px solid var(--aten); color: var(--aten); font-weight: 600; font-size: 13px;
  text-align: center; padding: 8px; margin-bottom: 10px; }

@media print {
  html, body { background: #fff; }
  .barra, .avisos, .so-tela { display: none !important; }
  .doc { margin: 0; box-shadow: none; zoom: .74; }
  [contenteditable], [contenteditable].falta { border-bottom: 0; background: none; }
  [contenteditable]:empty::before { content: ""; }
  .duvidas.sem-contato { display: none; }
  body.previa .aviso-previa { display: block !important; }
  /* Cabeçalho e rodapé de página próprios. Com caixa de margem definida em cima e embaixo, o Chrome deixa de imprimir
     os dele — que levavam data, título e a URL interna da plataforma para o PDF do cliente (bancada, 29/09). A de
     cima fica vazia de propósito: definir só a de baixo tirava só o rodapé. */
  @page {
    size: A4 portrait; margin: 10mm 10mm 12mm;
    @top-center { content: ""; }
    @bottom-right { content: "Página " counter(page) " de " counter(pages); font-family: "IBM Plex Sans", sans-serif;
      font-size: 7.5pt; color: #504c63; }
  }
}
</style>
</head>
<body>
{% raw %}
<div class="barra">
  <label>De <input type="date" id="ini"></label>
  <label>Até <input type="date" id="fim"></label>
  <button id="b-semana">Semana passada</button>
  <button id="b-gerar">Gerar</button>
  <span class="sep"></span>
  <span class="st" id="st"></span>
  <span class="st" id="st-salvo"></span>
  <button id="b-emitir" class="prim" disabled>Emitir PDF</button>
</div>
<div id="avisos" class="avisos" hidden></div>
<div id="saida" class="carregando">Escolha o período e clique em Gerar.</div>

<script>
const $ = (id) => document.getElementById(id);
const nf1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const DIAS_SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x) => (x == null ? '—' : nf1.format(x * 100) + '%');
const pp = (x) => (x == null ? '—' : (x >= 0 ? '+' : '−') + nf1.format(Math.abs(x)) + ' p.p.');
// data LOCAL (o toISOString é UTC: depois das 21h o "hoje" virava amanhã — ponto de atenção 7 do Criador)
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const br = (s) => { const [a, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${a}`; };
const brc = (s) => br(s).slice(0, 5);

function semanaPassada(hoje = new Date()) {
  const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  const dow = (d.getDay() + 6) % 7;                     // segunda = 0
  const seg = new Date(d); seg.setDate(d.getDate() - dow - 7);
  const dom = new Date(seg); dom.setDate(seg.getDate() + 6);
  return [iso(seg), iso(dom)];
}
function proximaSegunda(hoje = new Date()) {
  const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  d.setDate(d.getDate() + (((8 - d.getDay()) % 7) || 7));
  return d;
}

// "set/2026" (ou "set/26" curto) do item {ano, mes} da evolução
const mesAno = (m, curto) => (m ? `${MESES[m.mes - 1]}/${curto ? String(m.ano).slice(2) : m.ano}` : '—');

function kpi(l, v, f) { return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="f">${f}</div></div>`; }

// ── direcionamentos: o que o analista escreve na página ──────────────────────────────────────────────────────────
let D = null, DIR = null, emitida = null;              // relatório na tela, o que já foi salvo, a emissão desta tela
const CAMPOS = new Map();                             // "campo|usina" → elemento

// o texto como vai ao PDF e o que falta para emitir — a MESMA régua de relatorio_semanal.faltando (o servidor confere
// de novo; tests/test_relatorio_semanal_emissao.py trava as duas iguais)
const txt = (s) => String(s ?? '').replace(/\r\n?/g, '\n').split('\n').map((l) => l.split(/\s+/).filter(Boolean).join(' ')).filter(Boolean).join('\n');
function faltando(s, semOfensor) {
  const f = [];
  if (!txt(s.leitura)) f.push({ campo: 'leitura', texto: 'a leitura da semana' });
  if (!txt(s.responsavel)) f.push({ campo: 'responsavel', texto: 'o responsável' });
  for (const l of s.linhas || []) {
    const u = txt(l.usina) || '?';
    const c = txt(l.causa);
    if (!c || c === txt(semOfensor)) f.push({ campo: 'causa', usina: u, texto: `a causa de ${u}` });
    if (!txt(l.acao)) f.push({ campo: 'acao', usina: u, texto: `a ação de ${u}` });
  }
  return f;
}

const ed = (campo, usina) => `contenteditable="plaintext-only" data-campo="${campo}"${usina == null ? '' : ` data-usina="${esc(usina)}"`}`;
// o salvo no período; responsável e contato sem nada salvo vêm da última vez que alguém preencheu
const geral = (c) => (DIR && DIR[c] != null ? DIR[c] : (DIR && DIR.padrao && DIR.padrao[c]) || '');
// o salvo na linha vence a sugestão — inclusive vazio: o analista apagou de propósito
function daLinha(usina, c, sug) {
  const l = DIR && DIR.linhas && DIR.linhas[usina];
  return l && c in l ? l[c] : (sug || '');
}
const campoEl = (c, usina) => CAMPOS.get(`${c}|${usina ?? ''}`);
const lista = (xs) => (xs.length > 1 ? `${xs.slice(0, -1).join(', ')} e ${xs.at(-1)}` : xs.join(''));
// até 3 linhas, pelo nome; mais que isso, a conta — com 35 usinas fora da meta (21–27/09) a frase não cabia na barra
function faltaTexto(f) {
  const ger = f.filter((x) => !x.usina).map((x) => x.texto), lin = f.filter((x) => x.usina);
  if (lin.length <= 3) return lista([...ger, ...lin.map((x) => x.texto)]);
  const n = (c, um, varios) => { const k = lin.filter((x) => x.campo === c).length; return k ? `${k} ${k === 1 ? um : varios}` : null; };
  return `${lista([...ger, n('causa', 'causa', 'causas'), n('acao', 'ação', 'ações')].filter(Boolean))} (marcadas na página)`;
}
const hhmm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

function status(msg, aten = false) { $('st').textContent = msg; $('st').className = aten ? 'st aten' : 'st'; }
function salvoSt(msg, aten = false) { $('st-salvo').textContent = msg; $('st-salvo').className = aten ? 'st aten' : 'st'; }

const pendentes = new Map();                          // elemento → timer do autosave
async function salvar(el) {
  clearTimeout(pendentes.get(el)); pendentes.delete(el);
  const corpo = { ini: D.periodo.ini, fim: D.periodo.fim, campo: el.dataset.campo, valor: el.innerText };
  if (el.dataset.usina != null) corpo.usina = el.dataset.usina;
  salvoSt('Salvando…');
  try {
    const r = await fetch('/api/relatorio/semanal/direcionamento', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const j = await r.json();
    if (!j.ok) { salvoSt('Não salvou: ' + (j.motivo || r.status), true); return false; }
    salvoSt(`Salvo às ${hhmm(new Date())}`);
    return true;
  } catch (e) {
    salvoSt('Não salvou: ' + e, true);
    return false;
  }
}
const salvarPendentes = () => Promise.all([...pendentes.keys()].map(salvar));

function ligarCampos() {
  CAMPOS.clear();
  document.querySelectorAll('[data-campo]').forEach((el) => {
    CAMPOS.set(`${el.dataset.campo}|${el.dataset.usina ?? ''}`, el);
    el.addEventListener('input', () => {
      if (!el.textContent.trim()) el.textContent = '';   // o <br> que sobra ao apagar tudo esconde o "vazio"
      el.classList.remove('falta');
      if (emitida) { emitida = null; $('b-emitir').textContent = 'Emitir PDF'; }   // mudou depois da emissão: versão nova
      clearTimeout(pendentes.get(el));
      pendentes.set(el, setTimeout(() => salvar(el), 800));
    });
    el.addEventListener('blur', () => { if (pendentes.has(el)) salvar(el); });
    // só a leitura tem mais de uma linha; nos outros, Enter confirma
    if (el.dataset.campo !== 'leitura') el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  });
}

function retrato() {
  const v = (el) => (el ? el.innerText : '');
  return {
    leitura: v(campoEl('leitura')), responsavel: v(campoEl('responsavel')), contato: v(campoEl('contato')),
    linhas: (D.fora_da_meta || []).map((u) => ({
      usina: u.nome, pr: u.pr, pr_meta: u.pr_meta, perda_mwh: u.perda_mwh,
      causa: v(campoEl('causa', u.nome)), acao: v(campoEl('acao', u.nome)), previsao: v(campoEl('previsao', u.nome)) })),
    resumo: D.resumo,
  };
}

function marcarFaltas(f) {
  document.querySelectorAll('.falta').forEach((el) => el.classList.remove('falta'));
  const els = f.map((x) => campoEl(x.campo, x.usina)).filter(Boolean);
  els.forEach((el) => el.classList.add('falta'));
  if (els.length) els[0].scrollIntoView({ block: 'center' });
}

// antes de toda impressão (o botão ou Ctrl+P): rodapé da página com período e versão, "Dúvidas:" some sem contato,
// e sem emissão registrada o papel sai marcado como prévia
function prepararImpressao() {
  if (!D) return;
  const c = campoEl('contato'), dv = document.querySelector('.duvidas'), p = D.periodo;
  if (dv) dv.classList.toggle('sem-contato', !c || !txt(c.innerText));
  document.body.classList.toggle('previa', !emitida);
  let s = $('rodape-pagina');
  if (!s) { s = document.createElement('style'); s.id = 'rodape-pagina'; document.head.appendChild(s); }
  const t = `Grid Co. · Relatório Semanal Thopen · ${brc(p.ini)} a ${br(p.fim)} · ${$('versao').textContent}`;
  s.textContent = `@media print { @page { @bottom-left { content: ${JSON.stringify(t)}; font-family: "IBM Plex Sans", sans-serif; font-size: 7.5pt; color: #504c63; } } }`;
}
window.addEventListener('beforeprint', prepararImpressao);

function imprimir() {
  prepararImpressao();
  const p = D.periodo, pt = (s) => br(s).replace(/\//g, '.');
  // o título vira o nome sugerido do arquivo em "Salvar como PDF" (barra não pode: o Chrome troca por _)
  document.title = `Relatório Semanal Thopen - ${pt(p.ini)} a ${pt(p.fim)} - ${emitida.versao}`;
  window.print();
}

async function emitir() {
  if (!D) return;
  if (emitida) { imprimir(); return; }                // nada mudou desde a emissão: a mesma versão de novo
  $('b-emitir').disabled = true;
  try {
    await salvarPendentes();
    const s = retrato();
    const f = faltando(s, D.sem_ofensor);
    marcarFaltas(f);
    if (f.length) { status(`Para emitir, falta preencher ${faltaTexto(f)}.`, true); return; }
    status('Registrando a emissão…');
    const r = await fetch('/api/relatorio/semanal/emitir', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ini: D.periodo.ini, fim: D.periodo.fim, ...s }) });
    const j = await r.json();
    if (!j.ok) {
      if (j.faltando) { marcarFaltas(j.faltando); status(`Para emitir, falta preencher ${faltaTexto(j.faltando)}.`, true); return; }
      status(j.motivo || `A emissão não foi registrada (${r.status}).`, true);
      return;
    }
    emitida = j;
    const em = new Date(j.em);                         // "AAAA-MM-DDTHH:MM" sem fuso = hora local
    $('emitido').textContent = `${DIAS_SEMANA[em.getDay()]}, ${br(iso(em))}`;
    $('proximo').textContent = br(iso(proximaSegunda(em)));
    $('versao').textContent = j.versao;
    $('b-emitir').textContent = `Imprimir de novo (${j.versao})`;
    status(`Emitido ${j.versao} às ${hhmm(em)}. Na janela de impressão, escolha "Salvar como PDF".`);
    imprimir();
  } catch (e) {
    status('A emissão não foi registrada: ' + e, true);
  } finally {
    $('b-emitir').disabled = false;
  }
}

function grafico(ev) {
  const ms = ev.meses.filter((m) => m.pr != null);
  if (!ms.length) return '<div class="vazio">Sem PR mensal no período.</div>';
  const W = 848, H = 250, x0 = 46, x1 = W - 96, y0 = 18, y1 = H - 34;   // à direita, o rótulo "meta 79,3%" inteiro
  const vals = ms.flatMap((m) => [m.pr, m.pr_meta].filter((v) => v != null)).map((v) => v * 100);
  let lo = Math.floor((Math.min(...vals) - 2) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 2) / 5) * 5;
  if (hi - lo < 10) hi = lo + 10;
  const IN = 30;                                       // o 1º ponto longe do eixo: o rótulo dele batia no "75%"
  const X = (i) => (ms.length === 1 ? (x0 + x1) / 2 : x0 + IN + (i * (x1 - x0 - IN)) / (ms.length - 1));
  const Y = (v) => y1 - ((v * 100 - lo) / (hi - lo)) * (y1 - y0);
  let g = '';
  for (let t = lo; t <= hi; t += 5) {
    g += `<text x="${x0 - 12}" y="${Y(t / 100) + 4}" text-anchor="end" font-size="11" fill="#504c63">${t}%</text>`;
  }
  g += `<line x1="${x0}" y1="${y1}" x2="${x1 + 30}" y2="${y1}" stroke="#ddd9e7"/>`;
  g += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="#ddd9e7"/>`;
  const meta = ms.filter((m) => m.pr_meta != null);
  if (meta.length) {
    g += `<polyline fill="none" stroke="#181528" stroke-width="1.2" stroke-dasharray="5 4" points="${ms.map((m, i) => m.pr_meta != null ? `${X(i)},${Y(m.pr_meta)}` : '').filter(Boolean).join(' ')}"/>`;
    const lm = ms[ms.length - 1];
    if (lm.pr_meta != null) g += `<text x="${X(ms.length - 1) + 12}" y="${Y(lm.pr_meta) + 4}" font-size="11" fill="#504c63">meta ${nf1.format(lm.pr_meta * 100)}%</text>`;
  }
  g += `<polyline fill="none" stroke="#181528" stroke-width="2.5" points="${ms.map((m, i) => `${X(i)},${Y(m.pr)}`).join(' ')}"/>`;
  ms.forEach((m, i) => {
    const ult = i === ms.length - 1, pri = i === 0;
    g += ult ? `<circle cx="${X(i)}" cy="${Y(m.pr)}" r="6" fill="#a8da20" stroke="#181528" stroke-width="1.5"/>`
             : `<circle cx="${X(i)}" cy="${Y(m.pr)}" r="4" fill="#181528"/>`;
    // o do último vai à esquerda do ponto: à direita mora o rótulo da meta
    if (pri || ult) g += `<text x="${ult ? X(i) - 10 : X(i)}" y="${Y(m.pr) - 12}" text-anchor="${ult ? 'end' : 'middle'}" font-size="11" font-weight="600" fill="#191528" font-family="IBM Plex Mono" paint-order="stroke" stroke="#fff" stroke-width="4">${nf1.format(m.pr * 100)}%</text>`;
    g += `<text x="${X(i)}" y="${y1 + 20}" text-anchor="middle" font-size="11" fill="${ult ? '#191528' : '#504c63'}" font-weight="${ult ? 600 : 400}">${MESES[m.mes - 1]}/${String(m.ano).slice(2, 4)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function render(d) {
  D = d; DIR = d.direcionamentos || null; emitida = null;
  const r = d.resumo, ev = d.evolucao, ex = d.executado, di = d.disponibilidade, per = d.periodo;
  const hoje = new Date();
  const dPr = r.pr != null && r.pr_meta != null ? (r.pr - r.pr_meta) * 100 : null;
  const dDisp = r.disp != null ? r.disp - r.disp_meta : null;
  const sinal = (x) => (x == null ? '' : `<span class="${x >= 0 ? 'pos' : 'neg'}">${pp(x)}</span>`);
  const ganho = ev.ganho_pp;
  const cab = `
    <div class="cab">
      <div>
        <div class="marca">GRID CO. · O&amp;M</div>
        <h1>Relatório Semanal de Performance</h1>
        <div class="sub">Cliente: Thopen · Semana ${per.semana} · ${brc(per.ini)} a ${br(per.fim)}</div>
      </div>
      <div class="meta">
        <div>Emitido em: <b id="emitido">${DIAS_SEMANA[hoje.getDay()]}, ${br(iso(hoje))}</b></div>
        <div>Responsável: <b ${ed('responsavel')} id="resp" data-vazio="[nome do responsável]">${esc(geral('responsavel'))}</b></div>
        <div>Próximo envio: <b id="proximo">${br(iso(proximaSegunda(hoje)))}</b></div>
        <div>Versão: <b id="versao">${esc((DIR && DIR.proxima_versao) || 'R00')}</b></div>
      </div>
    </div>`;
  const s01 = `
    <section class="sec">
      <div class="sec-t"><span class="n">01</span><h2>Resumo da semana</h2><span class="d">PR corrigido por irradiância no plano (POA) · meta do cliente</span></div>
      <div class="kpis">
        ${kpi('PR real (POA)', pct(r.pr), `meta ${pct(r.pr_meta)} · ${sinal(dPr)}`)}
        ${kpi('Disponibilidade', r.disp == null ? '—' : nf1.format(r.disp) + '%', `meta ${nf1.format(r.disp_meta)}% · ${sinal(dDisp)}`)}
        ${kpi('Geração real × meta', pct(r.ger_x_meta), `IPOA real × meta: ${pct(r.ipoa_x_meta)}`)}
        ${kpi('Usinas fora da meta de PR', `${r.fora}<small>de ${r.total}</small>`, `tolerância: PR ≥ ${nf0.format(r.tol * 100)}% da meta`)}
      </div>
      <div class="leitura"><b>Leitura da semana.</b> <span ${ed('leitura')} id="leitura" data-vazio="2 a 3 linhas: o que explica o resultado do portfólio, o que a Grid fez e o que muda até o próximo envio. Sem jargão interno.">${esc(geral('leitura'))}</span></div>
    </section>`;
  const s02 = `
    <section class="sec">
      <div class="sec-t"><span class="n">02</span><h2>Evolução desde a assunção dos ativos pela Grid</h2><span class="d">PR mensal do portfólio Thopen × meta · ${mesAno(ev.meses[0])} a ${mesAno(ev.meses.at(-1))}</span></div>
      <div class="graf">
        ${grafico(ev)}
        <div class="tri">
          <div><div class="l">PR em ${mesAno(ev.meses.find((m) => m.pr != null), true)}</div><div class="v">${pct(ev.pr_primeiro)}</div></div>
          <div><div class="l">PR no mês corrente</div><div class="v">${pct(ev.pr_atual)}</div></div>
          <div><div class="l">Ganho acumulado</div><div class="v ${ganho == null ? '' : ganho >= 0 ? 'pos' : 'neg'}">${pp(ganho)}</div></div>
        </div>
      </div>
    </section>`;
  const relig = ex.religamento_mediano_min, ron = ex.rondas;
  const s03 = `
    <section class="sec">
      <div class="sec-t"><span class="n">03</span><h2>O que a Grid executou na semana</h2></div>
      <div class="lista">
        <div class="li">Tarefas corretivas finalizadas<span class="v">${ex.corretivas.concluidas} <span>/ ${ex.corretivas.total} na semana</span></span></div>
        <div class="li">Tarefas preventivas realizadas × planejadas<span class="v">${ex.preventivas.realizadas} <span>/ ${ex.preventivas.planejadas}</span></span></div>
        ${ron ? `<div class="li"><span>Rondas realizadas<span class="nomes">${ron.curtas} curtas · ${ron.longas} longas · ${ron.usinas} usinas</span></span><span class="v">${ron.total}</span></div>` : ''}
        <div class="li">Strings que voltaram a gerar<span class="v">${ex.strings_voltaram}</span></div>
        <div class="li"><span>Tempo mediano de religamento<span class="nomes">da abertura da OS ao fim da tarefa de religamento${ex.religamentos ? ` · ${ex.religamentos} OS` : ''}</span></span><span class="v">${relig == null ? '—' : nf0.format(relig) + ' min'}</span></div>
      </div>
    </section>`;
  const abx = di.abaixo || [];
  const s04 = `
    <section class="sec">
      <div class="sec-t"><span class="n">04</span><h2>Disponibilidade e desligamentos</h2></div>
      <div class="lista">
        <div class="li">Quedas de energia (rede / concessionária)<span class="v">${di.queda.n} · ${nf1.format(di.queda.h)} h</span></div>
        <div class="li">Desligamentos por equipamento (escopo Grid)<span class="v">${di.equip.n} · ${nf1.format(di.equip.h)} h</span></div>
        <div class="li">Indisponibilidade atribuível à Grid<span class="v">${di.indisp_grid == null ? '—' : nf1.format(di.indisp_grid) + '%'}</span></div>
        <div class="li">Indisponibilidade externa (rede, cliente)<span class="v">${di.indisp_ext == null ? '—' : nf1.format(di.indisp_ext) + '%'}</span></div>
        <div class="li"><span>Usinas com disponibilidade &lt; ${nf0.format(di.meta)}%${abx.length ? `<span class="nomes">${esc(abx.slice(0, 5).map((x) => x.nome).join(', '))}${abx.length > 5 ? ` e mais ${abx.length - 5}` : ''}</span>` : ''}</span><span class="v">${abx.length}</span></div>
      </div>
    </section>`;
  const linhas = (d.fora_da_meta || []).map((u) => `
      <tr>
        <td class="u">${esc(u.nome)}</td>
        <td class="m">${pct(u.pr)} /<br>${pct(u.pr_meta)}</td>
        <td class="m">${nf0.format(u.perda_mwh)}<br>MWh</td>
        <td><span ${ed('causa', u.nome)} data-vazio="causa principal">${esc(daLinha(u.nome, 'causa', u.causa_sugerida))}</span>
            <span class="ofens so-tela">medido: ${esc((u.ofensores || []).map((o) => o.texto).join(' · ') || 'nenhum ofensor')}</span></td>
        <td><span ${ed('acao', u.nome)} data-vazio="ação da Grid · status">${esc(daLinha(u.nome, 'acao', u.acao_sugerida))}</span></td>
        <td class="m"><span ${ed('previsao', u.nome)} data-vazio="—">${esc(daLinha(u.nome, 'previsao', ''))}</span></td>
      </tr>`).join('');
  const s05 = `
    <section class="sec">
      <div class="sec-t"><span class="n">05</span><h2>Usinas fora da meta — causa e ação da Grid</h2><span class="d">Somente usinas com PR abaixo de ${nf0.format(r.tol * 100)}% da meta · uma linha por usina</span></div>
      ${linhas ? `<table class="fora"><thead><tr><th>Usina</th><th>PR real /<br>meta</th><th>Perda<br>est.</th><th>Causa principal</th><th>Ação da Grid · status</th><th>Previsão</th></tr></thead><tbody>${linhas}</tbody></table>`
               : '<div class="vazio">Nenhuma usina abaixo da tolerância no período.</div>'}
    </section>`;
  const rod = `
    <div class="rod">
      <div><b>Fontes:</b> BD_Thopen (geração, IPOA e meta de PR do cliente) · Fracttal (OS, desligamentos) · Plataforma de Performance GRID (strings e trackers). PR corrigido pela IPOA medida; dias sem medição de IPOA ficam fora do PR.</div>
      <div><b>Envio:</b> toda segunda-feira até 12h, por e-mail, independentemente da reunião.<span class="duvidas"> Dúvidas: <span ${ed('contato')} id="contato" data-vazio="[responsável] · [e-mail]">${esc(geral('contato'))}</span></span></div>
    </div>`;
  $('saida').className = '';
  $('saida').innerHTML = `<div class="doc"><div class="aviso-previa">PRÉVIA — emissão não registrada. Para o cliente, use "Emitir PDF".</div>${cab}<div class="corpo">${s01}${s02}<div class="duas">${s03}${s04}</div>${s05}</div>${rod}</div>`;
  document.title = `Relatório Semanal Thopen — ${br(per.ini)} a ${br(per.fim)}`;
  ligarCampos();
  prepararImpressao();
  const b = $('b-emitir');
  b.disabled = false;
  b.textContent = 'Emitir PDF';
  const av = [...(d.avisos || [])];
  $('avisos').hidden = !av.length && !(d.fontes || []).length;
  $('avisos').innerHTML = `<b>Conferir antes de emitir</b> (não sai no PDF) · ${esc((d.fontes || []).join(' · '))}` +
    (av.length ? `<ul>${av.map((a) => `<li>${esc(a)}</li>`).join('')}</ul>` : '');
}

async function gerar() {
  const ini = $('ini').value, fim = $('fim').value;
  if (!ini || !fim) return;
  if (D && pendentes.size) await salvarPendentes();    // trocar de período não perde o que acabou de ser digitado
  status('Gerando…');
  salvoSt('');
  try {
    const r = await fetch(`/api/relatorio/semanal?ini=${ini}&fim=${fim}`);
    const d = await r.json();
    if (!d.ok) { status(d.motivo || 'Não foi possível gerar.', true); return; }
    render(d);
    const ult = ((d.direcionamentos || {}).emissoes || []).at(-1);
    status(`${d.resumo.total} usinas com PR · ${d.fora_da_meta.length} fora da meta` + (ult
      ? ` · último envio ${ult.versao} em ${br(ult.em)} ${String(ult.em).slice(11, 16)} (${ult.por || '?'}); emitir de novo gera ${d.direcionamentos.proxima_versao}`
      : ''));
  } catch (e) {
    status('Falha ao gerar: ' + e, true);
  }
}

$('b-gerar').onclick = gerar;
$('b-emitir').onclick = emitir;
window.addEventListener('beforeunload', (e) => { if (pendentes.size) { e.preventDefault(); e.returnValue = ''; } });
$('b-semana').onclick = () => { const [a, b] = semanaPassada(); $('ini').value = a; $('fim').value = b; gerar(); };
(() => {
  const q = new URLSearchParams(location.search);
  const [a, b] = semanaPassada();
  $('ini').value = q.get('ini') || a;
  $('fim').value = q.get('fim') || b;
  gerar();
})();
</script>

</body>
