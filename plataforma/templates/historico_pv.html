<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico Plataforma — Grid Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root{ --bg:#f4f6f8; --card:#fff; --bd:#e3e7eb; --tx:#1f2933; --mut:#6b7280; --grn:#15803d; --blu:#0369a1; --amb:#d97706; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:'Poppins',system-ui,Segoe UI,Arial,sans-serif;font-size:14px}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .back{font-size:13px;color:var(--mut);border:1px solid var(--bd);background:#fff;padding:6px 12px;border-radius:8px}
  .back:hover{background:#f0f2f5}
  h1{font-size:20px;font-weight:700;margin:0}
  .sub{color:var(--mut);font-size:12.5px;margin:2px 0 16px}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .controls label{font-size:12px;color:var(--mut);font-weight:500;margin-right:6px}
  select,input[type=date]{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
  select{min-width:230px}
  .segs{display:flex;gap:6px;margin-left:auto}
  .seg{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx)}
  .seg:hover{border-color:#c7ccd2}
  .seg.active{border-color:var(--blu);background:#eff6ff;box-shadow:inset 0 0 0 1px var(--blu)}
  .sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .sec h2{font-size:14px;font-weight:600;margin:0 0 2px}
  .h-sub{color:var(--mut);font-size:11.5px;margin:0 0 10px}
  .plot{width:100%;height:440px}
  .msg{color:var(--mut);font-size:13px;padding:18px 4px}
  .note{border:1px solid #fde68a;background:#fffbeb;border-radius:10px;padding:14px 16px;color:#92400e;font-size:13px;line-height:1.5}
  .note b{color:#78350f}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #cbd5e1;border-top-color:var(--blu);border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/">← Início</a> <a class="back" href="/monitoramento" style="margin-left:8px">Monitoramento</a>
    <h1>Histórico — Plataforma (API PV)</h1>
  </header>
  <div class="sub">Navega dias passados das usinas da API PV. Trackers tem curva histórica completa; Strings e ETM a API PV só fornece do dia atual.</div>

  <div class="controls">
    <div><label>Usina</label><select id="selUsina"><option>carregando…</option></select></div>
    <div><label>Data</label><input type="date" id="selData"></div>
    <div class="segs">
      <button class="seg active" data-s="trackers">Trackers</button>
      <button class="seg" data-s="strings">Strings</button>
      <button class="seg" data-s="etm">ETM</button>
    </div>
  </div>

  <div id="conteudo"><div class="msg"><span class="spin"></span>Carregando usinas…</div></div>
</div>

<script>
const PAL=['#0369a1','#15803d','#d97706','#7c3aed','#db2777','#0891b2','#65a30d','#dc2626','#2563eb','#ca8a04'];
let USINAS=[], curU=null, curSeg='trackers';
const $=s=>document.querySelector(s);
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

async function init(){
  $('#selData').value=hojeISO();
  $('#selData').max=hojeISO();
  try{
    const d=await getJSON('/api/pv/trackers');
    USINAS=(d.rows||[]).filter(r=>r.plant_id!=null).map(r=>({id:r.plant_id,nome:r.usina}));
    USINAS.sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
    if(!USINAS.length){ $('#conteudo').innerHTML='<div class="sec"><div class="msg">Nenhuma usina de trackers na API PV.</div></div>'; return; }
    $('#selUsina').innerHTML=USINAS.map(u=>`<option value="${u.id}">${u.nome}</option>`).join('');
    curU=USINAS[0].id;
    $('#selUsina').onchange=()=>{curU=$('#selUsina').value;load();};
    $('#selData').onchange=load;
    document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>{ curSeg=b.dataset.s; document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('active',x===b)); load(); });
    load();
  }catch(e){ $('#conteudo').innerHTML='<div class="sec"><div class="msg">Erro ao carregar usinas: '+e+'</div></div>'; }
}

function load(){
  if(curSeg==='strings'){ $('#conteudo').innerHTML=`<div class="sec"><h2>Strings — histórico</h2><div class="note"><b>Indisponível na API PV.</b> A Plataforma só entrega as strings do <b>dia atual</b> (o histórico por string não é recuperável). Para curva de strings histórica, use a aba <b>Histórico 2C</b> (usinas ARA/IPX/STL/TUP, dado de 5 em 5 min).</div></div>`; return; }
  if(curSeg==='etm'){ $('#conteudo').innerHTML=`<div class="sec"><h2>ETM — histórico</h2><div class="note"><b>Indisponível de forma confiável na API PV.</b> O histórico de irradiância (POA/GHI) por dia depende de uma consulta lenta que costuma estourar o tempo. Para ETM histórico estável, use a aba <b>Histórico 2C</b>.</div></div>`; return; }
  loadTrackers();
}

async function loadTrackers(){
  const u=curU, ds=$('#selData').value, nome=(USINAS.find(x=>String(x.id)===String(u))||{}).nome||u;
  $('#conteudo').innerHTML=`<div class="sec"><h2>Trackers — curva do dia <span style="color:var(--mut);font-weight:400;font-size:12px">(${nome} · ${ds.split('-').reverse().join('/')})</span></h2>
    <div class="h-sub" id="trk-sub"><span class="spin"></span>buscando a curva na Plataforma (pode levar alguns segundos)…</div>
    <div id="trk-plot" class="plot"></div></div>`;
  try{
    const d=await getJSON(`/api/pv/trackers/${u}/chart?date=${ds}`);
    const trk=(d.trackers||[]).filter(t=>(t.y||[]).some(v=>v!=null));
    if(!trk.length){ $('#trk-sub').textContent='Sem curva de trackers para esse dia (usina pode não ter reportado).'; $('#trk-plot').innerHTML=''; return; }
    $('#trk-sub').textContent=`${trk.length} trackers`;
    const tr=trk.map((t,i)=>({x:t.x,y:t.y,name:t.id,mode:'lines',line:{color:PAL[i%PAL.length],width:1.2},connectgaps:false,hoverinfo:'name+y'}));
    Plotly.newPlot('trk-plot',tr,{margin:{l:46,r:12,t:8,b:34},showlegend:false,hovermode:'closest',
      font:{family:'Poppins,sans-serif',size:10.5,color:'#374151'},paper_bgcolor:'#fff',plot_bgcolor:'#fff',
      xaxis:{gridcolor:'#eef1f4',tickfont:{size:9.5}},yaxis:{title:{text:'graus',font:{size:10}},gridcolor:'#eef1f4',zeroline:false}},
      {displayModeBar:false,responsive:true});
  }catch(e){ $('#trk-sub').textContent='Erro ao buscar a curva: '+e+' (a Plataforma pode estar lenta — tente de novo).'; }
}

init();
</script>
</body>
</html>
