# Deploy do dashboard Thopen (5080) — Render.
#
# ATUALIZADO EM 04/09/2026. O que mudou e por quê:
#   • saiu THOPEN_DATA_DIR=data. Desde 28/08/2026 o dashboard não abre arquivo nenhum: o
#     `fonte_api` monta o workbook EM MEMÓRIA lendo a Gridco Performance API (PostgreSQL).
#     A env não fazia mais nada, e o snapshot em thopen/data/ (5 MB) virou entulho.
#   • entrou GRIDCO_SQL_TOKEN. É o que autentica a leitura. SEM ELE O APP SOBE E NÃO LÊ NADA.
#     Fica com sync:false de propósito: é SEGREDO, tem de ser digitado no painel do Render,
#     nunca commitado aqui.
#   • o startCommand ganhou --chdir thopen, igual ao do Railway. Antes ele dependia de o
#     serviço ter "Root Directory" configurado na mão — duas convenções brigando.
#
# --workers 1 é obrigatório no plano free: cada worker carrega o BD_Thopen inteiro em
# memória (medido: 334 MB de pico) e o free corta em 512 MB. Com 2, estoura.
#
# O deploy leva o REPOSITÓRIO, mas o app são 14 arquivos (~280 KB): thopen/dashboard_thopen.py,
# thopen/fonte_api.py, thopen/fonte_operacao.py, thopen/operacao_mes.py (os dois da Operação no
# Mês, 08/10/2026), thopen/rondas_cliente.py, thopen/fotos_ronda.py, thopen/contestacao.py (as rondas
# e a contestação do cliente, 09/10/2026), thopen/contestacao_banco.py (a contestação no banco, para o Nexus,
# 13/10/2026), thopen/acessos.py, thopen/livro_banco.py e thopen/templates/entrar.html (o login por pessoa,
# 14/10/2026), thopen/geracao_possivel.py (a geração possível pelo IPOA, 20/10/2026), thopen/trip_os.py (o trip
# das OS no comentário do dia, 23/10/2026) e
# thopen/templates/dashboard_thopen.html. THOPEN_OPERACAO=0 no Environment
# desliga a Operação no Mês sem deploy de código.
services:
  - type: web
    name: thopen-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-thopen.txt
    startCommand: gunicorn dashboard_thopen:app --chdir thopen --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /
    envVars:
      - key: GRIDCO_SQL_TOKEN
        sync: false          # SEGREDO — preencher no painel, nunca no repositório
      - key: PYTHON_VERSION
        value: "3.12.7"
