# gemeo/config.toml — NÃO-SEGREDO. Segredos ficam em SECRETS_DIR/gemeo.env, fora do OneDrive.
[usinas]
# Athon/SunOp: so as quatro com relacao tracker x inversor no BD_Trackers (decisao do Levi, 03/09) — TIM100, TIM200,
# JCD100 e SMP100 tem trackers sem inversor. Thopen/PostgreSQL: entraram em 04/09 a pedido do Levi. Elas nao tem a
# relacao tracker x inversor em lugar nenhum, entao a parcela de tracker nao e atribuida; o resto da cascata vale igual,
# e elas trazem placa e coordenadas do proprio banco (tb_power_plants), que as da SunOp ainda nao tem.
piloto = ["MRO100", "MAB100", "MTS100", "CPP100",
          # 04/09: as 18 do PostgreSQL do Thopen que tem estacao com POA, inversor e leitura fresca. Ipixuna 1 e 2
          # ficaram de fora (inversor sim, estacao nao), e as outras 13 do banco nao tem leitura nenhuma.
          "BOA ESPERANCA DO SUL 1", "BOA ESPERANCA DO SUL 2", "CAXAMBU", "GOYTACAZES 1", "APARECIDA 3", "ARACOIABA DA SERRA 1", "ARACOIABA DA SERRA 2", "IBATE 1", "IBATE 2", "PIRACICABA I", "SALTO PIRAPORA III", "SANTA BARBARA I", "SAO BENTO V", "SANTAREM 1", "SANTAREM 2", "APARECIDA DO TABOADO 1", "APARECIDA DO TABOADO 2", "SANTO INACIO XII",
          # 11/09: as tres da 2C que a API PV Operation enxerga pela conta oem@ (Levi: "comece com as usinas da 2C que estao na
          # API PV"). Codigo = "Usina Supervisório" do cadastro. Ipixuna do Para fica de fora (so existe no e-mail).
          "Araputanga", "Sete Lagoas", "Tupi Paulista"]
