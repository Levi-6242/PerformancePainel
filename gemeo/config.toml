# gemeo/config.toml — NÃO-SEGREDO. Segredos ficam em SECRETS_DIR/gemeo.env, fora do OneDrive.
[usinas]
# so usinas com relacao tracker x inversor no BD_Trackers (decisao do Levi, 03/09): as quatro da Athon/SunOp que tem a aba
# preenchida com inversor. TIM100, TIM200, JCD100 e SMP100 tem trackers sem inversor; as do PostgreSQL do Thopen nao tem
# relacao nenhuma no BD_Trackers (so "cabine" no tb_devices). Santarem 1 saiu do piloto por isso.
piloto = ["MRO100", "MAB100", "MTS100", "CPP100"]
# fonte e fuso de cada usina do piloto (o cadastro traz kWp, cliente e inversores depois). Todas na SunOp/gridco, UTC-3 sem
# horario de verao. lat/lon vem da Info Geral quando o cadastro ler essa aba (pendencia B1/B3).
[usinas.detalhe]
MRO100 = { fonte = "sunop", tz = "America/Belem", nome = "MRO100" }
MAB100 = { fonte = "sunop", tz = "America/Belem", nome = "MAB100" }
MTS100 = { fonte = "sunop", tz = "America/Belem", nome = "MTS100" }
CPP100 = { fonte = "sunop", tz = "America/Belem", nome = "CPP100" }
[ritmo_min]
pg = 15
sunop_fino = 15
sunop_lento = 60
cadastro = 30
modelar = 15
[sunop]
teto_dia = 600
lote = 600
janela = ["05:40", "18:20"]
[ingest]
sobreposicao_min = 30
[modelar]
grade_min = 15
[app]
porta = 5075   # era 5070, mas nesta maquina a 5070 e do Painel de Integridade do Coletor (Painel GridCo.exe)
[db]
# SQLite embutido. Vazio = %LOCALAPPDATA%\GridCo\gemeo\gemeo.sqlite (fora do OneDrive). Aceita variaveis de ambiente.
caminho = ""
[publicar]
ativo = true               # ao fim de cada `gemeo modelar`: sync-xlsx (replace) no workbook da API da Performance
workbook = "gemeo_digital"
dias = 90                  # cascata_dia, perda_dia e evento dos ultimos N dias; cadastro e modelo vao inteiros
[caminhos]
cache_dir = "cache"
