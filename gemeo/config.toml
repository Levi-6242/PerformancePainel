# gemeo/config.toml — NÃO-SEGREDO. Segredos ficam em SECRETS_DIR/gemeo.env, fora do OneDrive.
[usinas]
piloto = ["MRO100", "Santarem 1"]
[ritmo_min]
pg = 15
sunop_fino = 15
sunop_lento = 60
cadastro = 30
modelar = 15
[sunop]
teto_dia = 600
lote = 600
janela = ["05:40", "18:20"]
[ingest]
sobreposicao_min = 30
[modelar]
grade_min = 15
[app]
porta = 5070
[db]
schema = "gemeo"   # no banco do Thopen o DBA cria "digital_twins": troque aqui ou por GEMEO_DB_SCHEMA no gemeo.env
[publicar]
ativo = true               # ao fim de cada `gemeo modelar`: sync-xlsx (replace) no workbook da API da Performance
workbook = "gemeo_digital"
dias = 90                  # cascata_dia, perda_dia e evento dos ultimos N dias; cadastro e modelo vao inteiros
[caminhos]
cache_dir = "cache"
