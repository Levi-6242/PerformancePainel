# .github/workflows/gemeo-ci.yml
# Banco de teste e um SQLite temporario (conftest): nao precisa de container nem de segredo.
name: gemeo-ci
on:
  pull_request:
    paths: ["gemeo/**", ".github/workflows/gemeo-ci.yml"]
  push:
    branches: [main]
    paths: ["gemeo/**"]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./gemeo[dev]"
      - run: python -m pytest -q
        working-directory: gemeo
