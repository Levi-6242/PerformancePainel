<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strings e trackers · mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* Sala de controle da Performance (16/11/2026): o desenho aprovado pelo Levi em docs/mockups/sala-de-controle e as
     regras em docs/sala-de-controle.md. GERADO do mockup por um script na 1ª entrega; daqui em diante se edita aqui.
     Um nível de superfície; a cor só no estado. */
  :root{--c-ger:#5aa9f5;--c-poa:#f59a4a;--c-ghi:#e6c84f;--neutro:#7b879d;--grade:#1f2940;--janela:#161d30;--fundo:#090d18;--sup:#161d30;--linha:#1f2940;--linha2:#2a3550;--tinta:#e9eef6;--mudo:#94a3b8;--fraco:#64748b;
        --verde:#a3d900;--ok:#4ade80;--alerta:#ffd83d;--severo:#ff8f3c;--critico:#ff5b6e;--info:#7cb7ff;--violeta:#b497ff;
        --rolagem:#243154;--rolagem-hover:#34426b}
  *{box-sizing:border-box}
  /* a rolagem do Nexus (nexus.css): fina, no tom da superfície */
  html,.lado,.rol{scrollbar-width:thin;scrollbar-color:var(--rolagem) transparent}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--rolagem);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:var(--rolagem-hover)}
  body{margin:0;background:var(--fundo);color:var(--tinta);font:13px/1.45 Poppins,"Segoe UI",system-ui,sans-serif}
  button{font:inherit;color:inherit}
  .tela{display:grid;grid-template-columns:430px minmax(0,1fr);min-height:100vh}
  .lado{border-right:1px solid var(--linha);padding:18px 14px 30px;position:sticky;top:0;height:100vh;overflow:auto}
  .meio{padding:22px 28px 60px;min-width:0}
  h1{font-size:21px;margin:2px 0 2px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1 span{color:var(--mudo);font-weight:400;font-size:15px}
  .sobre{color:var(--verde);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  .frescor{color:var(--fraco);font-size:11.5px;margin:2px 0 16px}
  .frescor b{color:var(--mudo);font-weight:500}
  .lt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fraco);font-weight:600;display:flex;justify-content:space-between}
  .lt span{letter-spacing:0;text-transform:none;font-weight:400}
  /* o "!" do Nexus (gc-explica): a explicação fica guardada */
  .explica{position:relative;display:inline-block}
  .explica summary{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1.5px solid var(--alerta);border-radius:50%;
    background:rgba(255,216,61,.1);color:var(--alerta);font-weight:800;font-size:13px;cursor:pointer;list-style:none}
  .explica summary::-webkit-details-marker{display:none}
  .explica[open] summary,.explica summary:hover{background:var(--alerta);color:#1a1300}
  .explica div{position:absolute;z-index:30;top:calc(100% + 8px);left:0;width:min(600px,calc(100vw - 40px));padding:14px 18px;border:1px solid var(--alerta);
    border-radius:14px;background:#1c2233;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:13px;font-weight:400;color:#cbd5e1;line-height:1.5}
  .explica div p{margin:0 0 8px}.explica div p:last-child{margin:0}.explica div b{color:var(--tinta)}
  .cab,.g,.u{display:grid;grid-template-columns:minmax(90px,1fr) 82px 88px 44px;align-items:center;gap:6px}
  .cab{color:var(--fraco);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--linha)}
  .cab span:not(:first-child){text-align:center}
  .cab small{display:block;font-size:9px;letter-spacing:0;text-transform:none}
  .g{padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .g:hover,.u:hover{background:rgba(148,163,184,.07)}
  .g.on,.u.on{border-color:var(--verde);background:rgba(163,217,0,.06)}
  .g b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g small{color:var(--fraco);font-size:11px;display:block;white-space:nowrap}
  .nome{display:flex;gap:7px;align-items:flex-start;min-width:0}.nome>div{min-width:0}
  .seta{color:var(--fraco);width:10px;flex:none;transition:transform .12s;margin-top:2px}
  .aberto>.g .seta{transform:rotate(90deg)}
  .us{display:none;margin:0 0 6px 17px;border-left:1px solid var(--linha)}
  .aberto>.us{display:block}
  .u{padding:5px 8px 5px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;font-size:12px}
  .u .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--ok)}
  .pt.critico{background:var(--critico)}.pt.atencao{background:var(--severo)}.pt.sem_comm{background:var(--violeta)}.pt.desligada{background:var(--fraco)}
  .par{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
  .par i{font-style:normal;color:var(--fraco)}.par em{font-style:normal;font-weight:600}
  .par em.z{color:var(--fraco);font-weight:400}.par em.s{color:var(--severo)}
  .zero{color:var(--fraco)}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{background:var(--sup);border-radius:12px;padding:14px 16px;border-left:3px solid var(--linha2)}
  .kpi.s{border-left-color:var(--severo)}.kpi.c{border-left-color:var(--critico)}.kpi.o{border-left-color:var(--ok)}
  .kpi .v{font-size:30px;font-weight:600;line-height:1.1}
  .kpi .v small{font-size:13px;color:var(--mudo);font-weight:400}
  .kpi .t{color:var(--mudo);font-size:12px}
  .kpi .d{margin-top:8px;font-size:12px}.kpi .d b{color:var(--severo)}
  .barra{height:5px;border-radius:3px;background:var(--linha2);margin-top:8px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--severo)}
  .sec{margin-top:24px}
  .sec h2,.rec>summary{font-size:15px;margin:0;font-weight:600}
  .sec p{margin:1px 0 10px;color:var(--mudo);font-size:12px}
  .rec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:11px 14px;background:var(--sup);border-radius:10px}
  .rec>summary::-webkit-details-marker{display:none}
  .rec>summary::before{content:"›";color:var(--fraco);transition:transform .12s}
  .rec[open]>summary::before{transform:rotate(90deg)}
  .rec>summary small{color:var(--mudo);font-weight:400;font-size:12px}
  .rec>div{padding-top:14px}
  .dois{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
  .chips{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
  .chip{border:1px solid var(--linha2);background:transparent;color:var(--mudo);border-radius:14px;padding:2px 10px;font-size:11.5px;cursor:pointer}
  .chip.on{border-color:var(--verde);color:var(--tinta)}
  .abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-top:22px}
  .aba{background:none;border:0;padding:9px 14px;color:var(--mudo);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
  .aba.on{color:var(--tinta);border-bottom-color:var(--verde)}
  .aba em{font-style:normal;margin-left:6px;border-radius:9px;padding:0 7px;font-size:11.5px;background:rgba(148,163,184,.14);color:var(--mudo)}
  .aba em.s{background:rgba(255,143,60,.16);color:var(--severo)}
  svg text{fill:var(--fraco);font-size:10px;font-family:inherit}
  .rol{overflow-x:auto;border-radius:10px}
  table{width:100%;min-width:760px;border-collapse:collapse;background:var(--sup);border-radius:10px;overflow:hidden}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fraco);text-align:center;padding:9px 12px;font-weight:600;background:rgba(9,13,24,.35)}
  td{padding:8px 12px;border-top:1px solid var(--linha);font-variant-numeric:tabular-nums;text-align:center}
  th:first-child,td:first-child{text-align:left}
  tr.cl{cursor:pointer}tr.cl:hover td{background:rgba(148,163,184,.06)}
  .tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:600}
  .tag.c{background:rgba(255,91,110,.16);color:var(--critico)}.tag.s{background:rgba(255,143,60,.16);color:var(--severo)}
  .tag.a{background:rgba(255,216,61,.14);color:var(--alerta)}.tag.i{background:rgba(124,183,255,.14);color:var(--info)}
  .tag.n{background:rgba(148,163,184,.14);color:var(--mudo);font-weight:500}.tag.o{background:rgba(74,222,128,.13);color:var(--ok)}
  .mais{color:var(--fraco);font-size:12px;margin-top:8px}
  /* o detalhe da usina: os inversores e as strings do Tempo real */
  .invs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
  .inv{background:var(--sup);border-radius:10px;padding:11px 12px;border-left:3px solid var(--ok);cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0}
  .inv.s{border-left-color:var(--severo)}.inv.c{border-left-color:var(--critico)}.inv.n{border-left-color:var(--fraco)}
  .inv.on{outline:1.5px solid var(--verde)}
  .inv .l1{display:flex;justify-content:space-between;gap:8px}
  .inv .l1 b{font-weight:600}.inv .l1 span{color:var(--mudo);font-size:12px;white-space:nowrap}
  .inv .l2{color:var(--mudo);font-size:11.5px;margin:1px 0 8px}
  .sts{display:flex;flex-wrap:wrap;gap:3px}
  .st{width:25px;height:19px;border-radius:4px;font-size:9.5px;display:flex;align-items:center;justify-content:center;background:rgba(74,222,128,.14);color:var(--ok)}
  .st.sem_corrente{background:var(--critico);color:#1b0508;font-weight:700}.st.baixa_perf{background:var(--severo);color:#1f0d00;font-weight:700}
  .st.trancada{background:transparent;border:1px dashed var(--linha2);color:var(--fraco)}.st.desligado{background:rgba(148,163,184,.14);color:var(--fraco)}
  .leg{display:flex;flex-wrap:wrap;gap:12px;color:var(--mudo);font-size:11.5px;margin-top:10px}
  .leg span{display:inline-flex;align-items:center;gap:5px}.leg .st{width:16px;height:12px}
  .painel{background:var(--sup);border-radius:10px;padding:14px 16px;margin-top:14px}
  .painel h3{margin:0;font-size:14px;font-weight:600}.painel p{margin:1px 0 8px;color:var(--mudo);font-size:12px}
  .lin{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--mudo);margin-top:6px}
  .lin span{display:inline-flex;align-items:center;gap:5px}.lin i{width:14px;height:3px;border-radius:2px;display:inline-block}
  .aviso{background:var(--sup);border-radius:10px;padding:14px 16px;margin-top:14px;color:var(--mudo)}
  .nota{margin-top:34px;border-top:1px solid var(--linha);padding-top:14px;color:var(--fraco);font-size:12px;max-width:980px}
  @media (max-width:1100px){.tela{grid-template-columns:1fr}.lado{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linha)}.kpis,.dois{grid-template-columns:1fr 1fr}}

  /* 3ª rodada: o sino, as ocorrências novas, as cabines, o estado da usina */
  .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .sino{position:relative}
  .sino>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid var(--linha2);border-radius:10px;padding:7px 12px;color:var(--mudo)}
  .sino>summary::-webkit-details-marker{display:none}
  .sino>summary svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
  .sino>summary em{font-style:normal;background:var(--info);color:#06121f;border-radius:9px;padding:0 7px;font-weight:700;font-size:11.5px}
  .sino>div{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:min(460px,calc(100vw - 40px));max-height:70vh;overflow:auto;background:#1c2233;border:1px solid var(--linha2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:8px}
  .sino h4{margin:6px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fraco)}
  .nt{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px;cursor:pointer}
  .nt:hover{background:rgba(148,163,184,.08)}
  .nt b{font-weight:600}.nt small{display:block;color:var(--mudo)}
  .nv{display:inline-block;margin-left:6px;border-radius:8px;padding:0 6px;font-size:10px;font-weight:700;background:var(--info);color:#06121f;vertical-align:middle}
  .quatro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
  .cx{background:var(--sup);border-radius:10px;padding:11px 13px;min-width:0}
  .cx h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fraco);font-weight:600}
  .cx .n{font-size:22px;font-weight:600;line-height:1.1}
  .cx small{color:var(--mudo);font-size:11.5px;display:block;margin-top:3px}
  .passo{display:inline-flex;align-items:center;gap:8px}
  .passo button{width:26px;height:26px;border-radius:7px;border:1px solid var(--linha2);background:transparent;cursor:pointer;font-size:15px;line-height:1}
  .passo button:hover{border-color:var(--verde)}
  .cx .item{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cabine{margin-top:14px}
  .cabine>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 0}
  .cabine>summary::-webkit-details-marker{display:none}
  .cabine>summary::before{content:"›";color:var(--fraco);transition:transform .12s}
  .cabine[open]>summary::before{transform:rotate(90deg)}
  .cabine>summary small{font-weight:400;color:var(--mudo)}
  .cabine .invs{margin-top:8px}
  .inv{outline-offset:1px}
  .st{cursor:pointer;border:0;padding:0;font-family:inherit}
  .st:hover{outline:1.5px solid var(--tinta)}
  .diasel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;align-items:center;color:var(--mudo);font-size:12px}
  tr.exp td{background:rgba(9,13,24,.35);text-align:left}
  .dchip{border:1px solid var(--linha2);background:transparent;border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px;margin:0 6px 6px 0}
  .dchip.sem{border-color:var(--severo);color:var(--severo)}.dchip:hover{background:rgba(148,163,184,.1)}
  tr.sel td{background:rgba(163,217,0,.07)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1c2233;border:1px solid var(--linha2);border-radius:10px;padding:9px 16px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  @media (max-width:1100px){.quatro{grid-template-columns:1fr 1fr}}

  /* 4ª rodada: o campo do Nexus (.gc-campo), a OS no cartão, os cartões dos trackers */
  .campo,.busca,.cx input{font:400 13px/20px Poppins,"Segoe UI",system-ui,sans-serif;color:var(--tinta);background:var(--sup);border:1px solid rgba(255,255,255,.16);
    border-radius:8px;padding:8px 12px;min-width:0;height:auto;outline:none;color-scheme:dark}
  .campo:focus,.busca:focus,.cx input:focus{border-color:var(--verde)}
  .busca{width:100%;margin:10px 0 8px}
  .campo.n{width:76px;text-align:center;font-weight:600;font-size:15px}
  .faixa{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;margin-top:14px;padding:10px 14px;background:var(--sup);border-radius:10px}
  .faixa label{display:flex;align-items:center;gap:10px;color:var(--mudo)}
  .faixa label b{color:var(--tinta);font-weight:600}
  .faixa .campo{background:var(--fundo)}
  .ferr{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;border:1px solid var(--alerta);background:rgba(255,216,61,.1);color:var(--alerta);cursor:pointer;margin-left:6px;vertical-align:middle;padding:0}
  .ferr svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
  .osbox{margin-top:8px;border-top:1px solid var(--linha);padding-top:8px;font-size:12px;color:var(--mudo)}
  .osbox b{color:var(--tinta)}
  .btnl{border:1px solid var(--linha2);background:var(--fundo);color:#cbd5e1;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer}
  .btnl.on{border-color:var(--verde);background:rgba(163,217,0,.16);color:var(--verde)}
  .legb{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12px;color:#cbd5e1}
  .legb.on{background:rgba(163,217,0,.15);border-color:var(--verde);color:var(--tinta);font-weight:600}
  .legb i{width:15px;height:3px;border-radius:2px;display:inline-block}
  .tcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
  .tc{border:1px solid;border-radius:7px;padding:3px 8px;font-size:11.5px;cursor:pointer;background:transparent;font-variant-numeric:tabular-nums}
  .tc.off{opacity:.35;border-style:dashed}
  .coment{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--linha)}
  .coment:first-of-type{border-top:0}
  .coment b{font-weight:600;white-space:nowrap}.coment small{color:var(--fraco);white-space:nowrap}
  .sens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
  .sens div{background:var(--fundo);border-radius:8px;padding:9px 12px}
  .sens small{display:block;color:var(--fraco);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .sens b{font-size:18px;font-weight:600}

  /* 5ª rodada: escolher inversores, criar OS, o aviso da OS já aberta, Geração/PR e Potência */
  .selinv{width:16px;height:16px;accent-color:var(--verde);margin:0 7px 0 0;vertical-align:middle;cursor:pointer}
  .inv.marc{outline:1.5px solid var(--info)}
  .l3{font-size:11px;color:var(--fraco);margin-top:7px}
  .l3 b{color:var(--mudo);font-weight:500}
  .acao{position:sticky;bottom:14px;z-index:20;display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 14px;background:#1c2233;border:1px solid var(--verde);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .btn{background:var(--verde);color:#191528;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
  .btn2{background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px 14px;cursor:pointer}
  .modal{position:fixed;inset:0;z-index:70;background:rgba(4,7,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal>div{background:var(--janela);border-radius:14px;padding:20px 22px;width:min(760px,100%)}
  /* o cartão "Criar OS" com o dobro da largura (Levi, 17/11/2026: "aumente o tamanho do card do OS creator no dobro") */
  .modal>div[aria-label="Criar OS"]{width:min(1520px,100%)}
  .modal h3{margin:0 0 2px;font-size:17px}.modal p{margin:0 0 12px;color:var(--mudo)}
  .osi{border-top:1px solid var(--linha);padding:14px 0}
  .osi h4{margin:0 0 6px;font-size:14px}
  .ja{border:1px solid var(--alerta);background:rgba(255,216,61,.08);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:12.5px}
  .ja b{color:var(--alerta)}
  .livre{color:var(--ok);font-size:12.5px;margin:8px 0}
  .modal textarea,.modal input.campo{width:100%;background:var(--fundo);resize:vertical}
  .modal label{display:block;font:700 11px/14px Poppins,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mudo);margin:8px 0 4px}
  .bh{display:flex;align-items:center;gap:10px;margin:5px 0}
  .bh span:first-child{width:92px;flex:none}.bh .tr{flex:1;height:14px;background:var(--fundo);border-radius:4px;overflow:hidden}
  .bh .tr i{display:block;height:100%;border-radius:4px}.bh span:last-child{width:210px;flex:none;text-align:right;font-variant-numeric:tabular-nums}

  /* 6ª rodada: a busca do Nexus (a do Histórico de OS: lupa, 36 px, canto 10), a dica do gráfico, o que aconteceu */
  .buscaN{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:var(--fundo);color:var(--mudo);margin:10px 0 8px}
  .buscaN:focus-within{border-color:rgba(124,183,255,.42)}
  .buscaN svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
  .buscaN input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--tinta);font:400 13px Poppins,sans-serif;outline:none}
  .buscaN input::placeholder{color:var(--mudo)}
  #dica{position:fixed;z-index:80;pointer-events:none;background:#1c2233;border:1px solid var(--linha2);border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:11.5px;max-width:min(560px,90vw)}
  #dica h5{margin:0 0 5px;font-size:12px;font-weight:600}
  #dica .cols{columns:1;column-gap:14px}#dica .cols.c2{columns:2}#dica .cols.c3{columns:3}#dica .cols.c4{columns:4;font-size:10.5px}#dica:has(.c4){max-width:min(860px,96vw)}
  .tc.nvt{box-shadow:0 0 0 2px var(--critico)}
  #dica .it{display:flex;align-items:center;gap:6px;white-space:nowrap;break-inside:avoid;font-variant-numeric:tabular-nums}
  #dica .it i{width:9px;height:9px;border-radius:2px;flex:none}#dica .it b{margin-left:auto;padding-left:10px;font-weight:600}
  svg[data-ch]{cursor:crosshair}
  .bh.cl{cursor:pointer;border-radius:6px;padding:2px 6px;margin:3px -6px}.bh.cl:hover{background:rgba(148,163,184,.08)}.bh.sel{background:rgba(163,217,0,.08)}
  .lt2{display:grid;grid-template-columns:86px 1fr;gap:6px 12px;font-size:12.5px;margin-top:8px}
  .lt2 span:nth-child(odd){color:var(--mudo)}
  .dd{display:flex;gap:3px;align-items:flex-end;height:64px;margin:10px 0 2px}
  .dd div{flex:1;min-width:0;border-radius:3px 3px 0 0;position:relative}
  .ddl{display:flex;gap:3px;font-size:9.5px;color:var(--fraco)}.ddl span{flex:1;text-align:center}

  /* 8ª rodada: a caixa de marcar da Grid (escura, borda clara; marcada = verde com o visto escuro) */
  input[type=checkbox].selinv{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid rgba(255,255,255,.34);border-radius:5px;background:transparent;
    display:inline-grid;place-content:center;margin:0 8px 0 0;vertical-align:-3px;cursor:pointer;flex:none}
  input[type=checkbox].selinv:hover{border-color:var(--verde)}
  input[type=checkbox].selinv:checked{background:var(--verde);border-color:var(--verde)}
  input[type=checkbox].selinv:checked::after{content:"";width:9px;height:5px;border-left:2px solid #191528;border-bottom:2px solid #191528;transform:rotate(-45deg) translate(1px,-1px)}
  input[type=checkbox].selinv:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
  .perfil{display:inline-flex;align-items:center;gap:6px;color:var(--fraco);font-size:11.5px;margin-right:12px}

  /* 9ª rodada: a caixa não mexe a linha ao marcar (o visto é desenhado por cima), e mais respiro nos rótulos */
  .inv .l1 b{display:inline-flex;align-items:center;min-width:0}
  input[type=checkbox].selinv{display:inline-block;position:relative;vertical-align:middle;margin:0 8px 0 0}
  input[type=checkbox].selinv:checked::after{position:absolute;left:3px;top:3.5px;transform:rotate(-45deg)}
  .lt2{gap:16px 14px}
  .ddl.dp span{font-weight:600;font-size:10px}

  /* 10ª rodada: linhas sutis entre as colunas da lateral, e a barra no lugar do ponto entre os dois números */
  .cab,.g,.u{gap:0}
  .cab span:not(:first-child),.g>.par,.u>.par{border-left:1px solid rgba(255,255,255,.1);align-self:stretch;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px}
  .cab span:not(:first-child){flex-direction:column;gap:0}
  .par u{text-decoration:none;color:var(--fraco);font-weight:400}

  /* 12ª rodada: os números do alto como uma faixa só (sem cartão): rótulo, o número que pede ação, e o total embaixo */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
  .kn{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%;padding:14px 20px 15px;border-left:1px solid rgba(255,255,255,.1);cursor:pointer;min-width:0;position:relative;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left;border-radius:0}
  .kn:first-child{border-left:0;padding-left:2px}
  .kn:hover{background:rgba(148,163,184,.05)}
  .kn:hover::after{content:"›";position:absolute;right:14px;top:12px;color:var(--mudo);font-size:16px}
  .kn small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fraco);font-weight:600}
  .kn .num{display:flex;align-items:baseline;gap:8px;margin-top:6px;white-space:nowrap}
  .kn .num b{font-size:34px;font-weight:600;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .kn .num span{font-size:13px;color:var(--tinta)}
  .kn .sub{margin-top:6px;font-size:12px;color:var(--mudo)}
  .kn.acao .num b{color:var(--severo)}.kn.crit .num b{color:var(--critico)}.kn.bom .num b{color:var(--ok)}
  @media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}.kn:nth-child(3){border-left:0;padding-left:2px}.kn:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}}

  /* 13ª rodada: volta o cartão (fundo e canto), SEM a borda colorida à esquerda; as três linhas de cada cartão têm a mesma
     altura, então os números ficam na mesma linha nos quatro */
  .kpis{gap:12px;border:0}
  .kn,.kn:first-child{background:var(--sup);border:0;border-radius:12px;padding:14px 16px 15px;display:grid;grid-template-rows:16px 40px 18px;row-gap:5px;align-items:end;justify-items:start}
  .kn:hover{background:#1b2338}
  .kn,.kn:first-child{box-sizing:border-box;height:114px;overflow:hidden;align-content:start}
  .kn:hover::after{content:none}
  .kn small{line-height:16px;align-self:start}
  .kn .num{margin:0;align-items:baseline;min-width:0;max-width:100%}
  .kn .num span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .kn .sub{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:18px}
  @media (max-width:1100px){.kn:nth-child(n){border:0;padding:14px 16px 15px}}

  /* 14ª rodada: a lateral em cartões por fonte (o desenho C) */
  .lado .cab{display:none}
  .lado .f{background:var(--sup);border-radius:12px;margin-bottom:8px;overflow:hidden;border:1px solid transparent}
  .lado .f .g{display:block;padding:11px 13px;border:0;border-radius:0}
  .lado .f .g:hover{background:rgba(148,163,184,.06)}
  .lado .f:has(>.g.on){border-color:var(--verde)}
  .lado .f .g.on{background:rgba(163,217,0,.05)}
  .lado .l1{display:flex;align-items:center;gap:8px}
  .lado .l1 b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .lado .l1 small{color:var(--fraco);font-size:11px;white-space:nowrap}
  .lado .tri{display:grid;grid-template-columns:repeat(3,1fr);margin-top:9px}
  .lado .tri div{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fraco)}
  .lado .tri b{display:block;font-size:17px;letter-spacing:0;color:var(--severo);font-weight:600;line-height:1.25}
  .lado .tri b.z{color:var(--fraco);font-weight:400}
  .lado .tri i{font-style:normal;text-transform:none;letter-spacing:0;font-size:11px}
  .lado .f .us{margin:0;border-left:0;border-top:1px solid rgba(255,255,255,.09);padding:6px 6px 8px}
  .lado .uc,.lado .f .u{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 40px 30px;align-items:center;gap:0}
  .lado .ac{border-radius:5px}.lado .ac.ed{cursor:text}.lado .ac.ed:hover{background:rgba(148,163,184,.16)}
  .lado .aci{width:34px;padding:1px 2px;text-align:center;font:inherit;border-radius:5px;border:1px solid var(--verde);background:var(--fundo);color:var(--tinta)}
  .cosm{margin-left:5px;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--info);border:1px solid var(--info);border-radius:4px;padding:0 3px;flex:none}
  .dvg{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;border:1.5px solid var(--alerta);color:var(--alerta);font-size:9.5px;font-weight:700;line-height:1;cursor:pointer;flex:none}
  /* A lateral 10% maior (Levi, 17/11/2026: "Aumente a fonte também, dessa barra lateral [...] em 10%"): cada tamanho × 1,1 */
  .tela .lado{font-size:14.3px}.tela .lado .lt{font-size:12.1px}.tela .lado .campo{font-size:14.3px}
  .tela .lado .l1 small{font-size:12.1px}.tela .lado .tri div{font-size:10.5px}.tela .lado .tri b{font-size:16.5px}.tela .lado .tri i{font-size:11.6px}
  .tela .lado .uc{font-size:11px}.tela .lado .f .u{font-size:13.2px}.tela .lado .f .ug{font-size:11px}.tela .lado .f .ug small{font-size:11.6px}
  .tela .lado .f .u b.az,.tela .lado .tri b.az{color:var(--info)}
  .tela .lado .tri{grid-template-columns:1.2fr 1.3fr .7fr;column-gap:6px}      /* com a letra maior, a ETM (um número só) cede espaço */
  /* A linha de botões da aba Strings fica presa no topo ao rolar a lista de inversores (Levi, 17/11/2026) */
  .barrafix{position:sticky;top:0;z-index:18;margin-top:14px;padding:8px 0;background:var(--fundo);box-shadow:0 1px 0 var(--linha)}
  .barrafix .btn{padding:6px 13px;font-size:11.5px;white-space:nowrap}.barrafix .btn[disabled]{opacity:.55;cursor:default}
  /* AS STRINGS EM CARTÃO (Levi, 17/11/2026): o número em cima e a corrente embaixo, sempre, inclusive na trancada (em
     azul, com a borda tracejada e sem cadeado): se o técnico ligar uma string numa entrada trancada, a corrente aparece. */
  .sts{gap:5px}
  button.st{width:auto;min-width:50px;height:auto;padding:5px 5px 5px;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;text-align:center;border:1px solid rgba(163,217,0,.42);border-radius:7px;background:rgba(163,217,0,.06);color:var(--verde);font-size:11.5px;font-weight:700;line-height:1.15}
  button.st small{font-size:10.5px;font-weight:400;color:var(--mudo);font-variant-numeric:tabular-nums}
  button.st.sem_corrente{border-color:var(--critico);background:rgba(255,91,110,.12);color:var(--critico)}
  button.st.baixa_perf{border-color:var(--severo);background:rgba(255,143,60,.12);color:var(--severo)}
  button.st.trancada{border:1px dashed var(--c-ger);background:rgba(90,169,245,.07);color:var(--c-ger)}
  button.st.inativa,button.st.desligado{border-color:var(--linha2);background:rgba(148,163,184,.07);color:var(--fraco)}
  .leg .st.trancada{border:1px dashed var(--c-ger)}
  html[data-tema="claro"] button.st{background:rgba(86,102,16,.07);border-color:rgba(86,102,16,.45);color:#3d4a0a}
  html[data-tema="claro"] button.st.sem_corrente{background:rgba(190,18,60,.08);border-color:#be123c;color:#be123c}
  html[data-tema="claro"] button.st.baixa_perf{background:rgba(194,65,12,.08);border-color:#c2410c;color:#c2410c}
  html[data-tema="claro"] button.st.trancada{background:rgba(31,111,208,.06);border:1px dashed #1f6fd0;color:#1f6fd0}
  html[data-tema="claro"] button.st.inativa,html[data-tema="claro"] button.st.desligado{background:rgba(15,23,42,.04);border-color:rgba(15,23,42,.18);color:#475569}
  .coment small{min-width:108px}
  .lado .uc{padding:0 8px 2px;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fraco)}
  .lado .uc span:not(:first-child),.lado .f .u>span:not(.n){text-align:right;font-variant-numeric:tabular-nums}
  .lado .f .u{padding:5px 8px;font-size:12px;border-radius:7px}
  .lado .f .u b{color:var(--severo);font-weight:600}

  /* 15ª rodada: o que tem ocorrência nova PULSA (a fonte, a usina e o inversor) até alguém abrir. É movimento que
     informa, então roda mesmo com as animações do Windows desligadas (prefers-reduced-motion): não pôr atrás dessa regra. */
  @keyframes pulsoF{0%,100%{border-color:rgba(240,222,150,.18)}50%{border-color:rgba(240,222,150,.95)}}
  @keyframes pulsoN{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes pulsoL{0%,100%{background:transparent}50%{background:rgba(240,222,150,.12)}}
  .lado .f.pulsa{animation:pulsoF 1.8s ease-in-out infinite}
  .lado .f.pulsa:has(>.g.on){animation:none}
  .lado .u.pulsa{animation:pulsoL 1.8s ease-in-out infinite}
  .pulsa .nv,.inv .nv,.aba .nv,.cabine>summary .nv{display:inline-block;animation:pulsoN 1.4s ease-in-out infinite}
  .inv:has(.l1 .nv){animation:pulsoI 1.8s ease-in-out infinite}
  @keyframes pulsoI{0%,100%{outline:1.5px solid rgba(240,222,150,.18)}50%{outline:1.5px solid rgba(240,222,150,.95)}}
  .nv,.sino>summary em{background:#f0de96;color:#2a2410}

  /* 16ª rodada: o pulso em vermelho (sem sombra, sem mexer no tamanho), e o bloco "o que olhar primeiro" */
  @keyframes pulsoF{0%,100%{border-color:rgba(255,91,110,.2)}50%{border-color:rgba(255,91,110,1)}}
  @keyframes pulsoL{0%,100%{background:transparent}50%{background:rgba(255,91,110,.13)}}
  @keyframes pulsoI{0%,100%{outline:1.5px solid rgba(255,91,110,.2)}50%{outline:1.5px solid rgba(255,91,110,1)}}
  .nv,.sino>summary em{background:var(--critico);color:#2a070c}
  .prio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
  .pc{background:var(--sup);border-radius:12px;padding:13px 15px;min-width:0}
  .pc h4{margin:0;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fraco);font-weight:600}
  .pc .pn{font-size:26px;font-weight:600;line-height:1.15;margin-top:5px}.pc .pn small{font-size:12px;color:var(--mudo);font-weight:400;margin-left:6px}
  .pc .pi{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(255,255,255,.07);padding:6px 0 5px;cursor:pointer;font-size:12px;min-width:0}
  .pc .pi:hover b{text-decoration:underline}
  .pc .pi b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc .pi span{color:var(--mudo);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc .pleg{color:var(--mudo);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .pc .lista{margin-top:9px}.pc .vazio{color:var(--fraco);font-size:12px;margin-top:9px}
  .idd{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font-size:12.5px}
  .idd:hover,.idd.on{background:rgba(148,163,184,.08)}.idd.on{outline:1px solid var(--verde)}
  .idd .tr{height:16px;background:var(--fundo);border-radius:5px;overflow:hidden;display:flex}
  .idd .tr i{display:block;height:100%}
  .idd span:last-child{text-align:right;color:var(--mudo);font-variant-numeric:tabular-nums}
  @media (max-width:1100px){.prio{grid-template-columns:1fr 1fr}}

  /* 17ª rodada: a visão geral em abas; a tabela rola dentro dela (cabeçalho fixo), a página não desce */
  .vg{margin-top:16px}
  .geral .sec{margin-top:16px}
  .geral .sec>.rol{max-height:46vh;overflow:auto}
  .geral .sec>.rol thead th{position:sticky;top:0;background:#111829;z-index:2}
  .geral .painel .rol{max-height:36vh;overflow:auto}

  /* a aba Strings cabe na primeira tela: "há quanto tempo" e "por usina" lado a lado, a tabela só com as colunas da aba */
  .grade2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start;margin-top:14px}
  .grade2>.painel,.grade2>.sec{margin-top:0}
  .grade2 table,.geral .sec>.rol table{min-width:0}
  .grade2 .sec>.rol{max-height:236px}
  .grade2 .sec h2{margin-bottom:8px}.grade2 .sec>p{display:none}
  @media (max-width:1250px){.grade2{grid-template-columns:1fr}}

  /* nomes e grupos só na Sala (16/11, noite): o cabeçalho do grupo na lateral e a janela da engrenagem */
  .ocl{margin-top:8px;border-radius:10px;overflow:hidden;background:var(--sup)}
  .oc{display:grid;grid-template-columns:118px minmax(0,1.5fr) minmax(0,1.2fr) 150px 96px auto;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--linha);border-left:3px solid var(--fraco);cursor:pointer;font-size:12.5px}
  .oc.cab{cursor:default;border-top:0;border-left-color:transparent;color:var(--fraco);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  .oc.ab{border-left-color:var(--critico)}.oc.on{background:rgba(163,217,0,.07)}.oc:not(.cab):hover{background:rgba(148,163,184,.07)}
  .oc>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.oc b{font-weight:600}
  .ocx{padding:6px 12px 12px;border-left:3px solid transparent}
  .gi{margin:2px 0 10px;padding:10px 12px;border-radius:10px;background:var(--fundo)}.gi p{margin:0;color:var(--mudo);font-size:12.5px}
  .lado .f .ug{display:flex;align-items:baseline;gap:6px;padding:8px 8px 3px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--verde)}
  .lado .f .ug small{color:var(--fraco);text-transform:none;letter-spacing:0;font-size:10.5px}
  .lado .f .u.dg{padding-left:16px}
  .modal>div.cfgj{width:min(1180px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;gap:12px}
  .cfgj p{margin:0;color:var(--mudo);font-size:12.5px;line-height:1.5}
  .cfgj .cfgl{flex:1;min-height:0;overflow:auto;max-height:calc(100vh - 330px)}
  .cfgj .cfgl td{padding:4px 8px}.cfgj .cfgl input.campo{width:100%;padding:5px 8px;background:var(--fundo)}
  .cfgj iframe{width:100%;height:calc(100vh - 190px);border:0;border-radius:10px;background:var(--fundo)}
  /* retornos de 16/11 (noite): os valores no centro, a lista de inversores, a engrenagem */
  .lado .tri div{text-align:center}
  /* 1.16 (Levi, 16/11/2026: "reduza um pouco a altura desses cards, para ficar em um formato que caiba mais coisas"): o
     rótulo, o número e o "de N" numa linha só, e menos respiro: o cartão da fonte cai de ~100 para ~60 px */
  .lado .f{margin-bottom:6px}.lado .f .g{padding:8px 12px}
  .lado .tri{margin-top:5px}
  .lado .tri div{display:flex;align-items:baseline;justify-content:center;gap:5px;white-space:nowrap;font-size:9.5px}
  .lado .tri b{display:inline;font-size:15px;line-height:1.2}
  .lado .tri i{font-size:10.5px}
  .lado .uc span:not(:first-child),.lado .f .u>span:not(.n){text-align:center}
  .lado .g .gn{cursor:pointer}.lado .g .gn:hover{text-decoration:underline;text-decoration-color:rgba(163,217,0,.6)}
  .kpis[hidden]{display:none}
  .st.inativa{background:rgba(148,163,184,.14);color:var(--fraco)}
  .ilista{margin-top:8px;border-radius:10px;overflow:hidden;background:var(--sup)}
  .il{display:grid;grid-template-columns:24px minmax(150px,1.3fr) 84px 96px 104px 84px 84px minmax(0,1.7fr) 34px;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--linha);border-left:3px solid var(--ok);cursor:pointer;font-size:12.5px}
  .il.c{border-left-color:var(--critico)}.il.s{border-left-color:var(--severo)}.il.n{border-left-color:var(--fraco)}
  .il.cab{cursor:default;border-top:0;border-left-color:transparent;color:var(--fraco);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:7px 12px}
  .il.on{background:rgba(163,217,0,.07)}.il:not(.cab):hover{background:rgba(148,163,184,.07)}
  .il>span{text-align:center;font-variant-numeric:tabular-nums;min-width:0}

  const u = SEL.k && US[SEL.k], g = SEL.g && D.fontes.find(f => f.id === SEL.g);
  q("#recorte").textContent = u ? "· " + u.u : g ? "· " + g.nome : "· SCADA Grid e banco da Thopen";
  q("#mesop").textContent = D.mes.slice(5) + "/" + D.mes.slice(0, 4);
  q("#fresco1").textContent = "pacote das " + (D.gerado || "").slice(11);
  q("#frescor").innerHTML = `Falhas do mês geradas às <b>${esc((D.gerado || "").slice(11))}</b> de ${dh((D.gerado || "").slice(0, 10))} · lido às <b>${D.lido}</b> · de 01 a ${D.hoje.slice(8)}/${D.hoje.slice(5, 7)} · régua: ${esc(D.regua.janela_strings || "")}`;
  let h = "";
  if (u) {
    const f = D.fontes.find(z => z.id === u.g);
    h = `<div class="faixa" style="margin-top:14px"><b>${esc(u.u)}</b><span>${esc(f.nome)}</span>
      <span>Strings: ${semStr(u) ? `<span class="tag c">fora da conta do mês</span>` : `<b>${u.ds ?? 0}</b> dias registrados`}</span>
      <span>Trackers: ${semTrk(u) ? `<span class="tag c">fora da conta do mês</span>${u.trkAgora ? ` <span class="tag n">${u.trkAgora} parados agora no tempo real</span>` : ""}` : nuncaTrk(u) ? "sem registro no mês" : `<b>${u.dt}</b> dias registrados`}</span>
      <span>Comunicou em <b>${u.dc ?? "—"}</b> dias</span><span style="flex:1"></span><button class="btnl" data-mock="Abre a usina na Sala de controle, na aba Strings">Abrir na Sala de controle</button></div>`;
  }
  q("#cabu").innerHTML = h;
  const s = D.s.filter(o => noRecorte(o.k) && !o.fim).reduce((x, o) => x + o.strs.length, 0), t = D.t.filter(o => noRecorte(o.k) && !o.fim).length;
  q("#abas").innerHTML = [["s", "Strings", s], ["t", "Trackers", t], ["q", "Qualidade do dado", null]].map(([a, r, n]) => `<button class="aba ${ABA === a ? "on" : ""}" data-aba="${a}">${r}${n == null ? "" : `<em class="${n ? "s" : ""}">${n}</em>`}</button>`).join("");
}

// o gráfico: linhas no tempo do dia (minuto → valor)
function linhas(series, o) {
  const W = 1000, H = 230, m = {l: 44, r: 12, t: 10, b: 24}, x0 = o.x0 ?? 300, x1 = o.x1 ?? 1140;
  const ys = series.flatMap(s => s.p.filter(p => p[0] >= x0 && p[0] <= x1).map(p => p[1]));
  if (!ys.length) return `<div class="mais">Sem leitura no período.</div>`;
  let y0 = Math.min(0, ...ys), y1 = Math.max(...ys); if (y1 - y0 < 1) y1 = y0 + 1; const fol = (y1 - y0) * .06; y1 += fol; if (y0 < 0) y0 -= fol;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  let g = "";
  for (let h = Math.ceil(x0 / 120) * 120; h <= x1; h += 120) g += `<line x1="${X(h)}" x2="${X(h)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--grade)"/><text x="${X(h)}" y="${H - 7}" text-anchor="middle" fill="var(--fraco)" font-size="11">${String(h / 60).padStart(2, "0")}h</text>`;
  for (let i = 0; i <= 4; i++) { const v = y0 + (y1 - y0) * i / 4; g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grade)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" fill="var(--fraco)" font-size="11">${n1(v)}</text>`; }
  const tr = s => { let d = "", ult = null; s.p.forEach(p => { if (p[0] < x0 || p[0] > x1) return; d += (ult != null && p[0] - ult <= 20 ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); ult = p[0]; });
    return `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="${s.larg || 1.2}" ${s.trac ? 'stroke-dasharray="5 4"' : ""} opacity="${s.op || 1}"/>`; };
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.rot || "curva do dia")}">${g}${series.filter(s => !s.frente).map(tr).join("")}${series.filter(s => s.frente).map(tr).join("")}<text x="${m.l}" y="${m.t + 2}" fill="var(--fraco)" font-size="11">${esc(o.un || "")}</text></svg>`;
}
const numDe = s => (String(s).match(/(\d+)\s*$/) || [])[1];
function drillS(o) {
  const c = (D.curvas[o.k] || {})[o.inv];
  if (!c) return `<div class="mais">Neste mockup a curva real foi lida só em ${lista(D.lidas.map(k => US[k].u))}. Na tela, toda ocorrência abre aqui a curva das strings do inversor no dia escolhido, pela mesma rota e com a mesma cópia da Sala de controle.</div>`;
  const alvo = new Set(o.strs.map(numDe)), ser = Object.entries(c).sort((a, b) => natural(a[0], b[0])).map(([n, p]) => alvo.has(numDe(n)) ? {p, cor: "var(--critico)", larg: 2, frente: true} : {p, cor: "var(--neutro)", op: .55});
  return linhas(ser, {un: "A", rot: "Corrente das strings do " + o.inv}) + `<div class="mais">Hoje, ${dh(D.hoje)}, 05h às 19h. Cinza = as outras ${ser.length - alvo.size} strings do inversor · <b style="color:var(--critico)">vermelho</b> = ${o.strs.length > 1 ? "as strings desta ocorrência" : "a string desta ocorrência"} (${esc(lista(o.strs))}).</div>`;
}
function drillT(o) {
  const c = D.trk[o.k], p = c && c.t[o.trk];
  if (!p) return `<div class="mais">Neste mockup o ângulo real foi lido só em ${lista(Object.keys(D.trk).map(k => US[k].u)) || "nenhuma usina"}${c ? " (dos trackers parados agora)" : ""}. Na tela, toda ocorrência abre aqui o ângulo do tracker contra o alvo, com os dias da parada num gráfico só, contínuo.</div>`;
  return linhas([{p: c.alvo, cor: "var(--c-poa)", trac: true, larg: 1.4}, {p, cor: "var(--c-ger)", larg: 2, frente: true}], {un: "graus", rot: "Ângulo do " + o.trk})
    + `<div class="mais">Hoje, ${dh(D.hoje)}. <b style="color:var(--c-ger)">Azul</b> = o ângulo do ${esc(o.trk)} · <b style="color:var(--c-poa)">laranja tracejado</b> = o alvo.</div>`;
}

const avisos = o => o.flags.length ? `<div class="mais">Avisos da conta: ${esc(o.flags.join(" · "))}.</div>` : "";
const sit = o => o.fim ? `Voltou ${dh(o.fim)}` : `Parado agora`;
function linhaS(o, comUsina) {
  const id = idS(o), ab = ABERTAS.has(id), fora = FORA.has(id);
  return `<div class="oc s8 ${comUsina ? "" : "sem"} ${o.fim ? "" : "ab"} ${ab ? "on" : ""} ${fora ? "fora" : ""}" data-oc="${esc(id)}" role="button" tabindex="0" aria-expanded="${ab}">
    <span><input type="checkbox" data-marc="${esc(id)}" ${MARC.has(id) ? "checked" : ""} aria-label="Escolher para criar OS"></span><span>${dh(o.ini)}</span>${comUsina ? `<span>${esc(US[o.k].u)}</span>` : ""}
    <span title="${esc(o.inv + ": " + lista(o.strs.slice().sort(natural)))}"><b>${esc(o.inv)}</b><span class="sub">${o.strs.length > 1 ? o.strs.length + " strings: " : ""}${esc(lista(o.strs.slice().sort(natural)))}</span></span>
    <span title="${esc(o.flags.join(" · "))}">${o.fim ? sit(o) : `<span class="tag c">Parada agora</span>`}<span class="sub">${pl(o.dias, "dia")}</span></span>
    <span class="d">${n1(o.h)} h</span><span class="d">${o.perda ? "≈ " + kwh(o.perda) : "—"}</span>
    <span class="ac">${o.os ? `<span class="tag ${/conclu/i.test(o.os[1]) ? "o" : "i"}" title="${esc(o.os[1])}">OS ${esc(o.os[0])}</span>` : `<button class="btnl" data-mock="Abre o Criar OS já preenchido: ${esc(US[o.k].u)}, ${esc(o.inv)}, strings ${esc(lista(o.strs))} com corrente nula, verificar e normalizar">Criar OS</button>`}<button class="btnl" data-fora="${esc(id)}">${fora ? "Voltar à conta" : "Tirar da conta"}</button></span></div>
    ${ab ? `<div class="ocx">${drillS(o)}${avisos(o)}</div>` : ""}`;
}
function linhaT(o, comUsina) {
  const id = idT(o), ab = ABERTAS.has(id), fora = FORA.has(id);
  return `<div class="oc s8 ${comUsina ? "" : "sem"} ${o.fim ? "" : "ab"} ${ab ? "on" : ""} ${fora ? "fora" : ""}" data-oc="${esc(id)}" role="button" tabindex="0" aria-expanded="${ab}">
    <span><input type="checkbox" data-marc="${esc(id)}" ${MARC.has(id) ? "checked" : ""} aria-label="Escolher para criar OS"></span><span>${dh(o.ini)}</span>${comUsina ? `<span>${esc(US[o.k].u)}</span>` : ""}
    <span><b>${esc(o.trk)}</b>${o.cron ? `<span class="tag n" style="margin-left:6px">crônico</span>` : ""}${o.semCom ? `<span class="tag a" style="margin-left:6px">sem comunicação desde ${dh(o.semCom)}</span>` : ""}</span>
    <span title="${esc(o.flags.join(" · "))}">${o.fim ? sit(o) : `<span class="tag c">Parado agora</span>`}<span class="sub">${o.dias} ${o.dias === 1 ? "dia" : "dias"} · desvio ${o.desvio == null ? "sem ângulo" : n1(o.desvio) + "°"}</span></span>
    <span class="d">${n1(o.h)} h</span><span class="d">${o.perda ? "≈ " + kwh(o.perda) : "—"}</span>
    <span class="ac"><button class="btnl" data-mock="Abre o Criar OS já preenchido: ${esc(US[o.k].u)}, verificação de tracker parado, ${esc(o.trk)}">Criar OS</button><button class="btnl" data-fora="${esc(id)}">${fora ? "Voltar à conta" : "Tirar da conta"}</button></span></div>
    ${ab ? `<div class="ocx">${drillT(o)}${avisos(o)}</div>` : ""}`;
}

function corpo() {
  const comUsina = !SEL.k, us = usinasDoRecorte();
  if (ABA === "q") {
    q("#corpo").innerHTML = `<div class="sec"><h2>O que entra na conta do mês, usina por usina</h2><p>Dias do mês com registro de string e de tracker, e em quantos a usina comunicou. "Fora da conta" é a usina que a Sala de controle lê no tempo real e que as falhas do mês ainda não registram.</p>
      <div class="rol" style="overflow:auto"><table class="cobt"><thead><tr><th>Usina</th><th>Fonte</th><th>Strings</th><th>Trackers</th><th>Comunicou</th><th>Trackers parados agora (tempo real)</th></tr></thead><tbody>
      ${us.sort((a, b) => (semTrk(b) + semStr(b)) - (semTrk(a) + semStr(a)) || natural(a.u, b.u)).map(u => `<tr><td>${esc(u.u)}</td><td>${esc(D.fontes.find(f => f.id === u.g).nome)}</td>
        <td>${semStr(u) ? `<span class="tag c">fora da conta</span>` : u.ds + " dias"}</td><td>${semTrk(u) ? `<span class="tag c">fora da conta</span>` : nuncaTrk(u) ? `<span class="zero">sem registro</span>` : u.dt + " dias"}</td><td>${u.dc == null ? "—" : u.dc + " dias"}</td><td>${u.trkAgora == null ? "—" : u.trkAgora || `<span class="zero">0</span>`}</td></tr>`).join("")}</tbody></table></div></div>`;
    return;
  }
  const base = (ABA === "s" ? D.s : D.t).filter(o => noRecorte(o.k)), id = ABA === "s" ? idS : idT;
  let l = base.filter(o => (!SO_AB || !o.fim) && !(ABA === "t" && SEM_CRON && o.cron));
  l.sort((a, b) => (a.fim ? 1 : 0) - (b.fim ? 1 : 0) || (a.fim ? b.ini.localeCompare(a.ini) : b.perda - a.perda));
  const fora = base.filter(o => FORA.has(id(o))).length, semNada = ABA === "s" ? us.filter(semStr) : us.filter(semTrk);
  const aviso = semNada.length ? `<div class="faixa av" style="margin-top:12px"><span class="tag c">Fora da conta</span><span>${ABA === "s" ? `As strings de <b>${pl(semNada.length, "usina")}</b> deste recorte não entram nas falhas do mês hoje: ${esc(lista(semNada.slice(0, 6).map(u => u.u)))}${semNada.length > 6 ? " e mais " + (semNada.length - 6) : ""}.`
      : `Os trackers de ${esc(lista([...new Set(semNada.map(u => D.fontes.find(f => f.id === u.g).nome.split(" · ")[0]))]))} (<b>${pl(semNada.length, "usina")}</b>; nem todas têm tracker) são lidos pela Sala no tempo real e não entram nas falhas do mês hoje.`} O rework passa a registrar.</span></div>` : "";
  q("#corpo").innerHTML = `<div class="diasel barrafix" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="btnl ${SO_AB ? "on" : ""}" data-soab="1">Só parados agora</button>${ABA === "t" ? `<button class="btnl ${SEM_CRON ? "on" : ""}" data-cron="1">Esconder crônicos</button>` : ""}
      <span style="color:var(--mudo);font-size:12.5px;margin-left:6px">${l.length} ${l.length === 1 ? "ocorrência" : "ocorrências"}${SO_AB ? "" : " no mês"}</span><span style="flex:1"></span>
      <button class="btnl" data-mock="Abre a gaveta com o que foi tirado da conta, quem tirou e quando">Tiradas da conta (${fora})</button><button class="btnl" data-mock="Baixa o Excel deste recorte">Baixar Excel</button>
      <button class="btn" data-mock="Abre o Criar OS com as ${MARC.size} ocorrências escolhidas, uma OS por inversor" ${MARC.size ? "" : "disabled"}>Criar OS${MARC.size ? " (" + MARC.size + ")" : ""}</button></div>${aviso}
    ${l.length ? `<div class="ocl"><div class="oc s8 cab ${comUsina ? "" : "sem"}"><span></span><span>Parou</span>${comUsina ? "<span>Usina</span>" : ""}<span>${ABA === "s" ? "Inversor · strings" : "Tracker"}</span><span>Situação</span><span class="d">Sol parado</span><span class="d">Perda</span><span></span></div>
      ${l.slice(0, LIM).map(o => (ABA === "s" ? linhaS : linhaT)(o, comUsina)).join("")}</div>${l.length > LIM ? `<div class="mais"><button class="btnl" data-mais="1">Ver mais ${Math.min(60, l.length - LIM)} de ${l.length - LIM}</button></div>` : ""}`
      : `<div class="mais" style="margin-top:14px">${base.length ? "Nada parado agora neste recorte. Tire o filtro para ver as " + base.length + " ocorrências do mês." : "Sem ocorrência registrada no mês neste recorte."}</div>`}`;
}

function tudo() { lado(); topo(); kpis(); corpo(); }
let tT = null;
function toast(t) { const e = q("#toast"); e.textContent = "No mockup nada grava. Na tela: " + t; e.hidden = false; clearTimeout(tT); tT = setTimeout(() => { e.hidden = true; }, 5200); }
document.addEventListener("click", ev => {
  const t = ev.target, c = s => t.closest(s);
  if (c("[data-marc]")) { const id = c("[data-marc]").dataset.marc; MARC.has(id) ? MARC.delete(id) : MARC.add(id); corpo(); return; }
  if (c("[data-mock]")) { toast(c("[data-mock]").dataset.mock); return; }
  if (c("[data-fora]")) { const id = c("[data-fora]").dataset.fora; FORA.has(id) ? FORA.delete(id) : FORA.add(id); corpo(); return; }
  if (c("[data-soab]")) { SO_AB = !SO_AB; LIM = 60; corpo(); return; }
  if (c("[data-cron]")) { SEM_CRON = !SEM_CRON; corpo(); return; }
  if (c("[data-mais]")) { LIM += 60; corpo(); return; }
  if (c("[data-aba]")) { ABA = c("[data-aba]").dataset.aba; LIM = 60; topo(); corpo(); return; }
  if (c("[data-oc]")) { const id = c("[data-oc]").dataset.oc; ABERTAS.has(id) ? ABERTAS.delete(id) : ABERTAS.add(id); corpo(); return; }
  if (c(".u[data-u]")) { const k = c(".u[data-u]").dataset.u; SEL.k = SEL.k === k ? null : k; SEL.g = null; LIM = 60; tudo(); return; }
  if (c(".g[data-g]")) { const g = c(".g[data-g]").dataset.g, era = SEL.g === g && !SEL.k; SEL.k = null; SEL.g = era ? null : g; era ? FECH.add(g) : FECH.delete(g); LIM = 60; tudo(); return; }
});
q("#q").addEventListener("input", e => { BUSCA = e.target.value; lado(); });
// abre mostrando a usina com curva real, com a pior ocorrência já aberta
(() => { const k = D.lidas[0]; if (!k) return; SEL.k = k; const o = D.s.filter(z => z.k === k && !z.fim && (D.curvas[k] || {})[z.inv]).sort((a, b) => b.perda - a.perda)[0]; if (o) ABERTAS.add(idS(o)); })();
tudo();
</script>
</body>
