<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Co. — Monitoramento O&amp;M (novo design)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/static/notif.js" defer></script>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* ═══ BASE "Nocturne" reconstruída (o _ds_bundle/styles.css do designer não veio nos anexos) ═══
   tokens + componentes mapeados p/ a identidade Grid Co. (navy + verde), conforme o README do handoff. */
:root{
  --color-bg:#090d18; --color-surface:#161d30;
  --color-neutral-900:#0e1626; --color-neutral-500:#767d92; --color-neutral-400:#96a0b4;
  --color-neutral-300:#c3cad7; --color-neutral-200:#e2e7f0; --color-text:#e9eef6;
  --color-divider:rgba(255,255,255,.09);
  --font-heading:'Inter',system-ui,-apple-system,sans-serif; --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --radius-sm:6px; --radius-md:10px;
  /* marca (o inline abaixo recalibra a rampa 100–900 do accent) */
  --color-accent:#a3d900;
  --color-accent-100:#eef8c9; --color-accent-200:#ddf094; --color-accent-300:#c4e755;
  --color-accent-400:#b0e024; --color-accent-500:#a3d900; --color-accent-600:#8bbf00;
  --color-accent-700:#6c9400; --color-accent-800:#495f06; --color-accent-900:#2b3707;
  --gc-blue:#5b9dff; --gc-red:#f2555a; --gc-amber:#f5a623; --gc-violet:#a78bfa;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
/* hover da linha de usina (Strings) = mesmo teal do clique (selecionada), só mais suave; a linha
   expandida tem background inline (mais forte) e continua vencendo o hover */
tr.gc-urow{transition:background .12s ease}
tr.gc-urow:hover{background:linear-gradient(90deg, color-mix(in srgb, #0a4f52 45%, transparent), color-mix(in srgb, #0a4f52 18%, transparent) 34%, transparent 58%)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(140,150,170,.3);border-radius:99px}
.text-muted{color:var(--color-neutral-400)}
h2{font-family:var(--font-heading);font-weight:800;letter-spacing:-.01em}
.card{background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.elev-sm{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--color-neutral-500)}
.nav{display:flex;align-items:center;gap:2px}
.nav-brand{font-family:var(--font-heading);font-weight:800;color:var(--color-text)}
.nav a{color:var(--color-neutral-400);text-decoration:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500;transition:color .15s,background .15s}
.nav a:hover{color:var(--color-text)}
.nav a[aria-current="page"]{color:var(--color-text);background:color-mix(in srgb,var(--color-accent) 13%,transparent)}
/* Gêmeo Digital: a entrada só aparece quando o proxy /gemeo responde (fetch no fim do arquivo) */
html:not(.gemeo-on) #nav-gemeo{display:none}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-md);font-family:var(--font-heading);font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--color-text);transition:background .15s,border-color .15s;white-space:nowrap}
.btn i{font-size:15px}
.btn-primary{border-color:var(--color-accent);color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 14%,transparent)}
.btn-secondary{border-color:var(--color-divider);color:var(--color-neutral-300)}
.btn-secondary:hover{border-color:color-mix(in srgb,var(--color-text) 30%,transparent)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600}
.tag-neutral{background:var(--color-neutral-900);color:var(--color-neutral-300)}
.tag-outline{border:1px solid var(--color-divider);background:transparent}
.input{width:100%;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:9px 12px;color:var(--color-text);font:inherit;font-size:13px;outline:none}
.input:focus{border-color:var(--color-accent)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table thead th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--color-neutral-500);padding:12px 14px;border-bottom:1px solid var(--color-divider);white-space:nowrap}
.table tbody td{padding:13px 14px;border-bottom:1px solid var(--color-divider)}
.table tbody tr:last-child td{border-bottom:0}
/* prototype inline (hovers + pulse) */
@keyframes gc-pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Usina com déficit que NÃO bate com o acompanhamento: degradê vermelho varrendo da esquerda + faixa
   lateral pulsando. Só nas linhas fechadas (expandida já tem o degradê teal) e some com reduced-motion. */
@keyframes gc-alerta{0%,100%{background-position:0% 50%;box-shadow:inset 3px 0 0 var(--gc-red)}
                     50%{background-position:100% 50%;box-shadow:inset 3px 0 0 #ff9a9d}}
tr.gc-alerta{background:linear-gradient(90deg, color-mix(in srgb, var(--gc-red) 30%, transparent),
             color-mix(in srgb, var(--gc-red) 10%, transparent) 40%, transparent 68%);
             background-size:220% 100%;animation:gc-alerta 2.4s ease-in-out infinite}
tr.gc-alerta:hover{background:linear-gradient(90deg, color-mix(in srgb, var(--gc-red) 38%, transparent),
             color-mix(in srgb, var(--gc-red) 14%, transparent) 40%, transparent 68%)}
@media (prefers-reduced-motion: reduce){tr.gc-alerta{animation:none;box-shadow:inset 3px 0 0 var(--gc-red)}}
/* ETM — UMA hierarquia de cor (Levi, 10/09/2026: "essa hierarquia de cores com as cores laterais e cores de
   sombra está confusa, deixe no padrão"). O estado do card mora em DOIS lugares que dizem a MESMA coisa: a borda
   esquerda e o ponto do veredito. Vermelho = IPOA/GHI medido em zero (hoje ou no mês); âmbar = atenção; violeta =
   sem comunicação; verde = ok; cinza = sem dados. Sumiram o anel vermelho do "problema no mês" (08/09), o brilho
   laranja da OS (26/08) e a borda de severidade pintada por outra régua — a OS aberta é um chip laranja no rodapé.
   O pulso (P1 de 26/08) ficou só para ALARME SEM OS, e só em vermelho. */
/* 4 estações por linha (Levi, 11/09: "muita informação para pouco espaço"): o card ganha largura para o gráfico e
   os três blocos de sensor. Em tela estreita cai para 2, nunca para 1 coluna gigante. */
.gc-etm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.gc-etm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gc-etm{border-left:3px solid var(--color-neutral-500)}
.gc-etm-al{border-left-color:var(--gc-red)}.gc-etm-at{border-left-color:var(--gc-amber)}.gc-etm-cm{border-left-color:var(--gc-violet)}
.gc-etm-ok{border-left-color:var(--color-accent)}.gc-etm-sd{border-left-color:var(--color-neutral-500);opacity:.85}
.gc-etm-vd{display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.25;margin-top:7px;min-width:0}
.gc-etm-vd i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--color-neutral-500)}
.gc-etm-vd b{font-weight:700;white-space:nowrap}.gc-etm-vd span{color:var(--color-neutral-400);font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-etm-al .gc-etm-vd{color:#ff9a9d}.gc-etm-al .gc-etm-vd i{background:var(--gc-red);box-shadow:0 0 8px var(--gc-red)}
.gc-etm-at .gc-etm-vd{color:#f5c877}.gc-etm-at .gc-etm-vd i{background:var(--gc-amber)}
.gc-etm-cm .gc-etm-vd{color:#c9b6ff}.gc-etm-cm .gc-etm-vd i{background:var(--gc-violet)}
.gc-etm-ok .gc-etm-vd{color:var(--color-accent-300)}.gc-etm-ok .gc-etm-vd i{background:var(--color-accent)}
.gc-etm-sd .gc-etm-vd{color:var(--color-neutral-400)}
/* três blocos de sensor: POA · GHI · POA-RI com pico do dia e um ponto — vermelho só quando MEDIU zero;
   azul = POA-RI (aviso); cinza = sem leitura (sensor que a estação não tem) */
.gc-etm-sens{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}
.gc-etm-sn{background:var(--color-neutral-900);border-radius:8px;padding:5px 8px;min-width:0}
.gc-etm-sn .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-500);font-weight:700;display:flex;align-items:center;gap:5px}
.gc-etm-sn .k i{width:7px;height:7px;border-radius:50%;background:var(--color-neutral-500);flex:none;opacity:.6}
.gc-etm-sn .k i.g{background:var(--color-accent);opacity:1}.gc-etm-sn .k i.r{background:var(--gc-red);box-shadow:0 0 6px var(--gc-red);opacity:1}.gc-etm-sn .k i.b{background:var(--gc-blue);opacity:1}
.gc-etm-sn .n{font-family:'IBM Plex Mono',Consolas,monospace;font-size:12.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-etm-sn .n small{font-family:inherit;font-size:9.5px;color:var(--color-neutral-500);font-weight:500;margin-left:3px}
.gc-etm-sn.r .n{color:#ff9a9d}.gc-etm-sn.b .n{color:#7fb8ff}.gc-etm-sn.x .n{color:var(--color-neutral-500)}
.gc-etm-mes{font-size:10.5px;color:var(--color-neutral-400);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-etm-mes .r{color:#ff9a9d;font-weight:700}.gc-etm-mes .a{color:#f5c877;font-weight:600}.gc-etm-mes .g{color:var(--color-accent-300)}
@keyframes gc-etm-resp{0%,100%{box-shadow:0 0 0 0 rgba(242,85,90,0)}50%{box-shadow:0 0 18px 2px rgba(242,85,90,.45)}}
.gc-etm-al.gc-etm-pulse{animation:gc-etm-resp 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.gc-etm-al.gc-etm-pulse{animation:none;box-shadow:0 0 12px 0 rgba(242,85,90,.35)}}
@keyframes gc-spin{to{transform:rotate(360deg)}}
.gc-spin{display:inline-block;color:var(--color-accent);animation:gc-spin .8s linear infinite}
.gc-numin::-webkit-outer-spin-button,.gc-numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gc-numin{-moz-appearance:textfield;appearance:textfield}
.gc-src:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)!important}
.gc-chip:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)!important}
.gc-lock{transition:color .12s,transform .12s}.gc-lock:hover{color:var(--color-accent)!important;transform:scale(1.3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ═══ Componente portado do protótipo DC (nocturne) p/ JS puro — mesma lógica/dados/SVG ═══ */
// ?embed=1: a tela do cliente da Entrada (/tempo-real/<fonte>) embute este Monitoramento com a fonte travada e sem
// cabecalho/hero/barra de fontes — as tabelas continuam as mesmas. A altura vai ao pai por postMessage (sem rolagem dupla).
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
function _embedAltura(){ try{ parent.postMessage({gc:'altura',h:document.documentElement.scrollHeight},'*'); }catch(e){} }
if(EMBED){ document.documentElement.classList.add('embed'); new ResizeObserver(function(){ _embedAltura(); }).observe(document.documentElement);
  window.addEventListener('message',function(ev){ var d=ev.data||{}; if(d.gc==='view'&&_VIEWS_URL.includes(d.id)&&window.setView){ if(d.id==='etm') state.etmProb=!!d.prob; setView(d.id); } }); }
// Overlays (os modais e a barra do Criar OS) são position:fixed — e dentro do iframe da Entrada "fixo" é a caixa
// INTEIRA do iframe, que cresce com o conteúdo (_embedAltura, sem rolagem própria). O card do "Atribuir OS" ficava a
// 60 px do topo do iframe, metros acima de quem rolou até o inversor: sobrava só o blur; a barra do Criar OS ficava
// no pé do iframe, abaixo da dobra — "não aparece a opção" (Levi, 08/09/2026). Mesma origem → o iframe enxerga que
// fatia dele está na janela do pai (frameElement) e prende cada overlay nela; fora do embed não muda nada.
function _faixaVisivel(){ if(!EMBED) return null;
  try{ const fe=window.frameElement; if(!fe) return null; const r=fe.getBoundingClientRect(), ph=parent.innerHeight;
    const vt=Math.max(0,-r.top), vb=Math.min(r.height, ph-r.top);
    return (vb-vt>120)?{top:vt,h:vb-vt}:{top:vt,h:Math.min(ph,r.height)}; }catch(e){ return null; } }
function _prendeOverlays(){ const v=_faixaVisivel(); if(!v) return;
  document.querySelectorAll('.gc-overlay').forEach(o=>{ o.style.top=v.top+'px'; o.style.height=v.h+'px'; o.style.bottom='auto'; });
  const bar=document.getElementById('gc-osbar'); if(bar&&bar.style.display!=='none'){ bar.style.bottom='auto'; bar.style.top=(v.top+v.h-bar.offsetHeight)+'px'; } }
if(EMBED){ try{ parent.addEventListener('scroll',_prendeOverlays,{passive:true}); parent.addEventListener('resize',_prendeOverlays); }catch(e){} }
// ?fonte=<id> vem dos cards da Entrada (/teste/tempo-real): o card de um cliente abre o Monitoramento ja na fonte dele (05/09/2026)
const _VIEWS_URL=['strings','etm','geracao','trackers','pr','curva','perdas'];
const state = { source:(new URLSearchParams(location.search).get('fonte')||'thopen-pv'), view:(_VIEWS_URL.includes(new URLSearchParams(location.search).get('view'))?new URLSearchParams(location.search).get('view'):'strings'), subfilter:'geral', invView:'strings', invGer:{modo:'mes',ini:null,fim:null}, trkSub:'live', evDia:null, curvaPid:null, curvaData:null, invData:null, perdaSub:'trk-par', perdaDia:null, expandedUsina:(new URLSearchParams(location.search).get('usina')||null), expandedInversor:null, expandedTrk:null, trkGraf:null, trkGrafIni:null, trkGrafFim:null, trkGrafRed:true, curvaRed:false, trkGrafFiltro:'todos', trkGrafExp:false, trkHide:{}, osMode:false, etmMode:'cards', etmProb:(new URLSearchParams(location.search).get('etmprob')==='1'), gerIni:null, gerFim:null, gerModo:'usinas' };
function setState(patch){ Object.assign(state, patch); render(); }
/* ═══ DADO REAL — por VISTA e por FONTE. Cada uma devolve {rows,summary}; muda só o endpoint. ═══ */
// 2C tudo junto (11/09/2026): linha da 2C com id NUMÉRICO veio da API PV (conta oem@) → curva e ETM pelo caminho da API PV
function _ehApiPv(sk,pid){ return sk==='pv'||sk==='semp'||sk==='alveslima'||sk==='2capi'||(sk==='owen'&&/^\d+$/.test(String(pid))); }
const SKEY={'thopen-pv':'pv','thopen-db':'pg','athon':'sunop','axis':'axis','renogrid':'solaredge','2c':'owen','semp':'semp','alveslima':'alveslima','2capi':'2capi'};
const VKEY={'thopen-pv':'pv','thopen-db':'pg','athon':'so','axis':'ax','renogrid':'se','2c':'owen','semp':'semp','alveslima':'al','2capi':'c2'};  // prefixo da chave de comentário (igual ao dashboard original)
const EP={
  strings:{pv:'/api/data',pg:'/api/pg/data',sunop:'/api/sunop/data',axis:'/api/axis/data',solaredge:'/api/solaredge/data',owen:'/api/owen/strings/data',semp:'/api/semp/data',alveslima:'/api/alveslima/data','2capi':'/api/2capi/data'},
  etm:{pv:'/api/etm/analise',pg:'/api/pg/etm/analise',sunop:'/api/sunop/etm/analise',axis:'/api/axis/etm/analise',owen:'/api/owen/etm/analise',semp:'/api/semp/etm/analise',alveslima:'/api/alveslima/etm/analise','2capi':'/api/2capi/etm/analise'},
  trackers:{pv:'/api/pv/trackers',pg:'/api/pg/trackers',sunop:'/api/sunop/trackers',axis:'/api/axis/trackers',owen:'/api/owen/trackers',semp:'/api/semp/trackers','2capi':'/api/2capi/trackers'},   // semp desde 15/09/2026: a PV Plataforma parou de negar a conta OEM (Tucano 1 e 2, 40 trackers cada). 2capi desde 16/09 a pedido do Levi (ARA 59, STL 59, TUP 100, leitura do minuto — o e-mail chega horas depois); alveslima fica fora: a Morada Nova não tem seguidor
  pr:{pv:'/api/pv/pr',pg:'/api/pg/pr',sunop:'/api/sunop/pr',axis:'/api/axis/pr',solaredge:'/api/solaredge/pr'},
};
// SEMP usa o MESMO /api/plant/<id> do Thopen-PV: o id da usina é global na API PV e o backend
// escolhe sozinho o token da conta que a enxerga (_pv_token_for). Só o recorte da LISTA muda.
const PLANT={pv:'/api/plant/',pg:'/api/pg/plant/',sunop:'/api/sunop/plant/',axis:'/api/axis/plant/',solaredge:'/api/solaredge/plant/',owen:'/api/owen/strings/plant/',semp:'/api/plant/',alveslima:'/api/plant/','2capi':'/api/plant/'};
function _urlFor(view,srcChip){ const base=(EP[view]||{})[SKEY[srcChip]]; if(!base) return null; return view==='pr'?base+'?date='+_todayISO():base; }   // data LOCAL: com toISOString(), das 21h em diante o BR pedia o dia SEGUINTE e a tabela voltava vazia
const RD={pv:null,loading:false,na:false,erro:null,cache:{},plants:{},curva:{},curvaMeta:{},trk:{},depara:{},trkChart:{},os:{},comments:{},tracking:{},strProb:{},strEv:{},trkPar:{},trkEv:{},curvaView:{},gerPivo:{},invHist:{},perdas:{},osAtrib:{},_osList:null};

/* ══ BUSCA COM ESPERA LIMITADA ══════════════════════════════════════════════
   01/09/2026: o Levi abriu as strings da Santana do Ipanema e a tela girou até ele desistir. A
   usina estava ótima (239 de 240 strings, 24 inversores ligados) — fora estava a API PV, cujo
   host aceitava a conexão TCP em 61ms e depois não respondia mais nada.

   Faltar `catch` não era o problema: erro de rede o catch pega; resposta que NUNCA CHEGA, não.
   Os 33 `fetch` deste arquivo não tinham limite nenhum, então `RD.loading` ficava `true` para
   sempre e o spinner com ele. Todo fetch de dado passa por aqui agora.                        */
const FETCH_TMO_MS   = 90000;  // 90s. NÃO baixar: a curva histórica de strings mediu 41,5s
                               // LEGÍTIMOS na Tucano (01/09) — cortar em 45s mataria busca boa.
const FETCH_LENTO_MS = 10000;  // aos 10s a tela avisa que está demorando, em vez de ficar muda

async function fetchJSON(url, opts){
  const o=opts||{}, onLento=o.onLento, tmoMs=o.timeout||FETCH_TMO_MS;
  const init=Object.assign({},o); delete init.onLento; delete init.timeout;
  const ctrl=new AbortController();
  // O aviso de "está demorando" é amarrado ao limite, nunca fixo: com um `timeout` menor que
  // FETCH_LENTO_MS o aviso seria agendado DEPOIS do abort e não apareceria nunca — falha muda,
  // do mesmo tipo que este helper existe para eliminar. Um teste trava isso.
  const lentoMs=Math.min(FETCH_LENTO_MS, Math.floor(tmoMs*0.3));
  const tLento=onLento?setTimeout(function(){ try{onLento();}catch(e){} },lentoMs):null;
  const tmo=setTimeout(function(){ ctrl.abort(); },tmoMs);
  try{
    const r=await fetch(url,Object.assign({},init,{signal:ctrl.signal}));
    return await r.json();
  }catch(e){
    // `fonteFora` separa "ninguém respondeu" de "respondeu vazio". Sem a marca a tela diz
    // "sem dado" e manda investigar a USINA quando o problema é a FONTE.
    const err=new Error(e&&e.name==='AbortError'
      ? 'a fonte não respondeu em '+Math.round(tmoMs/1000)+'s'
      : 'não consegui falar com a fonte');
    err.fonteFora=true; err.motivo=(e&&e.name==='AbortError')?'demorou':'rede';
    throw err;
  }finally{ clearTimeout(tmo); if(tLento) clearTimeout(tLento); }
}

function fonteForaHTML(e,oQue){
  const det=(e&&e.message)?e.message:'a fonte não respondeu';
  return '<div class="card" style="padding:22px;border-left:3px solid var(--color-warning,#f59e0b)">'
       + '<div style="font-weight:600;margin-bottom:6px">Não foi possível carregar '+(oQue||'os dados')+'</div>'
       + '<div class="text-muted" style="font-size:13px">'+det+'. A fonte externa não respondeu — '
       + 'o dado da usina pode estar normal.<br>Tente <b>Atualizar</b> em alguns minutos.</div></div>';
}
function _snum(s){ const d=String(s==null?'':s).replace(/\D/g,''); return d?parseInt(d,10):null; }   // nº da string ("ST 01"→1, "Ipv1"→1, "I_PV9"→9) — casa chips(/plant) × curva(/spv), nomenclaturas diferentes
function _abaixoMeta(iv){   // conjunto (por NÚMERO) de strings "abaixo": .sub (subperformance por ENERGIA do dia, backend SPV) + último valor da curva < 60% da mediana das ativas (igual _spvAbaixoSet do original)
  const abaixo=new Set();
  if(!iv) return {abaixo:abaixo, mediana:null};
  (iv.strings||[]).forEach(function(st){ if(st.sub){ const n=_snum(st.nome); if(n!=null)abaixo.add(n); } });
  const aBy={}; (iv.strings||[]).forEach(function(st){ aBy[String(st.nome)]=st.ativa!==false; });

async function loadCurrent(force){

      {onLento:()=>{ if(state.view===view&&state.source===src){ RD.lento=true; render(); } }});

async function _pollFresco(url,key,view,src){
  for(let n=0;n<10;n++){
    await new Promise(r=>setTimeout(r,8000));
    if(state.view!==view||state.source!==src) return;
    let f; try{ f=await fetchJSON(url); }catch(e){ return; }
    if(state.view!==view||state.source!==src) return;
    if(f&&!f.stale&&!f.carregando){ RD.cache[key]=f; RD.pv=f; render(); if(view==='strings'&&f.rows) loadMeta(f); return; }
  }
}

  const DI=o.xmin!=null?o.xmin:360, DF=o.xmax!=null?o.xmax:1080, DW=Math.max(1,DF-DI);

    if(i>0) sec+=`<line x1="${xL.toFixed(1)}" y1="${yT}" x2="${xL.toFixed(1)}" y2="${(yB+4).toFixed(1)}" stroke="var(--color-divider)"></line>`;
    sec+=`<text x="${((xL+xR)/2).toFixed(1)}" y="15" text-anchor="middle" fill="#9aa4b8" font-size="11" font-weight="600">${_he(d.date||('Dia '+(i+1)))}</text>`;
    hrs.forEach(h=>{ sec+=`<text x="${X(i,h*60).toFixed(1)}" y="${(yB+16).toFixed(1)}" text-anchor="middle" fill="#75798c" font-size="10">${(h<10?'0'+h:h)}h</text>`; });
    // Ponto FORA da janela [DI,DF] não é desenhado. Sem este corte, a madrugada do dia N caía

    // era o "bugada no visual" da visão reduzida 06–18h (Levi, 28/07). O _gchart de 1 dia clampa;
    // aqui clamp empilharia tudo na borda da seção vizinha, então o ponto some mesmo.
    (d.series||[]).forEach(s=>{ const pts=(s.y||[]).map((v,k)=>{ const m=(s.xm||[])[k];
        return (v==null||isNaN(v)||m<DI-0.001||m>DF+0.001)?null:X(i,m).toFixed(1)+','+Y(v).toFixed(1); }).filter(Boolean).join(' ');
      if(pts) sec+=`<polyline data-name="${s.name!=null?esc(String(s.name)):''}" points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.width||1.4}" stroke-opacity="${s.opacity!=null?s.opacity:1}"${s.dash?` stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"></polyline>`; });
  });
  const yl=o.yLabel?`<text x="13" y="${((yT+yB)/2).toFixed(0)}" transform="rotate(-90 13 ${((yT+yB)/2).toFixed(0)})" text-anchor="middle" fill="#75798c" font-size="11">${o.yLabel}</text>`:'';
  // dataset + handlers = o cursor do multi-dia (_chartTipDias); as datas viajam no atributo
  const _dts=(days||[]).map(d=>String(d.date||'').replace(/\|/g,'/')).join('|');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block" data-x0="${x0}" data-x1="${x1}" data-yt="${yT}" data-yb="${yB}" data-di="${DI}" data-df="${DF}" data-n="${N}" data-dates="${esc(_dts)}" data-ymin="${ymin}" data-ymax="${ymax}" data-unit="${o.unit||''}" onmousemove="_chartTipDias(event,this)" onmouseleave="_chartTipHide(this)"><line x1="${x0}" y1="${yT}" x2="${x0}" y2="${yB}" stroke="var(--color-divider)"></line><line x1="${x0}" y1="${yB}" x2="${x1}" y2="${yB}" stroke="var(--color-divider)"></line>${grid}${sec}${yl}<text x="${((x0+x1)/2).toFixed(0)}" y="${H-4}" text-anchor="middle" fill="#75798c" font-size="11">Hora</text></svg>`;

// API PV separa a mesma usina em skids numerados (Altair 1..5, Indaiatuba 1..4). P/ ETM (mesma estação
// meteo) isso duplica: colapsa grupos com 2+ no PRIMEIRO, exibindo o nome-base ("Altair"). Singleton fica
// como está (não renomeia "Colorado 2" se não houver "Colorado 1"). Tira o " (id)" e o " N" final.
function _dedupSkid(rows){
  // Colapsa os skids/seções da MESMA usina num card só — a ETM é a mesma estação (Levi 26-27/08).
  // A régua é o CADASTRO (aba Equipamentos, via /api/etm/grupos): 'Ceilandia 1.1/1.2/1.3 (89..91)'
  // → 'Ceilândia 1', 'Céu Azul I/II/III' → 'Céu Azul', 'Ceilandia II - Atena/…' → 'Ceilândia 2'.
  // Heurística de nome fica só de FALLBACK p/ usina fora do cadastro. Só colapsa quando a base
  // repete 2+ vezes. `usinaQ` preserva o nome ORIGINAL do 1º card — OS/histórico/deep link casam
  // por ele no Fracttal; a base é o rótulo.
  const G=RD.etmGrupos||{};
  const nrm=u=>String(u||'').toLowerCase().replace(/\s+/g,' ').trim();
  const heur=u=>String(u||'').replace(/\s*\(\d+\)\s*$/,'').replace(/\s+-\s+.+$/,'').replace(/\s+\d+$/,'').trim();
  const base=u=>G[nrm(u)]||G[nrm(String(u||'').replace(/\s*\(\d+\)\s*$/,''))]||heur(u);
  const cnt={}; (rows||[]).forEach(r=>{const b=base(r.usina);cnt[b]=(cnt[b]||0)+1;});
  const seen={}, out=[];
  (rows||[]).forEach(r=>{ const b=base(r.usina);
    if(cnt[b]>=2){ if(seen[b])return; seen[b]=1; out.push({...r,usina:b,usinaQ:r.usina}); }   // colapsa no 1º
    else out.push(r); });
  return out;
}

async function seOpt(pid,invId,uuid){
  const key=pid+'|'+invId+'|'+uuid;
  if(state.expandedOpt===key){ state.expandedOpt=null; render(); return; }   // toggle fecha
  state.expandedOpt=key;
  RD.opts=RD.opts||{};
  if(RD.opts[uuid]===undefined){
    RD.opts[uuid]='loading'; render();
    try{ RD.opts[uuid]=await fetchJSON('/api/solaredge/plant/'+pid+'/optimizers/'+encodeURIComponent(uuid)); }
    catch(e){ RD.opts[uuid]={optimizers:[],erro:1}; }
  }

}

const GER_MAX_DIAS=62;

function _gerPeriodo(){   // {ini,fim} ISO, sempre até ONTEM: hoje ainda não fechou
  const g=state.invGer||{}, ontem=_ontemISO();
  if(g.modo==='ontem') return {ini:ontem,fim:ontem};
  if(g.modo==='7d') return {ini:_isoAdd(ontem,-6),fim:ontem};
  if(g.modo==='custom'&&g.ini&&g.fim){ let ini=g.ini, fim=g.fim>ontem?ontem:g.fim; if(ini>fim) ini=fim; if(_isoDiff(ini,fim)>GER_MAX_DIAS-1) ini=_isoAdd(fim,-(GER_MAX_DIAS-1)); return {ini,fim}; }
  return {ini:ontem.slice(0,7)+'-01',fim:ontem};   // 'mes': do dia 1 do mês de ontem até ontem (dia 1 → o mês passado inteiro)
}
function _gerMeses(p){ const out=[]; let m=p.ini.slice(0,7); while(m<=p.fim.slice(0,7)&&out.length<4){ out.push(m); const y=+m.slice(0,4), mm=+m.slice(5,7); m=mm===12?(y+1)+'-01':y+'-'+String(mm+1).padStart(2,'0'); } return out; }

function _gerAgrega(hists,invs,ini,fim){
  // hists: payloads de /inversores/historico dos meses do período; invs: [{name,cabine,padrao}] da lista ao vivo (casa por
  // nome; se NENHUM casar, valem os nomes da base). Só dias dentro de [ini,fim]; dia sem dado do inversor não conta como zero.
  const porInv={}, pot={}, dias=new Set(), origens=new Set(); let potOk=false;
  for(const h of hists){ if(!h) continue; if(h.rateio==='potencia') potOk=true;
    for(const [n,v] of Object.entries(h.inversores||{})) if(v&&v.pot_kwp) pot[n]=v.pot_kwp;
    for(const d of (h.dias||[])){ if(!d||d.data<ini||d.data>fim) continue; dias.add(d.data); if(d.origem) origens.add(d.origem);
      for(const [n,v] of Object.entries(d.inv||{})){ const g=v?v.ger:null; if(g==null) continue; const t=porInv[n]||(porInv[n]={kwh:0,n:0}); t.kwh+=g; t.n++; } } }
  const nomesBase=Object.keys(porInv);
  const casa=n=>nomesBase.find(b=>_nrmU(b)===_nrmU(n))||null;
  let linhas=(invs||[]).map(iv=>({name:iv.name,cabine:iv.cabine||'',padrao:iv.padrao||null,base:casa(iv.name)}));
  if(!linhas.some(l=>l.base)) linhas=nomesBase.slice().sort((a,b)=>String(a).localeCompare(b,'pt-BR',{numeric:true})).map(n=>({name:n,cabine:'',padrao:null,base:n}));
  const comBase=linhas.filter(l=>l.base);
  const usaPot=potOk&&comBase.length>0&&comBase.every(l=>pot[l.base]>0);
  const med=arr=>{ const s=arr.slice().sort((a,b)=>a-b), n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null; };

// Coluna "Tickets" da tabela: parados com ticket aberto ÷ parados. Verde = todos cobertos; vermelho = há parado sem

function _tkCel(r){
  const par=Number(r.parados)||0;
  if(!par) return '<span style="color:var(--color-neutral-500)">—</span>';
  if(r.tkCom==null) return '<span style="color:var(--color-neutral-500)" title="fonte sem cruzamento com a planilha">—</span>';
  const com=r.tkCom, sem=(r.tkSem!=null?r.tkSem:Math.max(0,par-com)), pct=Math.max(0,Math.min(100,Math.round(com/par*100)));
  const cor=sem>0?'#ff5b6e':'#3fb950';
  return `<span title="${com} de ${par} parados com ticket aberto${sem?` · ${sem} sem ticket`:''}${r.tkUsina?' · há ticket da usina inteira':''}" style="display:inline-flex;align-items:center;gap:7px;justify-content:center"><span style="width:44px;height:6px;border-radius:3px;background:var(--color-neutral-800);overflow:hidden;display:inline-block"><span style="display:block;height:100%;width:${pct}%;background:${cor}"></span></span><span style="font-weight:600;color:${cor}">${com}/${par}</span>${r.tkUsina?'<i class="ph ph-clipboard-text" title="ticket da usina inteira" style="font-size:11px;color:var(--gc-blue)"></i>':''}</span>`;
}
function _trkChip(t,dp){

  // "normal" da usina, sem leitura nenhuma, chip verde e nenhuma curva verde no gráfico para
  // sustentar. Mudo não é normal: vira roxo, a mesma cor que a usina usa no status.
  const st=(t.sem_comunicacao?'sem_comunicacao':(t.status||'normal')), c=_trkCor(st);

  // Ticket (planilha de Tickets, só ocorrência ABERTA): parado com ticket = "ticket"; parado sem = "sem ticket" em

  const _tkTxt=t.na_planilha?`ticket ${t.ticket_status||''}${t.ticket_desde?' desde '+t.ticket_desde:''}`:(t.ticket_usina?'coberto por ticket da usina inteira':(t.status==='parado'?'parado SEM ticket na planilha':''));

  const _tag=(txt,cor,ic)=>`<span style="display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:700;letter-spacing:.02em;background:color-mix(in srgb, ${cor} 18%, transparent);border:1px solid color-mix(in srgb, ${cor} 45%, transparent);color:${cor}">${ic?`<i class="ph ${ic}" style="font-size:10px"></i>`:''}${txt}</span>`;
  const tk=t.normalizado?_tag('voltou','#3fb950','ph-check'):t.na_planilha?_tag('ticket','var(--gc-blue)','ph-clipboard-text'):(t.ticket_usina&&t.status==='parado')?_tag('ticket da usina','var(--gc-blue)','ph-clipboard-text'):(t.status==='parado')?_tag('sem ticket','#ff5b6e','ph-warning'):'';

  const frIc=(fr&&fr.code)?`<i class="ph ${fr.situacao==='sem_par'?'ph-link-break':'ph-link'}" title="Fracttal ${esc(fr.code)}${fr.situacao==='a_confirmar'?' (a confirmar)':fr.situacao==='sem_par'?' (sem par)':''}" style="font-size:12px;color:${fr.situacao==='casado'?'var(--color-neutral-400)':fr.situacao==='a_confirmar'?'var(--gc-amber)':'var(--gc-red)'}"></i>`:'';
  return `<span title="${esc(tip)}" onclick="event.stopPropagation();toggleTrkHide(${n})" onmouseenter="_hlTrk(${n},1)" onmouseleave="_hlTrk(${n},0)" style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-sm);background:${c[1]};border:1px solid ${c[2]};font-size:11.5px;cursor:pointer;transition:opacity .12s,border-color .12s;opacity:${hid?'.38':'1'}"><span style="font-weight:600;color:${c[0]}">${esc(t.id)}</span><span class="text-muted" style="font-size:11px">${disp}</span>${frIc}${tk}</span>`;
}
function _trkCor(st){   // semáforo por HUE distinto → contraste máximo entre os níveis (vermelho→laranja→amarelo→verde)
  if(st==='parado') return ['#ff5b6e','color-mix(in srgb, #ff5b6e 16%, transparent)','color-mix(in srgb, #ff5b6e 48%, transparent)'];

  const body=list.map(iv=>{ const smap={}; Object.keys(iv.curva).forEach(nm=>{ if(iv.meta&&iv.meta.abaixo&&iv.meta.abaixo.has(_snum(nm))) smap[nm]='abaixo'; });

  }).join('');
  return header+`<div class="text-muted" style="font-size:12.5px;margin-bottom:10px">${list.length} inversores · ${_he((rows.find(r=>String(r.plant_id)===state.curvaPid)||{}).usina||'')}</div>`+body;
}

/* ══ Bloco B — subabas de Strings (sem corrente / ocorrências) e Trackers (parados / ocorrências) ══ */

async function loadTrkEventos(force){ const f=_fonte(), rg=_evR(), k=f+'|'+rg.ini+'|'+rg.fim; if(!force&&RD.trkEv[k]!==undefined)return; RD.trkEv[k]=null; render();

const EV_MAX_DIAS=7;   // teto do intervalo De/Até das ocorrências
function _isoAdd(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function _ontemISO(){ return _isoAdd(_todayISO(), -1); }   // base de perdas = D-1 (dia FECHADO; gráficos seguem ao vivo)

function _isoDiff(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function _evReload(){ if(state.view==='strings'&&state.subfilter==='ocor')loadStrEventos(); if(state.view==='trackers'&&state.trkSub!=='live')loadTrkEventos(); }
window.setEvIni=v=>{ state.evIni=v; if(!state.evFim||state.evFim<v)state.evFim=v; else if(_isoDiff(v,state.evFim)>EV_MAX_DIAS-1)state.evFim=_isoAdd(v,EV_MAX_DIAS-1); render(); _evReload(); };
window.setEvFim=v=>{ state.evFim=v; if(!state.evIni||v<state.evIni)state.evIni=v; else if(_isoDiff(state.evIni,v)>EV_MAX_DIAS-1)state.evIni=_isoAdd(v,-(EV_MAX_DIAS-1)); render(); _evReload(); };
window.setEvMonth=(ym)=>{ if(!ym)return; const t=_todayISO(), ini=ym+'-01'; if(ini>t)return;   // mês inteiro (só trackers; ignora a trava EV_MAX_DIAS)
  const p=ym.split('-'), last=new Date(+p[0],+p[1],0).getDate(); let fim=ym+'-'+String(last).padStart(2,'0'); if(fim>t)fim=t;
  state.evIni=ini; state.evFim=fim; render(); _evReload(); };

// ── Bloco C — vista "Curva das strings": escolhe usina → curva de corrente por string de cada inversor (reusa curvaSVG/_abaixoMeta; pv/pg/sunop/axis/owen num fetch só) ──

// ── Bloco D — vista "Geração": tabela pivô (usina/dia × inversor) dos últimos 7 dias + POA/GHI/pluviômetro + XLSX ──
function _gerKey(){ const f=_fonte(); return f+'|'+(state.gerIni||'auto')+'|'+(state.gerFim||'auto'); }
async function loadGeracao(force){ const f=_fonte(), k=_gerKey(); if(!force&&RD.gerPivo[k]!==undefined)return; RD.gerPivo[k]=null; render();
  const q=[]; if(force)q.push('force=1'); if(state.gerIni&&state.gerFim){ q.push('ini='+state.gerIni); q.push('fim='+state.gerFim); }
  try{ RD.gerPivo[k]=await fetchJSON('/api/'+f+'/geracao-pivo'+(q.length?'?'+q.join('&'):'')); }catch(e){ RD.gerPivo[k]={usinas:[],erro:1}; } render(); }
window.setGerIni=v=>{ if(!v)return; state.gerIni=v; if(!state.gerFim||state.gerFim<v)state.gerFim=v; render(); loadGeracao(); };
window.setGerFim=v=>{ if(!v)return; state.gerFim=v; if(!state.gerIni||state.gerIni>v)state.gerIni=v; render(); loadGeracao(); };
window.setGerModo=m=>{ state.gerModo=m; render(); };
function renderGeracao(){ const f=_fonte(), d=RD.gerPivo[_gerKey()];
  // De/Até: a janela viaja p/ a API (?ini&fim, teto de 31 dias no servidor) e p/ os EXPORTS —
  // o XLSX baixado tem de mostrar a mesma janela que a tela.
  const t=_todayISO(), css='background:var(--color-neutral-900);border:1px solid var(--color-divider);border-radius:6px;color:var(--color-text);font-family:inherit;font-size:12px;padding:4px 7px';
  const _ini=state.gerIni||(d&&d.start)||'', _fim=state.gerFim||(d&&d.end)||'';
  const dtIn=`<span class="text-muted" style="font-size:12.5px">De</span><input type="date" value="${_ini}" max="${t}" onchange="setGerIni(this.value)" style="${css}"><span class="text-muted" style="font-size:12.5px">até</span><input type="date" value="${_fim}" max="${t}" onchange="setGerFim(this.value)" style="${css}"><span class="text-muted" style="font-size:11.5px">até 31 dias</span>`;
  const _mb=(id,lb)=>`<button onclick="setGerModo('${id}')" style="padding:6px 12px;border:1px solid ${state.gerModo===id?'var(--color-accent)':'var(--color-divider)'};background:${state.gerModo===id?'color-mix(in srgb,var(--color-accent) 16%,transparent)':'transparent'};color:${state.gerModo===id?'var(--color-accent)':'var(--color-neutral-300)'};font-family:inherit;font-size:11.5px;font-weight:600;cursor:pointer;border-radius:7px">${lb}</button>`;
  const modos=`<span style="display:inline-flex;gap:5px">${_mb('usinas','Por usina')}${_mb('etm','ETM · POA/GHI')}</span>`;
  const _w=(state.gerIni&&state.gerFim)?('?ini='+state.gerIni+'&fim='+state.gerFim):'';
  const titulo=(d&&d.start&&d.end)?('Geração — '+_brdate(d.start)+' a '+_brdate(d.end)):'Geração — últimos 10 dias';
  const bar=_subBar(titulo,(d&&d.usinas&&!d.indisponivel)?`${d.usinas.length} usinas`:'', dtIn+modos+(f==='pg'?_expBtn('/api/pg/geracao-pivo/export-usinas'+_w,'Geração · aba por usina')+_expBtn('/api/pg/etm-pivo/export'+_w,'ETM · POA/GHI')+_expBtn('/api/pg/geracao-pivo/export'+_w,'Plana'):'')+_atualBtn('loadGeracao'));
  if(d===undefined||d===null) return bar+_subLoad('Calculando geração por inversor + POA/GHI…');
  if(d.indisponivel) return bar+_subMsg(d.msg||'Geração por inversor em construção nesta fonte.');
  if(d.error) return bar+_subMsg('Erro ao calcular a geração: '+_he(d.error));
  // o "Filtrar usina..." do topo também vale aqui — antes esta visão era a única que o ignorava
  const blocks=(d.usinas||[]).filter(b=>_matchQ(b.usina));
  if(!blocks.length) return bar+_subMsg(_q?`Nenhuma usina casa "${_he(_q)}".`:'Sem geração no período.');
  const fmt=x=>x==null?'—':Number(x).toLocaleString('pt-BR',{maximumFractionDigits:1});
  const cb='<span style="font-weight:400;font-size:10px" class="text-muted">';
  if(state.gerModo==='etm'){
    // ETM NA TELA (pivô usina × dia, POA e GHI) — antes essa visão só existia baixando o XLSX
    const dates=[...new Set(blocks.flatMap(b=>(b.dias||[]).map(x=>x.data)))].sort().reverse();
    const th=dates.map(dt=>`<th style="text-align:right;white-space:nowrap">${_he(_brdate(dt))}</th>`).join('');
    const rows=blocks.map(b=>{ const by={}; (b.dias||[]).forEach(x=>by[x.data]=x);

        return `<td style="text-align:right;white-space:nowrap;line-height:1.35">${(x&&x.poa!=null)?`<span style="color:var(--color-accent-200)">${fmt(x.poa)}</span>`:'<span class="text-muted">—</span>'}<br><span class="text-muted" style="font-size:10.5px">${(x&&x.ghi!=null)?fmt(x.ghi):'—'}</span></td>`; }).join('');

    return bar+`<div class="text-muted" style="font-size:12px;margin-bottom:12px">Irradiância diária por usina · <span style="color:var(--color-accent-200);font-weight:600">POA</span> em cima, <span class="text-muted">GHI</span> embaixo (kWh/m²)</div>`+
      `<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="table"><thead><tr><th style="padding-left:22px">Usina</th>${th}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

      // PR do dia: >130% é fisicamente impossível = POA suspeita (âmbar, com o porquê no hover)
      const _prTd=dd.pr==null?'<span class="text-muted">—</span>':(dd.pr>130?`<span style="color:var(--gc-amber)" title="PR anômalo — POA provavelmente subestimada neste dia">${fmt(dd.pr)}%</span>`:`<span style="color:var(--color-neutral-200);font-weight:600">${fmt(dd.pr)}%</span>`);
      return `<tr><td style="padding-left:22px;white-space:nowrap;font-weight:600">${_he(dd.data)}</td><td style="text-align:right;color:var(--color-accent-200)">${fmt(dd.poa)}</td><td style="text-align:right;color:var(--color-neutral-400)">${fmt(dd.ghi)}</td><td style="text-align:right;color:var(--gc-blue)">${dd.pluviometro==null?'—':fmt(dd.pluviometro)}</td>${tds}<td style="text-align:right;font-weight:700">${fmt(dd.ger_total)}</td><td style="text-align:right">${_prTd}</td></tr>`; }).join('');
    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px"><div style="padding:14px 20px;border-bottom:1px solid var(--color-divider)"><span style="font-family:var(--font-heading);font-size:15px">${_he(b.usina)}</span><span class="text-muted" style="font-size:12px;margin-left:8px">${cols.length} inversores</span></div><div style="overflow-x:auto"><table class="table"><thead><tr><th style="padding-left:22px">Data</th><th style="text-align:right">POA<br>${cb}kWh/m²</span></th><th style="text-align:right">GHI<br>${cb}kWh/m²</span></th><th style="text-align:right">Pluv.<br>${cb}mm</span></th>${th}<th style="text-align:right">Total<br>${cb}kWh</span></th><th style="text-align:right">PR<br>${cb}ger ÷ (pot × POA)</span></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  return bar+`<div class="text-muted" style="font-size:12px;margin-bottom:12px">Geração diária por inversor (kWh) · POA/GHI acumulados do dia (kWh/m²) · pluviômetro ainda não disponível no Banco de Dados</div>`+body;
}

function renderTrkProblemas(){ const f=_fonte(), rg=_evR();

  const eventos=((de&&de.rows)||[]).filter(r=>_matchQ(r.usina));
  // PARADOS = retrato de UM dia solar FECHADO (não a união do mês): "parado" é quem NÃO voltou até 18:00

      dur:(lv&&lv.horas_parado!=null)?(lv.horas_parado>=24?Math.floor(lv.horas_parado/24)+'d':Math.round(lv.horas_parado)+'h'):(r.dur_min!=null?_durTxt(r.dur_min):'—')});

  const flt=state.trkProbSt||'todos';
  const chip=(id,lb,n,col)=>`<button onclick="setTrkProbSt('${id}')" style="padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;font-family:inherit;border:1px solid ${flt===id?col:'var(--color-divider)'};background:${flt===id?'color-mix(in srgb, '+col+' 16%, transparent)':'transparent'};color:${flt===id?col:'var(--color-neutral-300)'};cursor:pointer">${lb} <b>${n}</b></button>`;

      ${EMBED?'':`<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px"><div><div class="card-kicker" style="margin-bottom:8px">Monitoramento O&amp;M</div><h2 style="margin:0;font-size:30px">Strings, ETM &amp; Trackers</h2></div><div class="text-muted" style="font-size:13px">${v.today}</div></div>`}
      ${EMBED?'':renderSources(v)}
      ${renderViewTabs(v)}
      ${(EMBED||v.showCurva||v.showGeracao||v.showPerdas)?'':renderKPIs(v)}
      ${panel}
    </div>
  </div>`;
}
// Gêmeo Digital (projeto separado, proxy /gemeo/* no app.py): a entrada do menu só aparece quando o
// serviço responde — 200 ou 503 (healthz com problema ainda é o gêmeo falando); 404 = plataforma sem
// o proxy (versão antiga no ar) e o menu fica como está.
fetch('/gemeo/healthz', {cache: 'no-store'}).then(function (r) {
  if (r.status === 200 || r.status === 503) document.documentElement.classList.add('gemeo-on');
}).catch(function () {});
render();
loadCurrent();
// ── Deep link do sino / da tela do cliente: ?usina=<pid>&inversor=<nome ou id>&dia=<YYYY-MM-DD> ─────────────────
// Abre a usina, acha o inversor pelo nome (ou pelo id, ou pelos numeros "2.7") e abre a curva de corrente por string
// do dia. `?usina=` sozinho tambem passa a carregar os inversores: antes a linha nascia expandida e ficava em
// "carregando" para sempre, porque so o clique (toggleUsina) chamava loadPlant. No embutido, pede ao pai para rolar.
(function(){
  const qs=new URLSearchParams(location.search), pid=qs.get('usina'), invQ=(qs.get('inversor')||'').trim(), dia=qs.get('dia')||'';
  if(!pid) return;
  const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
  const nums=s=>(String(s||'').match(/\d+(?:\.\d+)?/g)||[]).join('.');
  const acha=invs=>invs.find(x=>norm(x.nome)===norm(invQ))||invs.find(x=>String(x.id)===invQ)||invs.find(x=>nums(x.nome)&&nums(x.nome)===nums(invQ));
  const rolar=iid=>{ const el=document.querySelector('[data-inv="'+iid+'"]'); if(!el) return; const y=el.getBoundingClientRect().top+window.scrollY-12;
    if(EMBED){ try{ parent.postMessage({gc:'rolar',y:y},'*'); }catch(e){} } else window.scrollTo({top:Math.max(0,y-80),behavior:'smooth'}); };
  const t0=Date.now();
  (function passo(){
    if(Date.now()-t0>90000) return;                                                    // 90 s e desiste (fonte fora)
    if(state.view!=='strings'||!RD.pv||!RD.pv.rows){ setTimeout(passo,300); return; }
    if(!RD.pv.rows.some(r=>String(r.plant_id)===String(pid))) return;                  // usina nao e desta fonte
    if(state.expandedUsina!==String(pid)) setState({expandedUsina:String(pid),expandedInversor:null});
    const key=state.source+'|'+pid, invs=RD.plants[key];
    if(invs===undefined){ loadPlant(pid); setTimeout(passo,300); return; }
    if(invs===null){ setTimeout(passo,300); return; }
    if(!invQ){ setTimeout(()=>rolar(null),0); return; }
    const inv=acha(invs); if(!inv) return;
    const iid=pid+'-'+inv.id;
    if(/^\d{4}-\d{2}-\d{2}$/.test(dia)&&dia!==_todayISO()) state.invData=dia;         // dia do evento (hoje = padrao)
    if(state.expandedInversor!==iid) toggleInversor(iid,null,pid,inv.id,inv.nome);
    setTimeout(()=>rolar(iid),350); setTimeout(()=>rolar(iid),1600);                 // 2a vez: depois da curva chegar e a altura mudar
  })();
})();
</script>
