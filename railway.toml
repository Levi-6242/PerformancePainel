# Deploy do dashboard Thopen (5080) — Railway.
#
# POR QUE ESTE ARQUIVO ESTÁ NA RAIZ (04/09/2026): existia um railway.toml em
# thopen/deploy/, mas o Railway procura a configuração na RAIZ do repositório. Lá dentro ele
# nunca era lido — e o startCommand de lá já usava `--chdir thopen`, ou seja, foi escrito
# supondo a raiz. Ficava sem efeito.
#
# GRIDCO_SQL_TOKEN não entra aqui: é SEGREDO, vai nas Variables do serviço no painel do
# Railway. Sem ele o app sobe e não lê nada da Gridco Performance API.
#
# --workers 1: cada worker carrega o BD_Thopen inteiro em memória (pico medido de 334 MB).
# Suba para 2 só em plano com folga de RAM.
#
# O app são 16 arquivos (~300 KB): thopen/dashboard_thopen.py, thopen/fonte_api.py,
# thopen/fonte_operacao.py, thopen/operacao_mes.py (os dois da Operação no Mês, 08/10/2026),
# thopen/rondas_cliente.py, thopen/fotos_ronda.py, thopen/contestacao.py (as rondas e a contestação do
# cliente, 09/10/2026), thopen/contestacao_banco.py (a contestação no banco, para o Nexus, 13/10/2026),
# thopen/acessos.py, thopen/livro_banco.py e thopen/templates/entrar.html (o login por pessoa, 14/10/2026),
# thopen/geracao_possivel.py (a geração possível pelo IPOA, 20/10/2026), thopen/trip_os.py (o trip das OS no
# comentário do dia, 23/10/2026), thopen/fonte_zeladoria.py e thopen/zeladoria_cliente.py (a aba Zeladoria, 26/10/2026) e
# thopen/templates/dashboard_thopen.html. O resto de thopen/ (data/, deploy/, logs, .bat,
# .ps1, cache) é local e não faz falta na nuvem. THOPEN_OPERACAO=0 nas Variables desliga a
# Operação no Mês sem deploy de código.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-thopen.txt"

[deploy]
startCommand = "gunicorn dashboard_thopen:app --chdir thopen --bind 0.0.0.0:$PORT --workers 1 --timeout 180"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
